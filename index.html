/* ---------------------------------------------------------------------
   Kleine Bausteine
   --------------------------------------------------------------------- */
function barHTML(pct, opts = {}) {
  const p = Math.max(0, pct || 0);
  return `<div class="bar" role="img" aria-label="${Math.round(p * 100)} Prozent ${opts.max ? 'der Obergrenze' : 'des Richtwerts'}"><i class="${opts.over ? 'over' : ''}" style="width:${(Math.min(p, 1.5) / 1.5 * 100).toFixed(1)}%"></i><b class="tick"></b></div>`;
}
const NOVA_TXT = { 1: 'unverarbeitet', 2: 'verarbeitete Zutat', 3: 'verarbeitet', 4: 'stark verarbeitet' };
const novaPill = n => n ? `<span class="nova n${n}" title="Nova ${n}: ${NOVA_TXT[n]}">Nova ${n}</span>` : '';
const nutriPill = g => g ? `<span class="ns ns-${g}" title="Nutri-Score">Nutri ${g.toUpperCase()}</span>` : '';
const approxMark = on => on ? '<abbr title="Bei manchen Einträgen fehlt diese Angabe. Der echte Wert ist vermutlich höher.">≈</abbr> ' : '';
/* Kennzeichnet selbst angelegte Werte */
function sourceBadge(food) {
  const s = food.source;
  if (s === 'custom' || s === 'recipe' || s === 'supp') return `<span class="badge own">${ICON.user}Deine eigenen Werte</span>`;
  return '';
}
/* Vorschaubild: Foto von Open Food Facts, sonst Feld mit Anfangsbuchstabe (bleibt auch, wenn das Foto nicht lädt) */
function thumbHTML(food, size = '') {
  const letter = esc((String(food.name || '?').trim()[0] || '?').toUpperCase());
  const kind = food.source === 'supp' || food.kind === 'supp' ? 'supp' : '';
  const img = safeImg(food.img);
  return `<span class="thumb ${size} ${kind}" data-l="${letter}" aria-hidden="true">${img ? `<img src="${esc(img)}" alt="" loading="lazy" decoding="async" referrerpolicy="no-referrer" onerror="this.remove()">` : ''}</span>`;
}
const qtyText = (food, qty) => food.source === 'supp' || food.kind === 'supp' ? `${fmtNum(qty, 1)} ${esc(food.unit || 'Stk')}` : `${fmtNum(qty)} g`;
function itemKcal(it) { if (it.kind === 'supp') return null; const v = num(valuesOf(it).kcal); return v == null ? null : v * itemFactor(it); }

function ringsSVG(vals, label) {
  const R = [54, 41, 28], W = 11;
  const parts = vals.map((v, i) => {
    const r = R[i], c = 2 * Math.PI * r, p = Math.max(0, Math.min(1, v.pct || 0));
    const fill = p > 0.004 ? `<circle cx="64" cy="64" r="${r}" class="rf ${v.cls}" stroke-width="${W}" stroke-dasharray="${c.toFixed(2)}" stroke-dashoffset="${(c * (1 - p)).toFixed(2)}" style="--len:${c.toFixed(2)}" transform="rotate(-90 64 64)"/>` : '';
    return `<circle cx="64" cy="64" r="${r}" class="rt ${v.cls}" stroke-width="${W}"/>${fill}`;
  }).join('');
  return `<svg class="rings ${S.animate ? 'intro' : ''}" viewBox="0 0 128 128" role="img" aria-label="${esc(label)}">${parts}</svg>`;
}
function miniRing(p, label) {
  const r = 15, c = 2 * Math.PI * r;
  const f = p > 0.004 ? `<circle cx="18" cy="18" r="${r}" class="mf" stroke-dasharray="${c.toFixed(2)}" stroke-dashoffset="${(c * (1 - Math.min(1, p))).toFixed(2)}" transform="rotate(-90 18 18)"/>` : '';
  return `<svg viewBox="0 0 36 36" aria-hidden="true"><circle cx="18" cy="18" r="${r}" class="mt"/>${f}<text x="18" y="22.4" text-anchor="middle">${label}</text></svg>`;
}

/* ---------------------------------------------------------------------
   Seite: Heute
   --------------------------------------------------------------------- */
function dayTitle(date) {
  const t = todayStr();
  if (date === t) return 'Heute';
  if (date === shiftDate(t, -1)) return 'Gestern';
  if (date === shiftDate(t, 1)) return 'Morgen';
  return WD_LONG[wdIdx(parseDate(date))];
}
function dayHeadHTML(date) {
  const d = parseDate(date);
  return `<div class="dayhead">
    <button class="dayttl" data-action="day-today" title="Zu heute springen"><span class="t">${dayTitle(date)}</span><span class="s">${WD_SHORT[wdIdx(d)]}, ${d.getDate()}. ${MON_LONG[d.getMonth()]} ${d.getFullYear()}</span></button>
    <button class="icon-btn" data-action="day-shift" data-n="-1" aria-label="Vorheriger Tag">${ICON.left}</button>
    <button class="icon-btn" data-action="day-shift" data-n="1" aria-label="Nächster Tag">${ICON.right}</button></div>`;
}
function stripHTML() {
  return `<div class="strip" role="group" aria-label="Tage dieser Woche">${weekDates(S.monday).map(date => {
    const day = getDay(date), d = parseDate(date), has = day.items.length > 0;
    const sc = has ? nutrientScore(sumItems(day.items), targetsFor(date)).score : 0;
    return `<button class="tile ${date === S.selected ? 'sel' : ''} ${date === todayStr() ? 'today' : ''}" data-action="select" data-date="${date}" aria-pressed="${date === S.selected}" aria-label="${dateLabel(date)}${has ? `, Nährstoff-Score ${sc}` : ', nichts eingetragen'}">
      <span class="wd">${WD_SHORT[wdIdx(d)]}</span>${miniRing(has ? sc / 100 : 0, d.getDate())}</button>`;
  }).join('')}</div>`;
}

function heroHTML(date, day, tot, targets) {
  const sport = dayBurn(day);
  const kt = kcalTarget(effProfile(date), sport);
  const kc = tot.kcal.sum, pr = tot.protein.sum, pt = targets.protein.value;
  const sc = nutrientScore(tot, targets);
  const kLine = kt
    ? (kc <= kt ? `${fmtNum(kt - kc)} kcal übrig` : `${fmtNum(kc - kt)} kcal über deinem Ziel`) + (sport ? `, inkl. ${fmtNum(sport)} kcal Sport` : '')
    : '<button class="link" data-action="goto-profile">Kalorienziel festlegen</button>';
  const rings = ringsSVG([{ pct: kt ? kc / kt : 0, cls: 'e' }, { pct: pr / pt, cls: 'p' }, { pct: sc.score / 100, cls: 'm' }],
    `Kalorien ${fmtNum(kc)}${kt ? ' von ' + fmtNum(kt) : ''}, Eiweiß ${fmtNum(pr)} von ${fmtNum(pt)} Gramm, Nährstoff-Score ${sc.score} von 100`);
  return `<section class="card hero">${rings}<div class="hstats">
    <div class="hstat"><i class="key e"></i><div><span class="lbl">Kalorien</span><div class="val">${approxMark(tot.kcal.missing > 0)}<b>${fmtNum(kc)}</b><span>${kt ? ' / ' + fmtNum(kt) : ''} kcal</span></div><small>${kLine}</small></div></div>
    <div class="hstat"><i class="key p"></i><div><span class="lbl">Eiweiß</span><div class="val">${approxMark(tot.protein.missing > 0)}<b>${fmtNum(pr)}</b><span> / ${fmtNum(pt)} g</span></div><small>${pr >= pt ? 'Ziel erreicht' : `noch ${fmtNum(pt - pr)} g`}</small></div></div>
    <div class="hstat"><i class="key m"></i><div><span class="lbl">Nährstoff-Score</span><div class="val"><b>${sc.score}</b><span> / 100</span></div><small>${sc.covered} von ${sc.total} Vitaminen und Mineralstoffen gedeckt</small></div></div>
  </div></section>`;
}

function suggLine(key, target, P) {
  const s = suggestFor(key, P, target, 1)[0];
  const gen = GOOD_SOURCES[key] ? `Gute Quellen sind zum Beispiel ${GOOD_SOURCES[key]}.` : '';
  if (s && s.pct >= 0.15) return `<p class="sugg">${ICON.spark}<span><b>${esc(s.food.name)}</b> (${qtyText(s.food, s.qty)}${s.supp ? ', Ergänzung' : ''}) bringt ${fmtNum(s.amount, decOf(key))} ${unitOf(key)}, das sind ${pctTxt(s.pct)} deines Tagesziels.</span></p>`;
  if (s) return `<p class="sugg">${ICON.spark}<span>Von deinem bisherigen Essen bringt ${esc(s.food.name)} am meisten, aber nur ${pctTxt(s.pct)}. ${gen}</span></p>`;
  return `<p class="sugg">${ICON.spark}<span>${gen || 'In deinem bisherigen Essen steckt davon kaum etwas.'}</span></p>`;
}
function gapsHTML(date, day, tot, targets) {
  const isToday = date === todayStr();
  if (!day.items.length) {
    return `<section class="card empty-card"><h2>${isToday ? 'Was hast du heute gegessen?' : 'Für diesen Tag ist nichts eingetragen.'}</h2>
      <p>Trag dein Essen ein. Hier siehst du dann sofort, welche Vitamine und Nährstoffe dir noch fehlen und womit du sie auffüllen kannst.</p>
      <button class="btn primary" data-action="add">${ICON.plus} Essen eintragen</button></section>`;
  }
  const gaps = findGaps(tot, targets, GAP_KEYS.length, day.items);
  const { over, noData } = gaps;
  const wk = last7(date), weekPct = {};
  for (const g of gaps.low) weekPct[g.key] = avgPct(wk, g.key, targets[g.key]);
  const low = orderGaps(gaps.low, weekPct).slice(0, 3);
  const P = pool();
  const items = low.map(g => {
    const t = targets[g.key], rest = Math.max(0, t.value - tot[g.key].sum);
    const extra = g.weekOk
      ? `<p class="sugg ok">${ICON.check}<span>Speichert der Körper. Im 7-Tage-Schnitt hast du ${pctTxt(weekPct[g.key])}, heute ist das also kein Problem.</span></p>`
      : suggLine(g.key, t, P);
    return `<li data-action="nut-info" data-key="${g.key}" role="button" tabindex="0" class="tap"><div class="gtop"><span class="gname">${labelOf(g.key)} <span class="info-i" aria-hidden="true">i</span></span><span class="gval">${approxMark(g.approx)}${pctTxt(g.pct)}</span></div>
      ${barHTML(g.pct)}<p class="grest">Noch ${fmtNum(rest, decOf(g.key))} ${unitOf(g.key)} bis zum Tagesziel von ${fmtNum(t.value, decOf(g.key))} ${unitOf(g.key)}</p>${extra}</li>`;
  }).join('');
  const ov = over.map(o => `<p class="warn">${ICON.warn}<span><b>Zu viel ${labelOf(o.key)}:</b> ${fmtNum(tot[o.key].sum, decOf(o.key))} ${unitOf(o.key)}, empfohlen sind höchstens ${fmtNum(targets[o.key].value, decOf(o.key))} ${unitOf(o.key)}.</span></p>`).join('');
  const body = low.length ? `<ul class="gaplist">${items}</ul>` : `<p class="done">${ICON.check}<span>Alle Vitamine, Mineralstoffe, Eiweiß und Ballaststoffe sind gedeckt.</span></p>`;
  return `<section class="card gaps"><h2>${isToday ? 'Das fehlt dir heute noch' : 'Lücken an diesem Tag'}</h2>${body}${ov}
    ${noData.length ? `<p class="foot">Keine Daten in deinen Einträgen zu: ${noData.map(labelOf).join(', ')}. Viele Produkte geben diese Werte nicht an. Im Score zählen sie als 0.</p>` : ''}
    ${isToday && low.length ? '<p class="foot">Stand jetzt, das füllt sich mit jeder Mahlzeit. Die Tipps kommen aus Lebensmitteln, die du schon gegessen hast.</p>' : ''}</section>`;
}

function itemRow(it, date) {
  const kc = itemKcal(it);
  const meta = [qtyText(it, it.kind === 'supp' ? it.qty : it.grams), it.time ? esc(it.time) : '', it.brand ? esc(it.brand) : ''].filter(Boolean).join(' · ');
  return `<li><button class="row" data-action="edit-item" data-date="${date}" data-id="${esc(it.id)}">${thumbHTML(it)}<span class="rname"><span class="rn">${esc(it.name)}</span><small>${meta}</small></span>${novaPill(it.nova)}<span class="rk">${kc != null ? `${fmtNum(kc)}<small> kcal</small>` : ''}</span></button></li>`;
}
function mealsHTML(date, day) {
  const items = sortItems(day.items);
  const meals = MEALS.filter(m => m.id !== 'erg' || items.some(i => i.meal === 'erg') || S.lib.supplements.length);
  return `<section class="card meals" aria-label="Mahlzeiten">${meals.map(m => {
    const list = items.filter(i => i.meal === m.id);
    const kc = list.reduce((a, it) => a + (itemKcal(it) || 0), 0);
    return `<div class="meal"><div class="mhead"><h3>${m.label}</h3><span class="mk">${m.id !== 'erg' && list.length ? fmtNum(kc) + ' kcal' : ''}</span>
      <button class="icon-btn sm" data-action="meal-menu" data-meal="${m.id}" aria-label="Mehr für ${m.label}: kopieren, Vorlagen">${ICON.more}</button>
      <button class="icon-btn sm accent" data-action="add" data-meal="${m.id}" aria-label="${m.label}: Essen hinzufügen">${ICON.plus}</button></div>
      ${list.length ? `<ul class="rows">${list.map(it => itemRow(it, date)).join('')}</ul>` : ''}</div>`;
  }).join('')}</section>`;
}
function waterHTML(date, day) {
  return `<section class="card water"><div class="whead"><h2>Wasser</h2><span class="wval"><b>${fmtNum(day.water / 1000, 2)}</b> / ${fmtNum(WATER_TARGET / 1000, 1)} l</span></div>
    ${barHTML(day.water / WATER_TARGET)}
    <div class="wbtns"><button class="chipbtn" data-action="water" data-date="${date}" data-ml="250">+ Glas, 250 ml</button><button class="chipbtn" data-action="water" data-date="${date}" data-ml="500">+ Flasche, 500 ml</button><button class="chipbtn" data-action="water" data-date="${date}" data-ml="-250" aria-label="250 Milliliter abziehen">−250</button></div></section>`;
}

const NOVA_META = { 1: ['Nova 1, unverarbeitet', 'var(--nova1)'], 2: ['Nova 2, verarbeitete Zutaten', 'var(--nova2)'], 3: ['Nova 3, verarbeitet', 'var(--nova3)'], 4: ['Nova 4, stark verarbeitet', 'var(--nova4)'], 0: ['Keine Angabe', 'var(--surface2)'] };
function novaHTML(items) {
  const foods = items.filter(it => it.kind !== 'supp');
  if (!foods.length) return '';
  const c = countNova(foods), total = foods.length;
  const segs = [1, 2, 3, 4, 0].filter(k => c[k]).map(k => `<span style="width:${c[k] / total * 100}%;background:${NOVA_META[k][1]}"></span>`).join('');
  const legend = [1, 2, 3, 4, 0].filter(k => c[k]).map(k => `<li><span class="dot" style="background:${NOVA_META[k][1]}"></span>${NOVA_META[k][0]}: ${c[k]} von ${total}</li>`).join('');
  return `<h3 class="ng">Verarbeitungsgrad</h3><div class="nova-bar" role="img" aria-label="Verteilung der Nova-Gruppen">${segs}</div><ul class="legend">${legend}</ul>`;
}
function nutrientsHTML(tot, targets, items) {
  if (!items.length) return `<section class="card"><div class="chead"><h2>Nährstoffe</h2></div><p class="empty">Sobald du etwas einträgst, siehst du hier über 30 Nährstoffe im Vergleich zu deinem Bedarf.</p></section>`;
  const row = key => {

    return `<div class="nrow tap" data-action="nut-info" data-key="${key}" role="button" tabindex="0"><span class="nn">${n.label}</span><span class="nv">${approxMark(e.missing > 0)}<b>${fmtNum(e.sum, n.dec)}</b>${t ? ` / ${t.type === 'max' ? 'max. ' : ''}${fmtNum(t.value, n.dec)}` : ''} ${n.unit}</span>${t ? barHTML(p, { over: t.type === 'max' && p > 1, max: t.type === 'max' }) : ''}</div>`;
  };

      const t = targets[k], p = tot[k].sum / t.value; return t.type === 'max' ? p > 1 : p < 1;

  }

      <button data-action="nut-view" data-v="gaps" aria-pressed="${S.nutView === 'gaps'}">Lücken</button><button data-action="nut-view" data-v="all" aria-pressed="${S.nutView === 'all'}">Alle</button></div></div>
    ${body}<p class="foot">Der Strich markiert 100 % des Richtwerts (vereinfacht nach D-A-CH, Wasser nach DGE, Koffein nach EFSA, kein medizinischer Rat). Gesättigte Fette: dein eigenes Limit von ${Math.round(SATFAT_SHARE * 100)} % der Kalorien. ≈ heißt: Bei manchen Einträgen fehlen Angaben, der echte Wert ist vermutlich höher. Bei Nahrungsergänzung wird nicht auf Obergrenzen geprüft.</p></section>`;
}

function weekLabel(monday = S.monday) {
  const a = monday, b = addDays(a, 6);
  return `${a.getDate()}. ${MON[a.getMonth()]} bis ${b.getDate()}. ${MON[b.getMonth()]} ${b.getFullYear()}`;
}
function weekBarHTML(title) {
  const isNow = fmtDate(S.monday) === fmtDate(mondayOf(new Date()));
  return `<div class="weekbar"><div class="t"><b>${title}</b><span>${isNow ? 'Diese Woche, ' : ''}${weekLabel()}</span></div>
    <button class="icon-btn" data-action="prev-week" aria-label="Vorherige Woche">${ICON.left}</button>
    <button class="icon-btn" data-action="next-week" aria-label="Nächste Woche">${ICON.right}</button></div>
    <div class="seg pagetabs" role="group" aria-label="Ansicht"><button data-action="week-view" data-v="stats" aria-pressed="${S.weekView !== 'shop'}">Auswertung</button><button data-action="week-view" data-v="shop" aria-pressed="${S.weekView === 'shop'}">Einkauf</button></div>`;
}
const deltaTxt = (a, b, dec = 0, unit = '') => (a == null || b == null) ? 'Keine Daten zur Vorwoche' : `${a - b >= 0 ? '+' : '−'}${fmtNum(Math.abs(a - b), dec)}${unit} zur Vorwoche`;
function heatHTML(dates, targets) {
  const keys = GAP_KEYS.filter(k => targets[k]);
  const dayItems = dates.map(d => getDay(d).items);
  const tots = dayItems.map(items => items.length ? sumItems(items) : null);
  const lvl = p => p >= 1 ? 4 : p >= 0.75 ? 3 : p >= 0.5 ? 2 : p >= 0.25 ? 1 : 0;
  const head = `<span></span>${dates.map(d => `<span class="hd">${WD_SHORT[wdIdx(parseDate(d))]}</span>`).join('')}`;
  const rows = keys.map(k => `<span class="rl" title="${labelOf(k)}">${labelOf(k)}</span>${tots.map((t, i) => {
    if (!t) return `<span class="c none" title="${dateLabel(dates[i])}: nichts eingetragen"></span>`;
    if (!hasData(dayItems[i], k)) return `<span class="c none" title="${labelOf(k)}, ${dateLabel(dates[i])}: keine Daten"></span>`;
    const p = t[k].sum / targets[k].value;
    return `<span class="c h${lvl(p)}" title="${labelOf(k)}, ${dateLabel(dates[i])}: ${pctTxt(p)}"></span>`;
  }).join('')}`).join('');
  const lg = [['h0', 'unter 25 %'], ['h1', '25 bis 50 %'], ['h2', '50 bis 75 %'], ['h3', '75 bis 100 %'], ['h4', '100 % und mehr']]
    .map(([c, l]) => `<span><i class="c ${c}" style="background:var(--heat${c.slice(1)})"></i>${l}</span>`).join('') + '<span><i style="border:1px dashed var(--line)"></i>keine Daten</span>';
  return `<section class="card"><h2>Woche auf einen Blick</h2><p class="hint">Jedes Kästchen zeigt, wie viel vom Tagesziel du an dem Tag erreicht hast. Genaue Werte stehen oben in der Tagesansicht.</p>
    <div class="heat" role="img" aria-label="Übersicht der Nährstoffabdeckung pro Tag">${head}${rows}</div><div class="hlegend">${lg}</div></section>`;
}
function weekHTML() {

  const ref = dates[6] <= todayStr() ? dates[6] : todayStr();

  const wc = weekCheck(dates.map(getDay), prev.map(getDay), targets);
  const head = weekBarHTML('Woche');
  if (!wc.days) return `${head}<div class="stack"><section class="card empty-card"><h2>In dieser Woche ist noch nichts eingetragen.</h2><p>Sobald du an ein paar Tagen Essen einträgst, siehst du hier, welche Nährstoffe dir oft fehlen und wie sich die Woche zur letzten verändert.</p></section>${historyHTML()}</div>`;
  const P = pool();
  const kpi = (l, v, unit, d) => `<div class="kpi"><div class="l">${l}</div><div class="v">${v}${unit ? `<span> ${unit}</span>` : ''}</div><div class="d">${d}</div></div>`;

    ${kpi('Kalorien pro Tag', fmtNum(wc.kcal), 'kcal', deltaTxt(wc.kcal, wc.prevKcal))}
    ${kpi('Eiweiß pro Tag', fmtNum(wc.protein), 'g', deltaTxt(wc.protein, wc.prevProtein, 0, ' g'))}
    ${kpi('Stark verarbeitet', wc.nova4 == null ? '–' : Math.round(wc.nova4 * 100), wc.nova4 == null ? '' : '%', wc.nova4 == null || wc.prevNova4 == null ? 'Anteil deiner Einträge mit Nova 4' : deltaTxt(wc.nova4 * 100, wc.prevNova4 * 100, 0, ' Punkte'))}</div>`;
  const often = wc.often.length ? `<ul class="often">${wc.often.slice(0, 5).map(r => `<li data-action="nut-info" data-key="${r.key}" role="button" tabindex="0" class="tap"><div class="gtop"><span class="gname">${labelOf(r.key)}</span><span class="gval">${approxMark(r.approx)}Ø ${pctTxt(r.avgPct)}</span></div>
      ${barHTML(r.avgPct)}<p class="grest">An ${r.below} von ${wc.days} Tagen unter dem Ziel${r.veryLow ? `, davon ${r.veryLow}-mal unter der Hälfte` : ''}.</p>${suggLine(r.key, targets[r.key], P)}</li>`).join('')}</ul>`
    : `<p class="done">${ICON.check}<span>Kein Nährstoff war an der Mehrheit der Tage zu niedrig.</span></p>`;
  const nd = wc.noData.length ? `<p class="foot">Keine Daten in dieser Woche zu: ${wc.noData.map(labelOf).join(', ')}.</p>` : '';

  return `${head}<div class="stack">${kpis}
    <div class="cols"><div class="col"><section class="card"><h2>Oft zu wenig</h2><p class="hint">Nährstoffe, die an mindestens der Hälfte der ${wc.days} eingetragenen Tage unter dem Ziel lagen.</p>${often}${over}${nd}</section>
      <section class="card"><h2>Läuft gut</h2><p class="hint">An jedem eingetragenen Tag gedeckt.</p>${good}</section></div>
      <div class="col">${heatHTML(dates, targets)}</div></div>

function histMetrics() {
  return [{ key: 'kcal', label: 'Kalorien', unit: 'kcal', dec: 0 },
    ...NUTRIENTS.map(n => ({ key: n.key, label: n.label, unit: n.unit, dec: n.dec })),
    { key: 'score', label: 'Nährstoff-Score', unit: 'Punkte', dec: 0 },
    { key: 'water', label: 'Wasser', unit: 'ml', dec: 0 },
    { key: 'weight', label: 'Körpergewicht', unit: 'kg', dec: 1 }];
}
function seriesForMetric(key, dates) {
  if (key !== 'score') return seriesFor(key, dates, S.days);
  return dates.map(date => { const d = S.days[date]; return { date, value: d && d.items.length ? nutrientScore(sumItems(d.items), targetsFor(date)).score : null }; });
}
function chartHTML(series, meta, target) {
  const W = Math.round(Math.max(330, Math.min(720, (window.innerWidth || 720) - 70))), H = W < 500 ? 220 : 260, L = 44, R = 10, T = 18, B = 28, iw = W - L - R, ih = H - T - B;
  const vals = series.map(s => s.value).filter(v => v !== null);
  if (!vals.length) return '<p class="empty">In diesem Zeitraum gibt es noch keine Daten.</p>';
  const isLine = meta.key === 'weight';
  let lo = 0, hi = Math.max(...vals, target && !isLine ? target.value : 0);
  if (isLine) { lo = Math.min(...vals); hi = Math.max(...vals); const p = Math.max(0.5, (hi - lo) * 0.25); lo = Math.floor(lo - p); hi = Math.ceil(hi + p); }
  else hi = niceMax(hi);
  const yOf = v => T + ih - (v - lo) / (hi - lo) * ih;
  const N = series.length, slot = iw / N, xC = i => L + slot * (i + 0.5);
  const tdec = hi - lo < 10 ? 1 : 0;
  let g = '';
  for (let i = 0; i <= 4; i++) {
    const v = lo + (hi - lo) * i / 4, y = yOf(v);
    g += `<line x1="${L}" x2="${W - R}" y1="${y.toFixed(1)}" y2="${y.toFixed(1)}" stroke="var(--line)" stroke-width="1"/><text x="${L - 8}" y="${(y + 4).toFixed(1)}" text-anchor="end" font-size="11" fill="var(--muted)">${fmtNum(v, tdec)}</text>`;
  }
  const step = Math.ceil(N / (W < 500 ? 5 : 8));
  series.forEach((s, i) => { if (i % step === 0) g += `<text x="${xC(i).toFixed(1)}" y="${H - 8}" text-anchor="middle" font-size="11" fill="var(--muted)">${shortDate(s.date)}</text>`; });
  let marks = '';
  if (!isLine) {
    const bw = Math.max(2, Math.min(24, slot * 0.66)), yb = T + ih;
    series.forEach((s, i) => {
      if (s.value === null || s.value <= 0) return;
      const h = Math.max(1, (s.value - lo) / (hi - lo) * ih), y = yb - h, x = xC(i) - bw / 2, r = Math.min(4, bw / 2, h);
      marks += `<path d="M${x.toFixed(1)} ${yb} V${(y + r).toFixed(1)} Q${x.toFixed(1)} ${y.toFixed(1)} ${(x + r).toFixed(1)} ${y.toFixed(1)} H${(x + bw - r).toFixed(1)} Q${(x + bw).toFixed(1)} ${y.toFixed(1)} ${(x + bw).toFixed(1)} ${(y + r).toFixed(1)} V${yb} Z" fill="var(--micro)"/>`;
    });
  } else {
    const pts = series.map((s, i) => s.value === null ? null : [xC(i), yOf(s.value)]).filter(Boolean);
    if (pts.length > 1) marks += `<polyline points="${pts.map(p => p[0].toFixed(1) + ',' + p[1].toFixed(1)).join(' ')}" fill="none" stroke="var(--micro)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>`;
    pts.forEach(p => { marks += `<circle cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="4" fill="var(--micro)" stroke="var(--surface)" stroke-width="2"/>`; });
  }
  let tline = '';
  if (target && !isLine && target.value <= hi) {
    const y = yOf(target.value);
    tline = `<line x1="${L}" x2="${W - R}" y1="${y.toFixed(1)}" y2="${y.toFixed(1)}" stroke="var(--text)" stroke-width="1.5" stroke-dasharray="5 4" opacity=".7"/>`;
  }
  const focusable = N <= 31 ? 'tabindex="0"' : '';
  const hits = series.map((s, i) => {
    const txt = `${dateLabel(s.date)}: ${s.value === null ? 'keine Daten' : fmtNum(s.value, meta.dec) + ' ' + meta.unit}`;
    return `<rect class="hit" x="${(L + slot * i).toFixed(1)}" y="${T}" width="${slot.toFixed(1)}" height="${ih}" data-tip="${esc(txt)}" aria-label="${esc(txt)}" ${focusable}></rect>`;
  }).join('');
  const avg = vals.reduce((a, b) => a + b, 0) / vals.length;
  return `<svg class="chart ${S.hist.loading ? 'loading' : ''}" viewBox="0 0 ${W} ${H}" role="group" aria-label="${esc(meta.label)}, ${N} Tage, Durchschnitt ${fmtNum(avg, meta.dec)} ${meta.unit}">${g}${tline}${marks}${hits}</svg>`;
}
function historyHTML() {
  const metrics = histMetrics();
  const meta = metrics.find(m => m.key === S.hist.metric) || metrics[1];
  const dates = histDates(S.hist.range);
  const series = seriesForMetric(meta.key, dates);
  const vals = series.map(s => s.value).filter(v => v !== null);
  const targets = targetsFor(todayStr());
  const target = meta.key === 'water' ? { value: WATER_TARGET, type: 'min' } : meta.key === 'kcal' ? (kcalTarget(effProfile(todayStr())) ? { value: kcalTarget(effProfile(todayStr())), type: 'min' } : null) : targets[meta.key];
  const stat = (v, l) => `<div class="stat"><b>${v}</b><span>${l}</span></div>`;
  const stats = vals.length ? `<div class="stats">${stat(fmtNum(vals.reduce((a, b) => a + b, 0) / vals.length, meta.dec) + ' ' + meta.unit, `Durchschnitt, ${vals.length} Tage mit Daten`)}${stat(fmtNum(Math.max(...vals), meta.dec) + ' ' + meta.unit, 'Höchster Wert')}${stat(fmtNum(Math.min(...vals), meta.dec) + ' ' + meta.unit, 'Niedrigster Wert')}</div>` : '';
  const rows = series.filter(s => s.value !== null).map(s => `<tr><td>${dateLabel(s.date)}</td><td class="r">${fmtNum(s.value, meta.dec)} ${meta.unit}</td></tr>`).join('');
  return `<section class="card"><div class="chead"><h2>Verlauf</h2><div class="seg" role="group" aria-label="Zeitraum">${[7, 30, 90].map(n => `<button data-action="hist-range" data-range="${n}" aria-pressed="${S.hist.range === n}">${n} Tage</button>`).join('')}</div></div>
    <div class="controls" style="margin-bottom:8px"><label class="sr-only" for="hmetric">Wert</label>
      <select id="hmetric" class="input" data-hist="metric" style="max-width:340px">${metrics.map(m => `<option value="${m.key}" ${m.key === meta.key ? 'selected' : ''}>${m.label} (${m.unit})</option>`).join('')}</select></div>
    ${target && meta.key !== 'weight' ? `<p class="hint" style="display:flex;align-items:center;gap:8px"><svg width="22" height="4" aria-hidden="true"><line x1="0" x2="22" y1="2" y2="2" stroke="var(--text)" stroke-width="1.5" stroke-dasharray="5 4" opacity=".7"/></svg>${target.type === 'max' ? 'Obergrenze' : 'Dein Ziel'}: ${fmtNum(target.value, meta.dec)} ${meta.unit}</p>` : ''}
    ${chartHTML(series, meta, target)}${stats}
    ${rows ? `<details class="tbl"><summary>Zahlen anzeigen</summary><table><thead><tr><th>Tag</th><th class="r">${esc(meta.label)}</th></tr></thead><tbody>${rows}</tbody></table></details>` : ''}</section>`;
}
async function ensureHistory() {

const exMapNow = () => exerciseMap(S.gym);
const GROUP_COLOR = { brust: 'var(--energy)', ruecken: 'var(--protein)', schultern: '#8B7CF6', arme: 'var(--micro)', bauch: 'var(--nova3)', beine: '#4C8DF6', gesaess: '#E0569B', cardio: 'var(--danger)' };
const groupOf = e => e.type === 'cardio' ? 'cardio' : (MUSCLE_GROUPS.find(g => g.m.includes((e.primary || [])[0])) || { id: 'arme' }).id;
const fmtClock = s => { s = Math.max(0, Math.floor(s)); const h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60), x = s % 60; return h ? `${h}:${pad(m)}:${pad(x)}` : `${m}:${pad(x)}`; };
const fmtDur = min => min >= 60 ? `${Math.floor(min / 60)}:${pad(min % 60)} h` : `${min} Min.`;
const normTxt = s => String(s || '').toLowerCase().replace(/ä/g, 'a').replace(/ö/g, 'o').replace(/ü/g, 'u').replace(/ß/g, 'ss').replace(/ae/g, 'a').replace(/oe/g, 'o').replace(/ue/g, 'u');

  if (d.type === 'zeit') return `${fmtNum(b)} s${a ? ' + ' + fmtNum(a, 1) + ' kg' : ''}`;

}
const targetTxt = (d, e) => {

  return d.type === 'zeit' ? `${r} s` : r;
};

/* Training ändern. Ohne Neuzeichnen, damit Eingabefelder ihren Fokus behalten */

  if (render) return updateDay(date, apply);

function filterExercises(q, grp) {

function exCardHTML(w, e, i, exMap) {

      <input class="sin" inputmode="decimal" autocomplete="off" aria-label="Satz ${j + 1}, ${cols[1]}" data-set="${i}:${j}:b" value="${esc(inputNum(s.b, 2))}" placeholder="${esc(phB)}">
      <button class="sdone" data-action="set-done" data-i="${i}" data-j="${j}" aria-pressed="${s.done}" aria-label="Satz ${j + 1} erledigt">${ICON.checkSm}</button></div>`;

}
/* Werte aus allen Satz-Feldern in den Zustand übernehmen (ohne Neuzeichnen) */
function syncSetInputs() {
  const act = activeWorkout(); if (!act) return;
  const vals = $$('input[data-set]').map(inp => {
    const [i, j, f] = inp.dataset.set.split(':'); const v = parseDecimal(inp.value);
    return { i: +i, j: +j, f, v: Number.isNaN(v) ? undefined : v };
  });
  const cur = act.w;
  if (!vals.some(x => { const s = cur.exercises[x.i] && cur.exercises[x.i].sets[x.j]; return s && x.v !== undefined && s[x.f] !== x.v; })) return;
  updateWorkout(act.date, cur.id, w => {
    for (const x of vals) { const s = w.exercises[x.i] && w.exercises[x.i].sets[x.j]; if (s && x.v !== undefined) s[x.f] = x.v; }
  }, false);
}

/* Pausen-Timer */
const REST = { end: 0, total: 0, fired: true };
function startRest(sec) {
  if (!(sec > 0)) return;
  REST.total = sec; REST.end = Date.now() + sec * 1000; REST.fired = false;
  try { localStorage.setItem('np:rest', JSON.stringify(REST)); } catch { /* egal */ }
  renderRest();
}
function stopRest() { REST.end = 0; REST.fired = true; try { localStorage.removeItem('np:rest'); } catch { /* egal */ } renderRest(); }
function renderRest() {
  const el = $('#rest'); if (!el) return;
  const left = Math.ceil((REST.end - Date.now()) / 1000);
  if (!REST.end || left <= 0) { el.hidden = true; document.body.classList.remove('resting'); return; }
  if (!el.dataset.built) {
    el.innerHTML = `<span class="rl">Pause</span><b id="rtime"></b><button class="rbtn" data-action="rest-add" data-s="-15" aria-label="15 Sekunden weniger">−15</button><button class="rbtn" data-action="rest-add" data-s="15" aria-label="15 Sekunden mehr">+15</button><button class="rbtn" data-action="rest-skip">Weiter</button><span class="rbar"><i id="rfill"></i></span>`;
    el.dataset.built = '1';
  }
  el.hidden = false; document.body.classList.add('resting');
  $('#rtime').textContent = fmtClock(left);
  $('#rfill').style.width = Math.max(0, Math.min(100, left / REST.total * 100)).toFixed(1) + '%';
}
let audioCtx = null;
function unlockAudio() {
  try { audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)(); if (audioCtx.state === 'suspended') audioCtx.resume(); } catch { /* kein Ton */ }
}
function beep() {
  if (!audioCtx) return;
  try {
    for (const t of [0, 0.22]) {
      const o = audioCtx.createOscillator(), g = audioCtx.createGain(), at = audioCtx.currentTime + t;
      o.frequency.value = 880; g.gain.setValueAtTime(0.0001, at); g.gain.exponentialRampToValueAtTime(0.25, at + 0.02); g.gain.exponentialRampToValueAtTime(0.0001, at + 0.18);
      o.connect(g); g.connect(audioCtx.destination); o.start(at); o.stop(at + 0.2);
    }
  } catch { /* kein Ton */ }
}
function tick() {
  const act = activeWorkout();
  const el = $('#wclock'), ab = $('#abclock');
  if (act && !act.w.reopenEnd) { const t = fmtClock((Date.now() - act.w.startTs) / 1000); if (el) el.textContent = t; if (ab) ab.textContent = t; }
  if (REST.end && !REST.fired && Date.now() >= REST.end) {
    REST.fired = true; REST.end = 0;
    try { localStorage.removeItem('np:rest'); } catch { /* egal */ }
    if (navigator.vibrate) navigator.vibrate([200, 100, 200]);
    beep(); toast('Pause vorbei. Weiter mit dem nächsten Satz.');
  }
  renderRest();
}

/* Training starten, beenden, verwerfen */
async function startWorkout(planId) {
  const act = activeWorkout();
  if (act) { S.page = 'train'; renderAll(); toast('Es läuft schon ein Training.'); return; }
  const date = todayStr();
  if (!(await ensureDay(date))) return;
  const exMap = exMapNow(), plan = planId ? S.gym.plans.find(p => p.id === planId) : null;
  const w = newWorkout(plan, S.gym.goal, exMap);
  S.page = 'train'; window.scrollTo(0, 0);
  await updateDay(date, d => { d.workouts.push(w); });
  if (!plan) openExPicker('workout');
}
function openFinish() {
  syncSetInputs();
  const act = activeWorkout(); if (!act) return;
  const exMap = exMapNow(), w = act.w, st = workoutStats(w, exMap);
  const open = w.exercises.reduce((a, e) => a + e.sets.filter(s => !s.done).length, 0);
  if (!st.sets) {
    confirmSheet('Noch kein Satz abgehakt', 'Nur abgehakte Sätze werden gespeichert. Hak deine Sätze mit dem Haken ab, oder verwirf das Training.', w.backup ? 'Änderungen verwerfen' : 'Training verwerfen', discardWorkout, true);
    return;
  }
  S.modal = { type: 'finish' };
  $('#modal-root').innerHTML = modalShell(w.backup ? 'Änderungen speichern' : 'Training beenden', '', `<form data-form="w-finish">
    <div class="mini"><div><b>${w.reopenEnd ? fmtDur(Math.round((w.reopenEnd - w.startTs) / 60000)) : fmtDur(st.minutes)}</b><span>Dauer</span></div><div><b>${st.sets}</b><span>Sätze</span></div><div><b>${fmtNum(st.volume)}</b><span>kg Volumen</span></div><div><b>${st.exercises}</b><span>Übungen</span></div></div>
    <div class="field"><label for="wn">Name</label><input id="wn" name="name" value="${esc(w.name)}" maxlength="60"></div>
    ${open ? `<p class="hint">${open === 1 ? '1 Satz ist nicht abgehakt und wird' : `${open} Sätze sind nicht abgehakt und werden`} nicht gespeichert.</p>` : ''}
    <div class="sheet-actions"><button class="btn primary" type="submit">Speichern</button><button class="btn" type="button" data-action="close-modal">Weiter trainieren</button></div></form>`);
}
async function finishWorkout(name) {
  const act = activeWorkout(); if (!act) return;
  const exMap = exMapNow(), kg = effProfile(act.date).weight || 75, date = act.date;
  let fin = null;
  await updateWorkout(date, act.w.id, w => {
    if (name) w.name = name;
    w.endTs = w.reopenEnd || Date.now();
    w.active = false; w.reopenEnd = null; w.backup = null;
    w.exercises = w.exercises.map(e => ({ ...e, sets: e.sets.filter(s => s.done) })).filter(e => e.sets.length);
    w.kcal = workoutKcal(w, kg, exMap);
    fin = clean(w);
  });
  if (!fin) return;
  const prs = [];
  for (const e of fin.exercises) {
    const d = exMap[e.exId];
    if (!d || d.type !== 'kraft' || prs.some(p => p.exId === e.exId)) continue;
    const before = histBest((S.gym.hist[e.exId] || []).filter(x => x.wid !== fin.id)).e1rm;
    const now = Math.max(0, ...e.sets.map(s => e1rm(s.a, s.b)));
    if (before > 0 && now > before + 0.01) prs.push({ exId: e.exId, name: d.name, v: now });
  }
  await updateGym(g => { g.hist = histWith(g.hist, fin, date, exMap); });
  stopRest();
  openSummary(date, fin, prs);
}
function openSummary(date, w, prs) {
  const st = workoutStats(w, exMapNow());
  S.modal = { type: 'summary' };
  $('#modal-root').innerHTML = modalShell('Training gespeichert', dateLabel(date), `<div class="sumhero">${ICON.trophy}<h3>${esc(w.name)}</h3><p class="muted">Stark gemacht.</p></div>

    ${prs.length ? `<p class="secttl">Neue Bestleistungen</p><ul class="contrib">${prs.map(p => `<li><span>${esc(p.name)}</span><b>${fmtNum(p.v, 1)} kg 1RM</b></li>`).join('')}</ul>` : ''}

}
async function discardWorkout() {
  const act = activeWorkout(); if (!act) return;
  stopRest();
  if (act.w.backup) {
    let b = null; try { b = JSON.parse(act.w.backup); } catch { b = null; }
    if (b) {
      await updateWorkout(act.date, act.w.id, w => { w.name = b.name; w.exercises = b.exercises; w.kcal = b.kcal; w.endTs = b.endTs; w.active = false; w.reopenEnd = null; w.backup = null; });
      toast('Änderungen verworfen.'); return;
    }
  }
  await updateDay(act.date, d => { d.workouts = d.workouts.filter(x => x.id !== act.w.id); });
  toast('Training verworfen.');
}

/* Info zu einer Übung */
function sparkSVG(vals) {
  if (vals.length < 2) return '';
  const W = 320, H = 84, p = 8, lo = Math.min(...vals), hi = Math.max(...vals), span = hi - lo || 1;
  const pts = vals.map((v, i) => [p + i * (W - 2 * p) / (vals.length - 1), H - p - (v - lo) / span * (H - 2 * p)]);
  return `<svg class="spark" viewBox="0 0 ${W} ${H}" role="img" aria-label="Verlauf des geschätzten 1RM über ${vals.length} Trainings, von ${fmtNum(vals[0], 1)} auf ${fmtNum(vals[vals.length - 1], 1)} kg">
    <polyline points="${pts.map(q => q.map(n => n.toFixed(1)).join(',')).join(' ')}" fill="none" stroke="var(--protein)" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
    ${pts.map(q => `<circle cx="${q[0].toFixed(1)}" cy="${q[1].toFixed(1)}" r="3.2" fill="var(--protein)"/>`).join('')}</svg>`;
}

    : info.store === 'max' ? `<p class="warn">${ICON.warn}<span><b>Hier gilt eine Obergrenze:</b> höchstens ${fmtNum(tg ? tg.value : 0, n.dec)} ${n.unit} pro Tag.</span></p>` : '';
  const todayRow = tg ? `<div class="nrow"><span class="nn">${dateLabel(date) === dateLabel(todayStr()) ? 'Heute' : dateLabel(date)}</span><span class="nv">${known ? `<b>${fmtNum(tot[key].sum, n.dec)}</b> / ${fmtNum(tg.value, n.dec)} ${n.unit}` : 'keine Daten'}</span>${known ? barHTML(tot[key].sum / tg.value, { over: tg.type === 'max' && tot[key].sum > tg.value, max: tg.type === 'max' }) : ''}</div>` : '';
  const avgRow = tg && avg != null ? `<div class="nrow"><span class="nn">Schnitt der letzten 7 Tage</span><span class="nv"><b>${pctTxt(avg)}</b> vom Ziel</span>${barHTML(avg, { over: tg.type === 'max' && avg > 1, max: tg.type === 'max' })}</div>` : '';
  const src = GOOD_SOURCES[key] ? `<p class="secttl">Gute Quellen</p><p>${GOOD_SOURCES[key]}.</p>` : '';
  const more = info.more ? `<p class="secttl">Gut zu wissen</p><p>${info.more}</p>` : '';
  S.modal = { type: 'info', key };
  $('#modal-root').innerHTML = modalShell(n.label, info.store === 'week' ? 'Wochenschnitt zählt' : info.store === 'day' ? 'Möglichst täglich' : '', `
    <p style="font-size:1.05rem;margin-bottom:12px">${info.what}</p>${store}
    ${todayRow || avgRow ? `<p class="secttl">Deine Werte</p>${todayRow}${avgRow}` : ''}
    ${src}${more}<p class="foot">Allgemeine Infos, vereinfacht. Kein medizinischer Rat.</p>`);
}

/* Dialoge: eigene Lebensmittel, Ergänzungen, Rezepte */
function valueFieldsHTML(vals, mode) {
  const basis = ['kcal', 'protein', 'fat', 'carbs', 'sugar', 'fiber', 'salt'];
  const groups = [
    ['Nährwerte', basis],
    ['Fette und mehr', NUTRIENTS.filter(n => n.group === 'Fette und mehr').map(n => n.key)],
    ['Vitamine', NUTRIENTS.filter(n => n.group === 'Vitamine').map(n => n.key)],
    ['Mineralstoffe', NUTRIENTS.filter(n => n.group === 'Mineralstoffe').map(n => n.key)]
  ];
  const unitOf = k => k === 'kcal' ? 'kcal' : NUTRIENTS.find(n => n.key === k).unit;
  const input = k => {
    const v = vals && vals[k] != null ? String(Math.round(vals[k] * 1000) / 1000).replace('.', ',') : '';
    return `<div class="field"><label for="v_${k}">${labelOf(k)} (${unitOf(k)})</label><input id="v_${k}" name="v_${k}" type="text" inputmode="decimal" value="${esc(v)}" placeholder="${mode === 'unit' ? '0' : 'unbekannt'}"></div>`;
  };
  return groups.map(([title, keys], gi) => {
    const open = gi === 0 || keys.some(k => vals && vals[k] != null);
    return `<details class="fd" ${open ? 'open' : ''}><summary>${title}</summary><div class="fgrid">${keys.map(input).join('')}</div></details>`;
  }).join('');
}
/* Formular „Eintrag bearbeiten“ lesen; bei Fehlern Meldung im Formular und null */
function readEditForm(f, it, fallbackDate) {

    qty: supp ? q : Math.round(q),
    time: /^\d\d:\d\d$/.test(data.time || '') ? data.time : '',
    meal: supp ? 'erg' : (MEALS.some(x => x.id === data.meal) ? data.meal : it.meal),
    to: /^\d{4}-\d\d-\d\d$/.test(data.date || '') ? data.date : fallbackDate
  };
}
function readValueFields(data) {
  const f = {}; for (const k of ALL_KEYS) f[k] = data['v_' + k];

}

function draftPreview(d) {
  const ings = d.ingredients;
  if (!ings.length) return '<p class="hint">Füge mindestens eine Zutat hinzu.</p>';
  const total = parseDecimal(d.total);
  const calc = computeRecipe(ings, Number.isNaN(total) ? null : total);
  const pc = parseDecimal(d.portions);
  const portion = pc && !Number.isNaN(pc) && pc >= 1 ? ` Eine Portion hat etwa ${fmtNum(Math.round(calc.total / pc))} g und ${fmtNum(calc.per100.kcal != null ? calc.per100.kcal * calc.total / pc / 100 : null)} kcal.` : '';
  const inc = calc.incomplete.length ? `<br>Bei einigen Zutaten fehlen Angaben zu ${calc.incomplete.slice(0, 4).map(labelOf).join(', ')}${calc.incomplete.length > 4 ? ' und mehr' : ''}. Diese Werte sind dann Mindestwerte.` : '';
  return `<div class="preview"><strong>Pro 100 g:</strong> ${fmtNum(calc.per100.kcal)} kcal, ${fmtNum(calc.per100.protein, 1)} g Eiweiß, ${fmtNum(calc.per100.fat, 1)} g Fett, ${fmtNum(calc.per100.carbs, 1)} g Kohlenhydrate.<br>Gesamtgewicht ${fmtNum(Math.round(calc.total))} g.${portion}${inc}</div>`;
}

async function copyText(text) {
  try { if (navigator.clipboard && navigator.clipboard.writeText) { await navigator.clipboard.writeText(text); return true; } } catch { /* weiter */ }
  try {
    const ta = document.createElement('textarea'); ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.select(); const ok = document.execCommand('copy'); ta.remove(); return ok;
  } catch { return false; }
}
function toggleFav(ref) {
  return updateLib(l => {
    const k = foodKey(ref), i = l.favorites.findIndex(f => foodKey(f) === k);
    if (i >= 0) l.favorites.splice(i, 1); else l.favorites.unshift(ref);
  });
}
const validQty = (q, max) => q !== null && !Number.isNaN(q) && q > 0 && q <= max;
function curWhen() {
  const m = S.modal;
  return { meal: ($('#pmeal') && $('#pmeal').value) || (m && m.meal) || 'snack', time: ($('#ptime') && $('#ptime').value) || '' };
}

document.addEventListener('click', async e => {
  const el = e.target.closest('[data-action]'); if (!el) return;
  const a = el.dataset.action;
  switch (a) {
    case 'week-view': S.weekView = el.dataset.v === 'shop' ? 'shop' : 'stats'; renderAll(); if (S.weekView === 'stats') ensureHistory(); break;
    case 'page': {
      S.page = el.dataset.page; window.scrollTo(0, 0); renderAll();
      if (S.page === 'week') ensureHistory();
      if (S.page === 'today') { S.animate = true; renderAll(); }
      break;
    }
    case 'select': selectDate(el.dataset.date); break;
    case 'day-shift': selectDate(shiftDate(S.selected, Number(el.dataset.n))); break;
    case 'day-today': selectDate(todayStr()); break;
    case 'add': {
      if (S.page !== 'today') { S.page = 'today'; renderAll(); }
      openAdd(S.selected, { meal: el.dataset.meal }); break;
    }
    case 'close-modal': dismissModal(); break;
    case 'goto-lib': closeModal(); S.draft = null; S.page = 'more'; S.more = 'lib'; window.scrollTo(0, 0); renderAll(); break;
    case 'goto-profile': S.page = 'more'; S.more = 'profile'; window.scrollTo(0, 0); renderAll(); break;
    case 'more-tab': S.more = el.dataset.v; renderAll(); break;
    case 'nut-view': S.nutView = el.dataset.v; renderAll(); break;
    case 'tab': {
      const m = S.modal; if (!m || m.type !== 'add') break;
      const t = el.dataset.tab; m.tab = t; m.picked = null;
      $$('.tabs button').forEach(b => b.setAttribute('aria-selected', String(b.dataset.tab === t)));
      if ($('#when')) $('#when').hidden = t === 'supp';
      renderResults(); renderPending();
      break;
    }
    case 'pick': { if (e.target.closest('.nutdetail')) break; const m = S.modal; if (m && m.type === 'add') { m.picked = Number(el.dataset.idx); m.qty = null; renderResults(); renderPending(); } break; }
    case 'fav-toggle': { const m = S.modal; const f = m && m.shown[Number(el.dataset.idx)]; if (f) await toggleFav(f); break; }
    case 'fav-item': {
      const it = getDay(el.dataset.date).items.find(x => x.id === el.dataset.id);
      if (it) { await toggleFav(toFoodRef(it)); if (S.modal && S.modal.type === 'edit') openEditItem(el.dataset.date, el.dataset.id); }
      break;
    }
    case 'fav-remove': await updateLib(l => { l.favorites = l.favorites.filter(f => foodKey(f) !== el.dataset.key); }); break;
    case 'add-pending': {
      const m = S.modal; if (!m || m.type !== 'add' || m.picked == null) break;
      const food = m.shown[m.picked]; const supp = food.source === 'supp';
      const q = parseDecimal($('#pqty').value);
      if (!validQty(q, supp ? 50 : 5000)) { toast(supp ? 'Gib eine Menge zwischen 0,5 und 50 ein.' : 'Gib eine Menge zwischen 1 und 5000 Gramm ein.'); break; }
      const qty = supp ? q : Math.round(q);
      if (m.mode === 'pick') { const cb = m.onPick; closeModal(); if (cb) cb(food, qty); break; }
      const { meal, time } = curWhen();
      const item = makeItem(food, qty, supp ? 'erg' : meal, time);
      const date = m.date;
      m.picked = null; renderResults(); renderPending();
      toast(`${food.name} ist eingetragen.`);
      await updateDay(date, d => { d.items.push(item); });
      await updateLib(l => { l.recent = pushRecent(l.recent, toFoodRef(item)); });
      break;
    }
    case 'tpl-apply': {
      const tpl = S.lib.templates.find(t => t.id === el.dataset.id); if (!tpl) break;
      const m = S.modal;
      const date = m && m.date || S.selected;
      const meal = m && m.type === 'meal-menu' ? m.meal : curWhen().meal;
      const time = m && m.type === 'add' ? curWhen().time : (MEALS.find(x => x.id === meal) || {}).def;
      const items = applyTemplate(tpl, meal, time);
      closeModal();
      await updateDay(date, d => { d.items.push(...items); });
      toast(`„${tpl.name}“ ist eingetragen.`);
      break;
    }
    case 'meal-copy-prev': {
      const m = S.modal; if (!m) break;
      const items = copyMealItems(getDay(shiftDate(m.date, -1)).items, m.meal);
      const date = m.date; closeModal();
      if (items.length) { await updateDay(date, d => { d.items.push(...items); }); toast(`${items.length} Einträge übernommen.`); }
      break;
    }
    case 'meal-menu': openMealMenu(el.dataset.meal); break;
    case 'nut-info': openNutrientInfo(el.dataset.key, S.page === 'week' ? (weekDates(S.monday)[6] <= todayStr() ? weekDates(S.monday)[6] : todayStr()) : S.selected); break;
    case 'edit-item': openEditItem(el.dataset.date, el.dataset.id); break;
    case 'remove': {
      const { date, id } = el.dataset;
      const removed = getDay(date).items.find(x => x.id === id); if (!removed) break;
      if (S.modal && S.modal.type === 'edit') closeModal();
      await updateDay(date, d => { d.items = d.items.filter(x => x.id !== id); });
      toast(`${removed.name} gelöscht.`, { label: 'Rückgängig', fn: () => updateDay(date, d => { if (!d.items.some(x => x.id === id)) d.items.push(removed); }) });
      break;
    }
    case 'item-copy': {
      const m = S.modal; if (!m || m.type !== 'edit') break;
      const it = getDay(m.date).items.find(x => x.id === m.id); if (!it) break;
      const v = readEditForm(el.closest('form'), it, m.date); if (!v) break;
      if (!(await ensureDay(v.to))) break;
      closeModal();
      const copy = makeItem(toFoodRef(it), v.qty, v.meal, v.time);
      await updateDay(v.to, d => { d.items.push(copy); });
      toast(`Kopie am ${dateLabel(v.to)} eingetragen.`);
      break;
    }
    case 'toast-act': { const fn = toastFn; hideToast(); if (fn) await fn(); break; }
    case 'theme': applyTheme(el.dataset.v); renderAll(); break;
    case 'reload': location.reload(); break;
    case 'auth-reset': {
      const email = (($('#em') && $('#em').value) || '').trim();
      S.authEmail = email; S.authError = ''; S.authInfo = '';
      if (!email) { S.authError = 'Gib oben deine E-Mail ein. Dann schicken wir dir einen Link zum Zurücksetzen.'; renderAll(); if ($('#em')) $('#em').focus(); break; }
      try {
        await fb.authM.sendPasswordResetEmail(fb.auth, email);

      const match = { custom: byId, supplements: byId, templates: byId, ...(kind !== 'tpl' ? { favorites: byKey, recent: byKey } : {}) };
      const removed = [];   // [Liste, Position, Eintrag], damit „Rückgängig“ alles an seinen alten Platz legt
      for (const [k, fn] of Object.entries(match)) S.lib[k].forEach((x, i) => { if (fn(x)) removed.push([k, i, clean(x)]); });
      await updateLib(l => { for (const [k, fn] of Object.entries(match)) l[k] = l[k].filter(x => !fn(x)); });

    case 'ing-remove': { syncDraft(); S.draft.ingredients.splice(Number(el.dataset.idx), 1); openRecipeEditor(S.draft); break; }
    /* ---- Training ---- */
    case 'train-view': S.train = el.dataset.v; renderAll(); break;

    case 'ex-group': S.exGroup = el.dataset.v; renderAll(); break;
    case 'ex-info': openExInfo(el.dataset.id); break;
    case 'w-start': await startWorkout(el.dataset.plan || ''); break;
    case 'w-finish': openFinish(); break;

    case 'w-addex': syncSetInputs(); openExPicker('workout'); break;
    case 'set-done': {
      unlockAudio(); syncSetInputs();
      const act = activeWorkout(); if (!act) break;
      const i = Number(el.dataset.i), j = Number(el.dataset.j), e = act.w.exercises[i], s = e && e.sets[j]; if (!s) break;
      if (s.done) { await updateWorkout(act.date, act.w.id, w => { w.exercises[i].sets[j].done = false; }); break; }
      const d = exMapNow()[e.exId] || { type: 'kraft', eq: 'sonst' };
      const hist = (S.gym.hist[e.exId] || []).filter(x => x.wid !== act.w.id), last = hist[hist.length - 1];
      const prev = last && last.s[Math.min(j, last.s.length - 1)];
      let a = s.a, b = s.b;
      if (a == null) a = prev ? prev[0] : ((d.type === 'kraft' && d.eq === 'kg') || d.type === 'zeit' ? 0 : null);
      if (b == null && prev) b = prev[1];
      if (d.type === 'cardio') { if (!(a > 0)) { toast('Trag die Minuten ein.'); break; } }
      else if (a == null) { toast('Trag das Gewicht ein.'); break; }
      else if (!(b > 0)) { toast(d.type === 'zeit' ? 'Trag die Sekunden ein.' : 'Trag die Wiederholungen ein.'); break; }
      await updateWorkout(act.date, act.w.id, w => { const x = w.exercises[i].sets[j]; x.a = a; x.b = b; x.done = true; });
      if (d.type !== 'cardio') startRest(e.rest || gymGoal(S.gym.goal).rest);
      const best = histBest(hist).e1rm;
      if (d.type === 'kraft' && best > 0 && e1rm(a, b) > best + 0.01) toast(`Neue Bestleistung: ${d.name}, geschätztes 1RM ${fmtNum(e1rm(a, b), 1)} kg`);
      break;
    }
    case 'set-add': {
      syncSetInputs(); const act = activeWorkout(); if (!act) break;

      break;
    }
    case 'set-remove': {
      syncSetInputs(); const act = activeWorkout(); if (!act) break;
      await updateWorkout(act.date, act.w.id, w => { const e = w.exercises[Number(el.dataset.i)]; if (e && e.sets.length > 1) e.sets.pop(); });
      break;
    }
    case 'rest-add': {
      REST.end += Number(el.dataset.s) * 1000; REST.total = Math.max(REST.total, Math.ceil((REST.end - Date.now()) / 1000));
      if (REST.end <= Date.now()) stopRest(); else { try { localStorage.setItem('np:rest', JSON.stringify(REST)); } catch { /* egal */ } renderRest(); }
      break;
    }
    case 'rest-skip': stopRest(); break;
    case 'wex-menu': syncSetInputs(); openWexMenu(Number(el.dataset.i)); break;
    case 'wex-move': {
      const act = activeWorkout(); if (!act) break;
      const i = Number(el.dataset.i), k = i + Number(el.dataset.dir);
      closeModal();
      await updateWorkout(act.date, act.w.id, w => { if (k >= 0 && k < w.exercises.length) [w.exercises[i], w.exercises[k]] = [w.exercises[k], w.exercises[i]]; });
      break;
    }
    case 'wex-remove': {
      const act = activeWorkout(); if (!act) break;
      const i = Number(el.dataset.i), removed = clean(act.w.exercises[i]); if (!removed) break;
      const name = (exMapNow()[removed.exId] || { name: 'Übung' }).name, date = act.date, wid = act.w.id;
      closeModal();
      await updateWorkout(date, wid, w => { w.exercises.splice(i, 1); });
      toast(`${name} entfernt.`, { label: 'Rückgängig', fn: () => updateWorkout(date, wid, w => { if (!w.exercises.some(x => x.uid === removed.uid)) w.exercises.splice(Math.min(i, w.exercises.length), 0, removed); }) });
      break;
    }
    case 'ex-add-active': {
      const act = activeWorkout(); if (!act) break;
      const item = workoutExercise(el.dataset.id, null, exMapNow(), S.gym.goal);
      closeModal(); S.page = 'train';
      await updateWorkout(act.date, act.w.id, w => { w.exercises.push(item); });
      toast('Zum Training hinzugefügt.');
      break;
    }
    case 'ex-toggle': {
      const m = S.modal; if (!m || m.type !== 'expick') break;
      const id = el.dataset.id; if (m.sel.has(id)) m.sel.delete(id); else m.sel.add(id);
      refreshPicker(); break;
    }
    case 'pick-group': { const m = S.modal; if (!m || m.type !== 'expick') break; m.grp = el.dataset.v; refreshPicker(); break; }
    case 'pick-confirm': {
      const m = S.modal; if (!m || m.type !== 'expick' || !m.sel.size) break;
      const ids = [...m.sel], exMap = exMapNow();
      if (m.mode === 'plan') {
        closeModal();
        if (S.planDraft) { S.planDraft.items.push(...ids.map(id => planItem(id, S.planDraft.goal, exMap))); renderPlanEditor(); }
        break;
      }
      const act = activeWorkout(); closeModal(); if (!act) break;
      await updateWorkout(act.date, act.w.id, w => { w.exercises.push(...ids.map(id => workoutExercise(id, null, exMap, S.gym.goal))); });
      break;
    }
    case 'w-detail': openWorkoutDetail(el.dataset.date, el.dataset.id); break;
    case 'w-reopen': {
      if (activeWorkout()) { toast('Beende zuerst das laufende Training.'); break; }
      const { date, id } = el.dataset; closeModal();
      S.page = 'train'; window.scrollTo(0, 0);
      await updateWorkout(date, id, w => { w.backup = JSON.stringify({ name: w.name, exercises: w.exercises, kcal: w.kcal, endTs: w.endTs }); w.reopenEnd = w.endTs; w.endTs = 0; w.active = true; });
      break;
    }
    case 'w-asplan': {
      const { date, id } = el.dataset, w = getDay(date).workouts.find(x => x.id === id); if (!w) break;
      const exMap = exMapNow();
      const items = w.exercises.map(e => {
        const d = exMap[e.exId] || { type: 'kraft' }, reps = e.sets.map(x => x.b).filter(v => v > 0);
        return d.type === 'kraft' ? { exId: e.exId, sets: e.sets.length, rMin: reps.length ? Math.min(...reps) : null, rMax: reps.length ? Math.max(...reps) : null, rest: e.rest || gymGoal(S.gym.goal).rest } : planItem(e.exId, S.gym.goal, exMap);
      });
      closeModal(); S.page = 'train'; S.train = 'plans';
      await updateGym(g => { g.plans.push({ id: uid(), name: w.name, goal: g.goal, items }); });
      toast(`Plan „${w.name}“ gespeichert.`);
      break;
    }
    case 'w-delete': {
      const { date, id } = el.dataset, w = getDay(date).workouts.find(x => x.id === id); if (!w) break;
      const copy = clean(w); closeModal();
      await updateDay(date, d => { d.workouts = d.workouts.filter(x => x.id !== id); });
      await updateGym(g => { g.hist = histWithout(g.hist, id); });
      toast(`${w.name} gelöscht.`, { label: 'Rückgängig', fn: async () => {
        await updateDay(date, d => { if (!d.workouts.some(x => x.id === id)) d.workouts.push(copy); });
        await updateGym(g => { g.hist = histWith(g.hist, normWorkout(copy), date, exMapNow()); });
      } });
      break;
    }
    case 'plans-starter': {
      const add = starterPlans(S.gym.goal, exMapNow()).filter(p => !S.gym.plans.some(x => x.name === p.name));
      await updateGym(g => { g.plans.push(...add); });
      toast(add.length ? `${add.length} Beispielpläne übernommen.` : 'Die Beispielpläne sind schon da.');
      break;
    }
    case 'plan-new': openPlanEditor(); break;
    case 'plan-edit': openPlanEditor(el.dataset.id); break;
    case 'plan-delete': {
      const i = S.gym.plans.findIndex(p => p.id === el.dataset.id); if (i < 0) break;
      const p = clean(S.gym.plans[i]);
      await updateGym(g => { g.plans = g.plans.filter(x => x.id !== p.id); });
      toast(`„${p.name}“ gelöscht.`, { label: 'Rückgängig', fn: () => updateGym(g => { if (!g.plans.some(x => x.id === p.id)) g.plans.splice(Math.min(i, g.plans.length), 0, p); }) });
      break;
    }
    case 'pi-add': syncPlanDraft(); openExPicker('plan'); break;
    case 'pi-move': {
      syncPlanDraft(); const d = S.planDraft; if (!d) break;
      const i = Number(el.dataset.i), k = i + Number(el.dataset.dir);
      if (k >= 0 && k < d.items.length) [d.items[i], d.items[k]] = [d.items[k], d.items[i]];
      renderPlanEditor(); break;
    }
    case 'pi-remove': { syncPlanDraft(); if (S.planDraft) { S.planDraft.items.splice(Number(el.dataset.i), 1); renderPlanEditor(); } break; }
    case 'cex-new': openCustomEx(); break;
    case 'cex-edit': openCustomEx(el.dataset.id); break;
    case 'cex-delete': {
      const x = S.gym.custom.find(c => c.id === el.dataset.id); if (!x) break;
      confirmSheet(`„${x.name}“ löschen?`, 'Die Übung verschwindet auch aus deinen Plänen. Abgeschlossene Trainings bleiben erhalten.', 'Löschen', () => updateGym(g => {
        g.custom = g.custom.filter(c => c.id !== x.id);
        g.plans = g.plans.map(p => ({ ...p, items: p.items.filter(it => it.exId !== x.id) }));
      }), true);
      break;
    }
    case 'auth-toggle': S.authEmail = (($('#em') && $('#em').value) || '').trim(); S.authMode = S.authMode === 'login' ? 'signup' : 'login'; S.authError = ''; S.authInfo = ''; renderAll(); break;
    case 'logout': try { await fb.authM.signOut(fb.auth); } catch (err) { console.error(err); } break;
  }
});

document.addEventListener('submit', async e => {
  const f = e.target.closest('[data-form]'); if (!f) return;
  e.preventDefault();
  const kind = f.dataset.form;
  const data = Object.fromEntries(new FormData(f));
  if (kind === 'settings') {
    const w = parseDecimal(data.weight), age = parseDecimal(data.age), h = parseDecimal(data.height);
    if (!(w >= 30 && w <= 250)) { showFormError(f, 'Gib ein Gewicht zwischen 30 und 250 kg ein.'); return; }
    if (Number.isNaN(age) || (age !== null && !(age >= 14 && age <= 100))) { showFormError(f, 'Gib ein Alter zwischen 14 und 100 ein, oder lass das Feld leer.'); return; }
    if (Number.isNaN(h) || (h !== null && !(h >= 120 && h <= 230))) { showFormError(f, 'Gib eine Größe zwischen 120 und 230 cm ein, oder lass das Feld leer.'); return; }
    S.profile = { sex: data.sex === 'w' ? 'w' : 'm', weight: Math.round(w * 10) / 10, age: age === null ? null : Math.round(age), height: height0(h),
      activity: Number(data.activity) || 1.3, goal: GOALS.some(g => g.id === data.goal) ? data.goal : 'keep', proteinPerKg: Number(data.proteinPerKg) || 0.8 };
    const first = S.needsSetup;
    S.needsSetup = false;
    if (first) { S.animate = true; window.scrollTo(0, 0); }
    renderAll(); toast(first ? 'Fertig eingerichtet. Trag jetzt dein erstes Essen ein.' : 'Profil gespeichert.');
    persistProfile();
  } else if (kind === 'auth') {
    try {
      S.authError = ''; S.authInfo = ''; S.authEmail = String(data.email || '').trim();
      if (S.authMode === 'login') await fb.authM.signInWithEmailAndPassword(fb.auth, data.email, data.password);
      else await fb.authM.createUserWithEmailAndPassword(fb.auth, data.email, data.password);
    } catch (err) { S.authError = authMsg(err.code); renderAll(); }
  } else if (kind === 'weight') {
    const w = parseDecimal(data.weight);
    if (Number.isNaN(w) || (w !== null && !(w >= 20 && w <= 400))) { toast('Gib ein Gewicht zwischen 20 und 400 kg ein.'); return; }
    await updateDay(data.date, d => { d.weight = w === null ? null : Math.round(w * 10) / 10; }); toast(w === null ? 'Gewicht entfernt.' : 'Gewicht gespeichert.');
  } else if (kind === 'sport') {
    const name = String(data.name || '').trim(), mins = parseDecimal(data.minutes), kc = parseDecimal(data.kcal);
    if (!name) return;
    if (Number.isNaN(mins) || Number.isNaN(kc) || (mins !== null && mins <= 0) || (kc !== null && kc < 0)) { toast('Minuten und Kalorien müssen Zahlen sein.'); return; }
    await updateDay(data.date, d => { d.sport.push({ id: uid(), name, minutes: mins, kcal: kc }); });
  } else if (kind === 'edit-item') {
    const m = S.modal; if (!m || m.type !== 'edit') return;
    const it = getDay(m.date).items.find(x => x.id === m.id); if (!it) { closeModal(); return; }
    const v = readEditForm(f, it, m.date); if (!v) return;
    const date = m.date, id = m.id, supp = it.kind === 'supp';
    if (v.to !== date && !(await ensureDay(v.to))) return;
    closeModal();
    if (v.to === date) {
      await updateDay(date, d => { const x = d.items.find(y => y.id === id); if (x) { if (supp) x.qty = v.qty; else x.grams = v.qty; x.meal = v.meal; x.time = v.time; } });
      return;
    }
    const moved = { ...clean(it), meal: v.meal, time: v.time, [supp ? 'qty' : 'grams']: v.qty };
    await updateDay(date, d => { d.items = d.items.filter(y => y.id !== id); });
    await updateDay(v.to, d => { d.items.push(moved); });
    toast(`Auf ${dateLabel(v.to)} verschoben.`);
  } else if (kind === 'w-finish') {
    closeModal();
    await finishWorkout(String(data.name || '').trim());
  } else if (kind === 'wex-rest') {
    const m = S.modal, act = activeWorkout(); if (!m || m.type !== 'wexmenu' || !act) return;
    const v = parseDecimal(data.rest);
    if (Number.isNaN(v) || (v !== null && (v < 0 || v > 900))) { toast('Gib die Pause in Sekunden ein, höchstens 900.'); return; }
    const i = m.i; closeModal();
    await updateWorkout(act.date, act.w.id, w => { if (w.exercises[i]) w.exercises[i].rest = v === null ? null : Math.round(v); });

      let rMin = it.rMin, rMax = it.rMax;
      if (rMin != null && rMax != null && rMin > rMax) [rMin, rMax] = [rMax, rMin];
      if (rMin == null && rMax != null) rMin = rMax;
      return { exId: it.exId, sets: Math.max(1, Math.min(10, Number(it.sets) || 1)), rMin, rMax, rest: it.rest != null ? Math.max(0, Math.min(900, it.rest)) : null };
    });
    const plan = { id: d.id || uid(), name, goal: goalId(d.goal), items };
    S.planDraft = null; closeModal();
    await updateGym(g => { const i = g.plans.findIndex(p => p.id === plan.id); if (i >= 0) g.plans[i] = plan; else g.plans.push(plan); });
    toast(`Plan „${name}“ gespeichert.`);
  } else if (kind === 'cex') {
    const name = String(data.name || '').trim(), type = ['kraft', 'zeit', 'cardio'].includes(data.type) ? data.type : 'kraft';
    const primary = MUSCLES.map(m => m[0]).filter(k => data['p_' + k]);
    const secondary = MUSCLES.map(m => m[0]).filter(k => data['s_' + k] && !primary.includes(k));
    const met = parseDecimal(data.met);
    if (!name) { showFormError(f, 'Gib der Übung einen Namen.'); return; }
    if (type !== 'cardio' && !primary.length) { showFormError(f, 'Wähle mindestens einen Hauptmuskel.'); return; }
    if (Number.isNaN(met) || (met !== null && !(met >= 1 && met <= 20))) { showFormError(f, 'Der MET-Wert muss zwischen 1 und 20 liegen.'); return; }
    const x = { id: data.id || 'c-' + uid(), name, eq: EQUIP[data.eq] ? data.eq : 'sonst', type, primary: type === 'cardio' ? [] : primary, secondary: type === 'cardio' ? [] : secondary, cue: String(data.cue || '').trim(), met: type === 'cardio' ? (met || 6) : null };
    closeModal();
    await updateGym(g => { const i = g.custom.findIndex(c => c.id === x.id); if (i >= 0) g.custom[i] = x; else g.custom.push(x); });

    const nova = Number(data.nova) >= 1 && Number(data.nova) <= 4 ? Number(data.nova) : null;
    const food = { id: data.id || uid(), source: 'custom', name, brand: String(data.brand || '').trim(), code: '', per100: per, nova, nutri: null, incomplete: [], portion: portion ? Math.round(portion) : null };
    closeModal();
    await saveOwnFood(food, !!data.id);
  } else if (kind === 'supp-editor') {
    const name = String(data.name || '').trim(), unit = String(data.unit || '').trim();
    if (!name || !unit) { showFormError(f, 'Gib Name und Einheit ein.'); return; }
    const { per, bad } = readValueFields(data);
    if (bad.length) { showFormError(f, `Das ist keine gültige Zahl: ${bad.map(labelOf).join(', ')}.`); return; }
    const msg = validateFood(per, 'unit'); if (msg) { showFormError(f, msg); return; }
    const perUnit = {}; for (const k of ALL_KEYS) if (per[k] != null) perUnit[k] = per[k];
    const supp = { id: data.id || uid(), source: 'supp', name, unit, perUnit };
    closeModal();
    await updateLib(l => { const i = l.supplements.findIndex(x => x.id === supp.id); if (i >= 0) l.supplements[i] = supp; else l.supplements.push(supp); });
  } else if (kind === 'recipe-editor') {
    syncDraft(); const d = S.draft;
    const name = String(d.name || '').trim();
    if (!name) { showFormError(f, 'Gib einen Namen ein.'); return; }
    if (!d.ingredients.length) { showFormError(f, 'Füge mindestens eine Zutat hinzu.'); return; }
    const total = parseDecimal(d.total), portions = parseDecimal(d.portions);
    if (Number.isNaN(total) || (total !== null && total <= 0)) { showFormError(f, 'Das fertige Gewicht muss eine Zahl über 0 sein.'); return; }
    if (Number.isNaN(portions) || (portions !== null && portions < 1)) { showFormError(f, 'Die Zahl der Portionen muss mindestens 1 sein.'); return; }
    const calc = computeRecipe(d.ingredients, total);
    const food = {
      id: d.id || uid(), source: 'recipe', name, brand: '', code: '', per100: calc.per100, nova: null, nutri: null,
      incomplete: calc.incomplete, ingredients: d.ingredients, recipeTotal: calc.total,
      portions: portions ? Math.round(portions) : null, portion: portions ? Math.round(calc.total / portions) : null
    };
    const isEdit = !!d.id;
    S.draft = null; closeModal();
    await saveOwnFood(food, isEdit);
  }
});
function height0(h) { return h === null ? null : Math.round(h); }

document.addEventListener('change', async e => {
  const t = e.target;
  if (t.matches('input[data-set]')) { syncSetInputs(); return; }
  if (t.id === 'plg' && S.planDraft) {
    syncPlanDraft(); const exMap = exMapNow();
    S.planDraft.items = S.planDraft.items.map(it => planItem(it.exId, S.planDraft.goal, exMap));
    renderPlanEditor(); return;
  }
  if (t.matches('[data-pi]')) { syncPlanDraft(); return; }
  if (t.matches('input[data-shop]')) {
    const k = shopKey(fmtDate(S.monday), t.dataset.shop), on = t.checked;
    const oldest = fmtDate(addDays(mondayOf(new Date()), -56));   // Haken älter als 8 Wochen fliegen raus
    await updateLib(l => {
      for (const x of Object.keys(l.shopChecked)) if (x.split('|')[0] < oldest) delete l.shopChecked[x];
      if (on) l.shopChecked[k] = true; else delete l.shopChecked[k];
    });
  } else if (t.matches('input[data-shopopt]')) { S.shopFromToday = t.checked; renderAll(); }
  else if (t.matches('select[data-hist]')) { S.hist.metric = t.value; renderAll(); }
  else if (t.id === 'pmeal' && S.modal && S.modal.type === 'add') {
    const m = S.modal; m.meal = t.value; m.mealTouched = true;
    const ti = $('#ptime'); if (ti && !m.timeTouched) { ti.value = (MEALS.find(x => x.id === t.value) || {}).def || ti.value; m.time = ti.value; }
    if (m.tab === 'mine') renderResults();
  } else if (t.id === 'ptime' && S.modal && S.modal.type === 'add') {
    const m = S.modal; m.time = t.value; m.timeTouched = true;
    const ms = $('#pmeal'); if (ms && t.value && ms.value !== mealForTime(t.value) && !m.mealTouched) { ms.value = mealForTime(t.value); m.meal = ms.value; }
  } else if (t.matches('input[data-ing-grams], #rt, #rp') && S.modal && S.modal.type === 'recipe') {
    syncDraft(); const p = $('#rpreview'); if (p) p.innerHTML = draftPreview(S.draft);
  }
});
document.addEventListener('input', e => {
  const t = e.target;
  if (t.id === 'exq') { S.exQuery = t.value; const l = $('#exlist'); if (l) l.innerHTML = exListHTML(S.exQuery, S.exGroup, 'lib'); return; }
  if (t.id === 'pickq' && S.modal && S.modal.type === 'expick') { S.modal.q = t.value; $('#picklist').innerHTML = exListHTML(S.modal.q, S.modal.grp, 'pick', S.modal.sel); return; }
  if (t.id === 'pqty' && S.modal && S.modal.type === 'add' && S.modal.picked != null) {
    const p = $('#pprev'); if (p) p.textContent = pendingPreview(S.modal.shown[S.modal.picked], parseDecimal(t.value) || 0);
    const q = parseDecimal(t.value) || 0, d = $('#pdetail');
    S.modal.qty = q > 0 ? q : null;
    if (d) { d.innerHTML = foodDetailHTML(S.modal.shown[S.modal.picked], q); const l = $('#pdq'); if (l) l.textContent = fmtNum(q, 1); }
  }
});

/* Hover und Tastaturfokus im Diagramm */
const tipEl = () => $('#tip');
function showTip(target, x, y) {
  const t = tipEl(); t.textContent = target.getAttribute('data-tip'); t.hidden = false;
  const r = t.getBoundingClientRect();
  t.style.left = Math.max(8, Math.min(window.innerWidth - r.width - 8, x + 12)) + 'px';
  t.style.top = Math.max(8, y - r.height - 12) + 'px';
}
document.addEventListener('pointermove', e => {
  const h = e.target.closest && e.target.closest('.hit');
  if (h) showTip(h, e.clientX, e.clientY); else if (tipEl()) tipEl().hidden = true;
});
document.addEventListener('focusin', e => { const h = e.target.closest && e.target.closest('.hit'); if (h) { const r = h.getBoundingClientRect(); showTip(h, r.left + r.width / 2, r.top + 20); } });
document.addEventListener('focusout', e => { if (e.target.closest && e.target.closest('.hit')) tipEl().hidden = true; });
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && S.modal) dismissModal();
  if ((e.key === 'Enter' || e.key === ' ') && e.target.matches && e.target.matches('[role=button][data-action]')) { e.preventDefault(); e.target.click(); }
});

/* ---------------------------------------------------------------------
   Start
   --------------------------------------------------------------------- */
async function afterLoad() {
  S.booting = false; S.animate = true; renderAll();
  try { await loadDates([...histDates(28), shiftDate(S.selected, -1)]); } catch (e) { console.error(e); }
  renderAll();
}
/* Service Worker: App, Icon, Schrift und Firebase-Bibliotheken liegen auf dem Gerät, damit die App offline startet */
function registerSW() {
  if (!('serviceWorker' in navigator) || !(location.protocol === 'https:' || location.hostname === 'localhost')) return;
  navigator.serviceWorker.register('sw.js').catch(e => console.warn('Service Worker:', e));
}
async function boot() {
  applyTheme(S.theme);
  try { const r = JSON.parse(localStorage.getItem('np:rest')); if (r && r.end > Date.now()) Object.assign(REST, r, { fired: false }); } catch { /* egal */ }
  setInterval(tick, 1000);
  registerSW();
  renderAll();
  if (!FIREBASE_READY && FIREBASE_CONFIG.apiKey && !String(FIREBASE_CONFIG.apiKey).startsWith('DEIN')) {
    S.initError = `Die Firebase-Daten sind noch nicht vollständig. Es fehlt: ${FIREBASE_MISSING.join(', ')}. Bis dahin läufst du im Testmodus.`;
  }
  if (FIREBASE_READY) {
    try {
      await initFirebase();
      store = fbStore; S.mode = 'firebase';
      watchConnection();
      fb.authM.onAuthStateChanged(fb.auth, async u => {
        S.user = u; S.uid = u ? u.uid : null; S.days = {}; S.lib = emptyLib(); S.profile = defaultProfile();
        S.unknown = new Set(); S.libUnknown = false; S.needsSetup = false; S.staleLoad = false;
        S.gym = emptyGym(); S.gymUnknown = false; S.planDraft = null; stopRest();
        if (u) { pruneCache(); await loadAll(); await afterLoad(); flushPending(); }
        else { S.booting = false; renderAll(); }
        updateSync();
      });
      return;
    } catch (e) {
      /* Nicht still in den Testmodus wechseln: sonst landen Einträge in einem zweiten, getrennten Speicher */
      console.error(e);
      S.booting = false;
      S.fatal = navigator.onLine === false
        ? 'Du bist offline, und die App wurde auf diesem Gerät noch nie mit Internet geöffnet. Öffne sie einmal online, danach startet sie auch ohne Verbindung.'
        : 'Firebase konnte nicht geladen werden. Prüf deine Verbindung und versuch es noch einmal.';
      renderAll();
      return;
    }
  }
  await loadAll(); await afterLoad();
}
boot();
