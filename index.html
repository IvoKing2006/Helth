<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Nährstoff-Planer</title>
<meta name="description" content="Essen eintragen und sehen, welche Vitamine und Nährstoffe dir fehlen.">
<meta name="theme-color" content="#0C131B" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#F3F4F6" media="(prefers-color-scheme: light)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Nährstoffe">
<link rel="apple-touch-icon" href="icon.png">
<link rel="icon" type="image/png" href="icon.png">
<link rel="manifest" href="manifest.webmanifest">
<script>try{var t=localStorage.getItem('np:theme');if(t==='light'||t==='dark')document.documentElement.setAttribute('data-theme',t);}catch(e){}</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F3F4F6; --surface:#FFFFFF; --surface2:#F1F2F4; --line:#E4E6EA; --line2:#D3D7DD; --text:#0F1419; --muted:#59616B; --faint:#8A919A;
  --energy:#E8590C; --protein:#0E8F82; --micro:#5A970B;
  --primary:#0F1419; --on-primary:#FFFFFF; --danger:#C93A32; --warnbg:#FCEFEE; --okbg:#EEF5E6; --focus:#2563EB;
  --heat0:#E6E8EB; --heat1:#D3E6B4; --heat2:#ADD474; --heat3:#80BA35; --heat4:#5A970B;
  --nova1:#2F8F4E; --nova2:#7DAA3B; --nova3:#D59A16; --nova4:#C93A32;
  --sheet-shadow:0 -10px 40px rgba(15,20,25,.16);
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0C131B; --surface:#121A23; --surface2:#19232E; --line:#202B37; --line2:#2C3947; --text:#EDF1F5; --muted:#98A4B1; --faint:#677585;
    --energy:#FF7A45; --protein:#2BD4C0; --micro:#A6E33D;
    --primary:#EDF1F5; --on-primary:#0C131B; --danger:#FF6B61; --warnbg:#2B1A1D; --okbg:#17241A;
    --heat0:#1B2531; --heat1:#2D4220; --heat2:#4A6E24; --heat3:#77A82E; --heat4:#A6E33D;
    --nova1:#4CC27A; --nova2:#9BCB57; --nova3:#F0B53A; --nova4:#FF6B61;
    --sheet-shadow:0 -10px 40px rgba(0,0,0,.55);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0C131B; --surface:#121A23; --surface2:#19232E; --line:#202B37; --line2:#2C3947; --text:#EDF1F5; --muted:#98A4B1; --faint:#677585;
  --energy:#FF7A45; --protein:#2BD4C0; --micro:#A6E33D;
  --primary:#EDF1F5; --on-primary:#0C131B; --danger:#FF6B61; --warnbg:#2B1A1D; --okbg:#17241A;
  --heat0:#1B2531; --heat1:#2D4220; --heat2:#4A6E24; --heat3:#77A82E; --heat4:#A6E33D;
  --nova1:#4CC27A; --nova2:#9BCB57; --nova3:#F0B53A; --nova4:#FF6B61;
  --sheet-shadow:0 -10px 40px rgba(0,0,0,.55);
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--text);font-family:'Archivo',system-ui,-apple-system,'Segoe UI',sans-serif;font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
button:disabled{cursor:not-allowed;opacity:.4}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
h1,h2,h3,p{margin:0}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.muted{color:var(--muted)}
abbr{text-decoration:none;cursor:help}
b,.num,.big{font-variant-numeric:tabular-nums}
svg{display:block}

/* Rahmen: Seitenleiste am PC, Tab-Leiste am Handy */
.side{display:none}
.main{max-width:1180px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 16px) 16px calc(112px + env(safe-area-inset-bottom))}
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:5;display:grid;grid-template-columns:repeat(5,1fr);align-items:end;
  background:color-mix(in srgb,var(--surface) 86%,transparent);-webkit-backdrop-filter:saturate(1.5) blur(20px);backdrop-filter:saturate(1.5) blur(20px);
  border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom))}
.tab{display:grid;justify-items:center;gap:3px;background:none;border:0;color:var(--faint);font-size:.68rem;font-weight:600;letter-spacing:.01em;padding:4px 0;min-height:50px}
.tab svg{width:23px;height:23px}
.tab[aria-current="page"]{color:var(--text)}
.fab{justify-self:center;width:54px;height:54px;border-radius:18px;border:0;background:var(--primary);color:var(--on-primary);display:grid;place-items:center;margin-top:-16px;box-shadow:0 8px 20px rgba(0,0,0,.22)}
.fab svg{width:24px;height:24px}
@media(min-width:900px){
  .tabbar{display:none}
  .shell{display:grid;grid-template-columns:240px minmax(0,1fr)}
  .side{display:flex;flex-direction:column;gap:2px;position:sticky;top:0;height:100vh;padding:24px 14px;border-right:1px solid var(--line);background:var(--surface)}
  .main{padding:30px 40px 60px;margin:0;max-width:1240px}
}
.brand{display:flex;align-items:center;gap:10px;font-weight:750;font-size:1.02rem;letter-spacing:-.01em;margin:0 10px 26px}
.brand svg{width:28px;height:28px}
.navbtn{display:flex;align-items:center;gap:12px;background:none;border:0;border-radius:10px;padding:9px 12px;color:var(--muted);font-weight:600;text-align:left}
.navbtn svg{width:20px;height:20px}
.navbtn:hover{background:var(--surface2);color:var(--text)}
.navbtn[aria-current="page"]{background:var(--surface2);color:var(--text)}
.side .btn.primary{margin-top:18px}
.side-foot{margin-top:auto;font-size:.78rem;color:var(--faint);padding:0 10px;line-height:1.55}

/* Grundbausteine */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line2);border-radius:12px;background:var(--surface);color:var(--text);padding:9px 16px;font-weight:650;font-size:.94rem;min-height:42px;transition:background .15s,border-color .15s,opacity .15s}
.btn:hover{background:var(--surface2)}
.btn.primary{background:var(--primary);color:var(--on-primary);border-color:transparent}
.btn.primary:hover{background:var(--primary);opacity:.88}
.btn.danger{background:transparent;color:var(--danger);border-color:color-mix(in srgb,var(--danger) 35%,var(--line))}
.btn.small{min-height:34px;padding:5px 12px;font-size:.87rem;border-radius:10px}
.btn.wide{width:100%}
.btn svg{width:16px;height:16px}
.icon-btn{width:40px;height:40px;flex:none;border-radius:12px;border:1px solid var(--line2);background:var(--surface);color:var(--text);display:grid;place-items:center;padding:0}
.icon-btn:hover{background:var(--surface2)}
.icon-btn svg{width:19px;height:19px}
.icon-btn.sm{width:34px;height:34px;border-radius:10px;border-color:transparent;background:transparent;color:var(--muted)}
.icon-btn.sm:hover{background:var(--surface2);color:var(--text)}
.icon-btn.accent{background:var(--primary);color:var(--on-primary);border-color:transparent}
.icon-btn.accent:hover{background:var(--primary);opacity:.88}
.icon-btn.danger{color:var(--danger)}
.link{background:none;border:0;padding:0;color:inherit;text-decoration:underline;text-decoration-color:var(--line2);text-underline-offset:3px;font-weight:600}
.link:hover{text-decoration-color:currentColor}
.x{background:none;border:0;color:var(--muted);padding:8px;border-radius:10px;display:grid;place-items:center}
.x svg{width:18px;height:18px}
.x:hover{color:var(--text);background:var(--surface2)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:18px}
.card h2{font-size:1rem;font-weight:700;letter-spacing:-.005em}
.chead{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
.foot{color:var(--faint);font-size:.78rem;margin-top:14px;line-height:1.5}
.seg{display:inline-flex;background:var(--surface2);border-radius:11px;padding:3px;gap:2px}
.seg button{background:none;border:0;border-radius:8px;padding:6px 12px;font-weight:600;color:var(--muted);font-size:.86rem;white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--text);box-shadow:0 1px 2px rgba(0,0,0,.1),0 0 0 1px var(--line)}
.pagetabs{display:flex;width:100%;margin:0 0 16px}
.pagetabs button{flex:1;padding:7px 10px}
@media(min-width:700px){.pagetabs{display:inline-flex;width:auto}.pagetabs button{flex:none;padding:6px 18px}}
.note{background:var(--surface);border:1px solid var(--line);border-left:3px solid var(--nova3);border-radius:12px;padding:10px 14px;margin-bottom:14px;font-size:.88rem}
.bar{position:relative;height:6px;border-radius:3px;background:var(--surface2);margin-top:8px}
.bar i{position:absolute;left:0;top:0;bottom:0;border-radius:3px;background:var(--micro)}
.bar i.over{background:var(--danger)}
.bar .tick{position:absolute;left:66.667%;top:-3px;bottom:-3px;width:2px;border-radius:1px;background:var(--text);opacity:.3}
.empty{color:var(--muted)}
.done{display:flex;gap:10px;align-items:center;background:var(--okbg);border-radius:12px;padding:11px 14px;margin-top:6px;font-size:.92rem}
.done svg{width:19px;height:19px;flex:none;color:var(--micro)}
.warn{display:flex;gap:10px;align-items:flex-start;background:var(--warnbg);border-radius:12px;padding:10px 14px;margin-top:10px;font-size:.9rem}
.warn svg{width:19px;height:19px;flex:none;color:var(--danger);margin-top:1px}
.nova{display:inline-block;border-radius:6px;padding:1px 6px;font-size:.7rem;font-weight:700;color:#fff;white-space:nowrap}
.nova.n1{background:var(--nova1)} .nova.n2{background:var(--nova2)} .nova.n3{background:var(--nova3);color:#1B1B1B} .nova.n4{background:var(--nova4)}
.chip{display:inline-flex;align-items:center;border-radius:7px;padding:2px 8px;font-size:.75rem;font-weight:600;background:var(--surface2);color:var(--muted)}
.chip.strong{color:var(--text);background:color-mix(in srgb,var(--text) 9%,var(--surface2))}
.chips{display:flex;flex-wrap:wrap;gap:4px;margin-top:5px}
.badge{display:inline-flex;align-items:center;gap:5px;border-radius:7px;padding:2px 8px 2px 6px;font-size:.72rem;font-weight:700;margin-bottom:4px;line-height:1.35}
.badge svg{width:13px;height:13px;flex:none}
.badge.own{background:var(--surface2);color:var(--muted)}
.res .iname .badge,.pending .pname .badge{display:flex;width:fit-content}
.ns{display:inline-block;border-radius:6px;padding:1px 6px;font-size:.7rem;font-weight:700}
.ns-a{background:#1F8A4C;color:#fff}.ns-b{background:#6AA83A;color:#fff}.ns-c{background:#E8B91C;color:#1b1b1b}.ns-d{background:#E8872C;color:#1b1b1b}.ns-e{background:#D23F31;color:#fff}
.hint{color:var(--muted);font-size:.85rem;margin:4px 0 8px}

/* Seitenkopf */
.dayhead,.weekbar{display:flex;align-items:center;gap:8px;margin:2px 0 16px}
.dayttl{flex:1;min-width:0;background:none;border:0;text-align:left;padding:0;color:inherit}
.dayttl .t,.weekbar .t b{display:block;font-size:1.8rem;line-height:1.1;font-weight:750;letter-spacing:-.025em}
.dayttl .s,.weekbar .t span{display:block;color:var(--muted);margin-top:3px;font-size:.9rem}
.weekbar .t{flex:1;min-width:0}

/* Heute */
.strip{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-bottom:16px}
.tile{background:none;border:0;border-radius:14px;padding:6px 0 7px;display:grid;justify-items:center;gap:2px;color:var(--muted)}
.tile .wd{font-size:.7rem;font-weight:650}
.tile svg{width:36px;height:36px}
.tile .mt{fill:none;stroke:var(--surface2);stroke-width:3.2}
.tile .mf{fill:none;stroke:var(--micro);stroke-width:3.2;stroke-linecap:round}
.tile text{fill:var(--text);font-size:12px;font-weight:700;font-family:inherit}
.tile.sel{background:var(--surface);box-shadow:0 0 0 1px var(--line)}
.tile.today .wd{color:var(--text)}
.tile.today .wd::after{content:"";display:block;width:4px;height:4px;border-radius:50%;background:currentColor;margin:2px auto 0}
.cols{display:grid;gap:14px;grid-template-columns:minmax(0,1fr)}
.col{display:grid;gap:14px;align-content:start;min-width:0;grid-template-columns:minmax(0,1fr)}
.card,.kpi{min-width:0}
.stack{display:grid;gap:14px;grid-template-columns:minmax(0,1fr)}
@media(min-width:1100px){.cols{grid-template-columns:minmax(0,1.05fr) minmax(0,.95fr)}}

.hero{display:grid;grid-template-columns:auto minmax(0,1fr);gap:20px;align-items:center;padding:20px 18px}
.rings{width:128px;height:128px}
@media(min-width:420px){.rings{width:148px;height:148px}}
.rt{fill:none;opacity:.14}
.rf{fill:none;stroke-linecap:round;transition:stroke-dashoffset .5s cubic-bezier(.2,.7,.2,1)}
.rt.e,.rf.e{stroke:var(--energy)} .rt.p,.rf.p{stroke:var(--protein)} .rt.m,.rf.m{stroke:var(--micro)}
.rings.intro .rf{animation:ringIn 1.1s cubic-bezier(.2,.7,.2,1) both}
.rings.intro .rf.p{animation-delay:.08s} .rings.intro .rf.m{animation-delay:.16s}
@keyframes ringIn{from{stroke-dashoffset:var(--len)}}
.hstats{display:grid;gap:12px;min-width:0}
.hstat{display:grid;grid-template-columns:10px minmax(0,1fr);column-gap:10px}
.hstat .key{width:8px;height:8px;border-radius:50%;margin-top:.45em}
.key.e{background:var(--energy)} .key.p{background:var(--protein)} .key.m{background:var(--micro)}
.hstat .lbl{font-size:.75rem;color:var(--muted);font-weight:600;display:block;text-transform:uppercase;letter-spacing:.05em}
.hstat .val{line-height:1.2}
.hstat .val b{font-size:1.4rem;font-weight:750;letter-spacing:-.01em}
.hstat .val span{color:var(--muted);font-weight:550}
.hstat small{display:block;color:var(--muted);font-size:.8rem;line-height:1.35}
@media(max-width:380px){.hstat .val b{font-size:1.22rem}.rings{width:112px;height:112px}}

.gaps h2{margin-bottom:6px}
.gaplist{list-style:none;margin:0;padding:0}
.gaplist li{padding:12px 0;border-top:1px solid var(--line)}
.gaplist li:first-child{border-top:0;padding-top:4px}
.gtop{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.gname{font-weight:650}
.gval{font-weight:700}
.grest{color:var(--muted);font-size:.84rem;margin-top:6px}
.sugg{display:flex;gap:8px;align-items:flex-start;margin-top:8px;font-size:.88rem;color:var(--muted);background:var(--surface2);border-radius:10px;padding:8px 10px}
.sugg b{color:var(--text)}
.sugg svg{width:15px;height:15px;flex:none;margin-top:3px;color:var(--faint)}
.sugg.ok svg{color:var(--micro)}
.empty-card{display:grid;gap:10px;justify-items:start;padding:22px}
.empty-card h2{font-size:1.15rem}
.empty-card p{color:var(--muted);max-width:52ch}

.meals{padding:6px 18px 10px}
.meal{padding:10px 0;border-top:1px solid var(--line)}
.meal:first-of-type{border-top:0}
.mhead{display:flex;align-items:center;gap:6px}
.mhead h3{font-size:.98rem;font-weight:700;flex:1}
.mk{color:var(--muted);font-weight:600;font-size:.88rem;margin-right:4px;white-space:nowrap}
.rows{list-style:none;margin:4px 0 0;padding:0}
.row{display:flex;align-items:center;gap:12px;background:none;border:0;border-radius:12px;padding:8px 6px;margin:0 -6px;text-align:left;color:inherit;width:calc(100% + 12px)}
.row:hover{background:var(--surface2)}
.thumb{position:relative;flex:none;width:40px;height:40px;border-radius:11px;background:var(--surface2);overflow:hidden;display:grid;place-items:center}
.thumb::before{content:attr(data-l);font-weight:700;color:var(--muted);font-size:.95rem}
.thumb.supp{background:color-mix(in srgb,var(--protein) 16%,var(--surface2))}
.thumb img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:#fff}
.thumb.lg{width:54px;height:54px;border-radius:14px}
.thumb.md{width:46px;height:46px;border-radius:13px}
.thumb.lg::before{font-size:1.25rem}
.thumb.ico{background:color-mix(in srgb,var(--c) 14%,var(--surface2))}
.thumb.ico::before{content:none}
.thumb.ico svg{width:21px;height:21px;color:var(--c)}
.photo{display:grid;place-items:center;background:#fff;border-radius:14px;margin:0 0 12px;padding:8px;max-height:160px;overflow:hidden}
.photo img{max-width:100%;max-height:144px;object-fit:contain}
.rname{flex:1;min-width:0}
.rn{display:block;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rname small{display:block;color:var(--muted);font-size:.8rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rk{font-weight:700;white-space:nowrap;text-align:right;min-width:4.5em}
.rk small{color:var(--muted);font-weight:500}

.water .whead{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.wval b{font-size:1.35rem;font-weight:750}
.wval{color:var(--muted)}
.water .bar i{background:var(--protein)}
.wbtns{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.chipbtn{border:1px solid var(--line2);background:var(--surface);border-radius:999px;padding:7px 14px;font-weight:600;min-height:38px;font-size:.9rem}
.chipbtn:hover{background:var(--surface2)}

.nrow{display:grid;grid-template-columns:minmax(0,1fr) auto;column-gap:10px;padding:9px 0;border-top:1px solid var(--line)}
.nrow:first-of-type{border-top:0}
.tap{cursor:pointer;border-radius:12px}
.tap:hover{background:color-mix(in srgb,var(--text) 4%,transparent)}
.nrow.tap{margin:0 -8px;padding-left:8px;padding-right:8px}
.info-i{display:inline-grid;place-items:center;width:16px;height:16px;border-radius:50%;border:1.5px solid var(--line2);color:var(--faint);font-size:.66rem;font-weight:800;font-style:normal;vertical-align:1px;margin-left:3px}
.nn{font-weight:550}
.nv{color:var(--muted);font-size:.88rem;white-space:nowrap;text-align:right}
.nv b{color:var(--text);font-size:.98rem;font-weight:700}
.nv abbr{color:var(--faint);margin-right:2px}
.nrow .bar{grid-column:1/-1}
.ng{font-size:.72rem;font-weight:700;color:var(--faint);margin:18px 0 2px;text-transform:uppercase;letter-spacing:.06em}
.ng:first-of-type{margin-top:4px}
.nova-bar{display:flex;height:10px;border-radius:5px;overflow:hidden;background:var(--surface2);margin:8px 0;gap:2px}
.nova-bar span{display:block;height:100%}
.legend{list-style:none;margin:6px 0 0;padding:0;display:grid;gap:4px;font-size:.86rem}
.legend li{display:flex;align-items:center;gap:8px}
.dot{width:10px;height:10px;border-radius:3px;flex:none}

.inline{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end;margin-top:12px}
.fld{display:grid;gap:4px;font-size:.82rem;font-weight:600;color:var(--muted);min-width:0}
.fld.grow{flex:1 1 150px}
.input,.fld input,.fld select,.field input,.field select,.field textarea{width:100%;font-size:16px;padding:10px 12px;border:1px solid var(--line2);border-radius:12px;background:var(--surface);color:var(--text);min-height:44px}
.input:focus,.fld input:focus,.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--faint);outline:none;box-shadow:0 0 0 3px color-mix(in srgb,var(--focus) 18%,transparent)}
.withunit{position:relative;display:block}
.withunit input{padding-right:40px;width:9em}
.withunit em{position:absolute;right:12px;top:50%;transform:translateY(-50%);font-style:normal;color:var(--muted);pointer-events:none;font-size:.9rem}
.sportl{list-style:none;margin:12px 0 0;padding:0}
.sportl li{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 0;border-top:1px solid var(--line)}
.sportl li.tap{margin:0 -8px;padding:8px}
.sportl small{display:block;color:var(--muted);font-size:.8rem}
.sportl .wi{display:flex;align-items:center;gap:10px}
.sportl .wi svg{width:18px;height:18px;color:var(--protein);flex:none}
.chev{color:var(--faint);font-weight:700}
.body h2{margin-bottom:2px}
.sportform{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px;align-items:end;margin-top:12px}
.sportform .fld.grow{grid-column:1/-1}
.sportform .fld input{width:100%}
.sportform .btn{grid-column:1/-1}
@media(min-width:520px){.sportform{grid-template-columns:minmax(0,2fr) minmax(0,1fr) minmax(0,1fr) auto}.sportform .fld.grow{grid-column:auto}.sportform .btn{grid-column:auto}}

/* Woche */
.kpis{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media(min-width:700px){.kpis{grid-template-columns:repeat(4,minmax(0,1fr))}}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px 16px}
.kpi .l{font-size:.72rem;color:var(--muted);font-weight:650;text-transform:uppercase;letter-spacing:.05em}
.kpi .v{font-size:1.6rem;font-weight:750;line-height:1.2;margin-top:2px;letter-spacing:-.01em;font-variant-numeric:tabular-nums}
.kpi .v span{font-size:.88rem;color:var(--muted);font-weight:600}
.kpi .d{font-size:.78rem;color:var(--muted)}
.often{list-style:none;margin:0;padding:0}
.often li{padding:12px 0;border-top:1px solid var(--line)}
.often li:first-child{border-top:0;padding-top:4px}
.goodchips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.heat{display:grid;grid-template-columns:minmax(92px,1.4fr) repeat(7,minmax(0,1fr));gap:3px;align-items:center;font-size:.78rem;margin-top:8px}
.heat .hd{text-align:center;color:var(--muted);font-weight:650;padding-bottom:2px}
.heat .rl{color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding-right:6px}
.heat .c{height:18px;border-radius:4px;background:var(--heat0)}
.heat .c.none{background:transparent;border:1px dashed var(--line2)}
.c.h1{background:var(--heat1)}.c.h2{background:var(--heat2)}.c.h3{background:var(--heat3)}.c.h4{background:var(--heat4)}
.hlegend{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:12px;font-size:.76rem;color:var(--muted)}
.hlegend span{display:inline-flex;align-items:center;gap:6px}
.hlegend i{width:13px;height:13px;border-radius:4px;display:inline-block}
.chart{width:100%;height:auto;transition:opacity .15s}
.chart.loading{opacity:.5}
.chart text{font-family:inherit}
.hit{fill:transparent}
.hit:hover,.hit:focus{fill:color-mix(in srgb,var(--text) 6%,transparent);outline:none}
.controls{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.stats{display:flex;flex-wrap:wrap;gap:22px;margin:12px 0 4px}
.stat b{display:block;font-size:1.2rem;font-weight:750;line-height:1.25}
.stat span{color:var(--muted);font-size:.8rem}
details.tbl summary{cursor:pointer;font-weight:650;margin-top:12px}
table{border-collapse:collapse;width:100%;font-size:.88rem;margin-top:8px}
th,td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--line)}
td.r,th.r{text-align:right;font-variant-numeric:tabular-nums}
.tip{position:fixed;z-index:30;background:var(--text);color:var(--bg);padding:6px 10px;border-radius:9px;font-size:.84rem;pointer-events:none;max-width:70vw}

/* Einkauf */
.shoplist{list-style:none;margin:0;padding:0}
.shoplist li{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.shoplist li:first-child{border-top:0}
.shoplist label{display:flex;align-items:center;gap:12px;flex:1;min-width:0;cursor:pointer}
.shoplist input[type=checkbox]{width:20px;height:20px;flex:none;accent-color:var(--primary)}
.shoplist .done-it .nm{text-decoration:line-through;color:var(--faint)}
.shoplist .amt{color:var(--muted);white-space:nowrap;font-weight:600}

/* Mehr */
.iname strong{font-weight:650;overflow-wrap:break-word;hyphens:auto;-webkit-hyphens:auto}
.ibrand{color:var(--muted);font-size:.84rem;display:block}
.pgrid{display:grid;gap:4px 14px;grid-template-columns:repeat(auto-fill,minmax(180px,1fr))}
.me-seg{display:flex;width:100%}
.me-seg button{flex:1;display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:9px 12px}
.me-seg svg{width:17px;height:17px}
.me-hero{padding:20px 18px 0;overflow:hidden}
.me-who{display:flex;align-items:center;gap:14px}
.me-who .t{min-width:0}
.me-who h2{font-size:1.1rem}
.me-who .chips{margin-top:6px}
.avatar{flex:none;width:46px;height:46px;border-radius:50%;display:grid;place-items:center;background:var(--surface2);color:var(--text)}
.avatar svg{width:23px;height:23px}
.goals{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));margin:18px -18px 0;border-top:1px solid var(--line)}
.goal{padding:14px 12px 16px;min-width:0}
.goal:first-child{padding-left:18px}
.goal:last-child{padding-right:18px}
.goal + .goal{border-left:1px solid var(--line)}
.goal .gl{display:flex;align-items:center;gap:7px;font-size:.72rem;font-weight:650;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.goal .gl i{flex:none;width:8px;height:8px;border-radius:50%;background:var(--c)}
.goal .gn{display:block;margin-top:8px;font-size:clamp(1.3rem,5.4vw,1.8rem);line-height:1.05;font-weight:750;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.goal .gs{display:block;margin-top:5px;font-size:.76rem;line-height:1.3;color:var(--muted)}
@media(min-width:520px){.goal{padding:16px 18px 18px}}
.libgrid{display:grid;gap:14px;grid-template-columns:minmax(0,1fr);align-items:start}
@media(min-width:1100px){.libgrid{grid-template-columns:repeat(2,minmax(0,1fr))}}
.ctitle{display:flex;align-items:center;gap:12px;margin-bottom:4px}
.ctitle .ct{flex:1;min-width:0}
.ctitle h2{font-size:1rem}
.ctitle .sub{display:block;color:var(--muted);font-size:.82rem;line-height:1.35;margin-top:2px}
.cico{flex:none;width:38px;height:38px;border-radius:12px;display:grid;place-items:center;color:var(--c);background:color-mix(in srgb,var(--c) 13%,var(--surface2))}
.cico svg{width:20px;height:20px}
.cnt{font-weight:700;color:var(--faint)}
@media(max-width:480px){.cnt{display:none}}
.pgrid.three{grid-template-columns:repeat(3,minmax(0,1fr));gap:4px 10px}
.pgrid.three .withunit input{padding-right:42px;padding-left:10px}
.pgrid.three .withunit em{right:10px;font-size:.8rem}
.librow{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;padding:12px 0;border-top:1px solid var(--line)}
.libcard .ctitle + .librow{margin-top:8px}
.librow .iname{min-width:0}
.librow .acts{display:flex;gap:2px}
.emptybox{display:grid;grid-template-columns:auto minmax(0,1fr);gap:14px;align-items:center;margin-top:10px;padding:14px 16px;border:1px dashed var(--line2);border-radius:14px;color:var(--muted);font-size:.9rem}
.emptybox svg{width:24px;height:24px;color:var(--faint)}
.pills{display:flex;gap:8px}
.pills .pill{position:relative;flex:1}
.pills .pill input{position:absolute;inset:0;width:100%;height:100%;min-height:0;margin:0;padding:0;border:0;opacity:0;cursor:pointer}
.pills .pill span{display:flex;align-items:center;justify-content:center;min-height:44px;border-radius:12px;border:1px solid var(--line2);background:var(--surface);font-weight:650;color:var(--muted);transition:background .15s,color .15s}
.pills .pill input:checked + span{background:var(--primary);color:var(--on-primary);border-color:transparent}
.pills .pill input:focus-visible + span{outline:2px solid var(--focus);outline-offset:2px}
.field .withunit input{width:100%;padding-right:58px}
.steps{list-style:none;margin:10px 0 0;padding:0;display:grid;gap:12px;counter-reset:st}
.steps li{display:flex;gap:12px;align-items:center;line-height:1.35}
.steps li::before{counter-increment:st;content:counter(st);flex:none;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;background:var(--surface2);font-weight:700;font-size:.84rem}
.acct{display:flex;align-items:center;gap:12px}
.acct .who{flex:1;min-width:0;display:grid}
.acct .who b{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.acct .who span{font-size:.84rem}

/* Bottom-Sheet */
.overlay{position:fixed;inset:0;background:rgba(5,9,14,.5);z-index:10;animation:fadeIn .18s ease-out}
.sheet{position:fixed;z-index:11;left:0;right:0;bottom:0;max-height:92vh;display:flex;flex-direction:column;background:var(--surface);
  border-radius:22px 22px 0 0;box-shadow:var(--sheet-shadow);padding-bottom:env(safe-area-inset-bottom);animation:sheetIn .26s cubic-bezier(.2,.8,.2,1)}
.sheet::before{content:"";display:block;width:36px;height:5px;border-radius:3px;background:var(--line2);margin:8px auto 0}
@media(min-width:760px){.sheet{left:50%;right:auto;bottom:auto;top:6vh;width:660px;max-height:88vh;transform:translateX(-50%);border-radius:20px;border:1px solid var(--line);animation:fadeIn .18s ease-out}.sheet::before{display:none}}
@keyframes sheetIn{from{transform:translateY(40px);opacity:.4}}
@keyframes fadeIn{from{opacity:0}}
.sheet-head{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:12px 18px 10px}
.sheet-head h2{font-size:1.15rem;font-weight:750;letter-spacing:-.01em}
.sheet-head .sub{color:var(--muted);font-size:.86rem}
.sheet-body{padding:4px 18px 18px;overflow:auto;flex:1;overscroll-behavior:contain}
.tabs{display:flex;gap:2px;margin-bottom:12px;background:var(--surface2);border-radius:11px;padding:3px}
.tabs button{flex:1;background:none;border:0;border-radius:8px;padding:7px 6px;font-weight:600;color:var(--muted);font-size:.9rem}
.tabs button[aria-selected="true"]{background:var(--surface);color:var(--text);box-shadow:0 1px 2px rgba(0,0,0,.1),0 0 0 1px var(--line)}
.when{display:flex;gap:8px;margin-bottom:10px}
.when select{flex:1;min-width:0}
.when input{width:auto;min-width:8.6em}
.when select,.when input{font-size:16px;padding:9px 10px;border:1px solid var(--line2);border-radius:12px;background:var(--surface);min-height:44px}
.row2{display:flex;gap:8px;margin-bottom:10px}
.row2 input{flex:1;min-width:0;font-size:16px;padding:10px 12px;border:1px solid var(--line2);border-radius:12px;background:var(--surface);min-height:44px}
.results{list-style:none;margin:0;padding:0}
#results h3{font-size:.72rem;color:var(--faint);font-weight:700;margin:14px 0 2px;text-transform:uppercase;letter-spacing:.06em}
.res{display:flex;gap:10px;align-items:flex-start;justify-content:space-between;padding:10px 0;border-top:1px solid var(--line);cursor:pointer}
.res:hover{background:var(--surface2);margin:0 -10px;padding:10px;border-radius:12px;border-top-color:transparent}
.res .iname{min-width:0;flex:1}
.res.picked{background:var(--surface2);margin:0 -10px;padding:10px;border-radius:12px;border-top-color:transparent;flex-wrap:wrap;box-shadow:inset 0 0 0 1px var(--line2)}
.nutdetail{flex:0 0 100%;min-width:0;margin-top:6px;padding-top:8px;border-top:1px solid var(--line);cursor:auto}
.nutdetail summary{cursor:pointer;font-weight:650;font-size:.9rem}
.ndrow{display:flex;justify-content:space-between;gap:10px;padding:5px 0;border-top:1px solid var(--line);font-size:.88rem}
.ndrow span:last-child{text-align:right;white-space:nowrap}
.resact{display:flex;align-items:center;gap:2px;flex:none}
.star[aria-pressed="true"]{color:var(--nova3)}
.pending{border-top:1px solid var(--line);padding:12px 18px;background:var(--surface);display:grid!important;grid-template-columns:auto minmax(0,1fr) auto;grid-template-areas:"t n n" "t p p" "q q b";column-gap:12px;row-gap:6px}
.pending[hidden]{display:none!important}
.pending .thumb{grid-area:t;align-self:start}
.pending .pname{grid-area:n;font-weight:700;overflow-wrap:anywhere}
.pending .pprev{grid-area:p;color:var(--muted);font-size:.85rem}
.pending .gram{grid-area:q}
.pending .btn.primary{grid-area:b}
.gram{display:flex;align-items:center;gap:6px;color:var(--muted)}
.gram input{width:6.5em;font-size:16px;padding:9px 10px;border:1px solid var(--line2);border-radius:12px;text-align:right;background:var(--surface);min-height:44px}
.menu{display:grid;gap:8px}
.menu-item{display:block;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line2);border-radius:14px;padding:12px 14px;font-weight:650}
.menu-item small{display:block;color:var(--muted);font-weight:500;font-size:.84rem}
.menu-item:hover:not(:disabled){background:var(--surface2)}
.secttl{font-size:.72rem;color:var(--faint);font-weight:700;margin:18px 0 6px;text-transform:uppercase;letter-spacing:.06em}
.field{display:grid;gap:5px;margin-bottom:12px}
.field label,.field legend{font-weight:600;font-size:.84rem;color:var(--muted)}
fieldset.field{border:0;padding:0;margin:0 0 12px}
.radios{display:flex;gap:16px}
.radios label{display:flex;align-items:center;gap:6px;color:var(--text);font-weight:600}
.radios input{width:auto;min-height:0;accent-color:var(--primary)}
.fgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:4px 10px;margin-top:8px}
.fgrid .field{margin-bottom:6px}
.fgrid label{font-weight:500;font-size:.8rem}
details.fd{border-top:1px solid var(--line);padding:10px 0}
details.fd summary{cursor:pointer;font-weight:700}
.error{color:var(--danger);font-weight:600;margin-bottom:10px}
.ing{display:flex;gap:8px;align-items:center;padding:6px 0;border-top:1px solid var(--line)}
.ing .nm{flex:1;min-width:0;overflow-wrap:anywhere}
.preview{background:var(--surface2);border-radius:12px;padding:10px 12px;margin:10px 0;font-size:.9rem}
.mini{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;margin:4px 0 12px}
.mini div{background:var(--surface2);border-radius:12px;padding:9px 6px;text-align:center;min-width:0}
.mini b{display:block;font-weight:750;font-size:1.02rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mini span{font-size:.72rem;color:var(--muted)}
.contrib{list-style:none;margin:0 0 14px;padding:0;font-size:.9rem}
.contrib li{display:flex;justify-content:space-between;gap:12px;padding:6px 0;border-top:1px solid var(--line)}
.contrib li b{text-align:right;font-weight:600}
.sheet-actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.sheetbar{display:flex;align-items:center;justify-content:space-between;gap:12px;border-top:1px solid var(--line);padding:12px 18px}
.sheetbar span{color:var(--muted);font-size:.9rem}

/* Anmeldung, Laden, Hinweise */
.auth{max-width:400px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 12vh) 20px 40px}
.auth .brand{margin:0 0 28px;font-size:1.25rem}
.auth .brand svg{width:40px;height:40px}
.auth h1{font-size:1.9rem;font-weight:750;line-height:1.15;margin-bottom:8px;letter-spacing:-.025em}
.auth p{color:var(--muted);margin-bottom:22px}
.auth .btn.primary{width:100%;margin-top:6px}
.auth.setup{max-width:520px;padding-top:calc(env(safe-area-inset-top) + 6vh)}
.authlinks{display:grid;justify-items:start;gap:14px;margin-top:18px}
.auth .done{margin:0 0 16px;color:var(--text)}
.boot{min-height:100vh;display:grid;place-items:center}
.boot svg{width:56px;height:56px;animation:spin 1.2s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top) + 12px);transform:translateX(-50%);background:var(--primary);color:var(--on-primary);padding:10px 16px;border-radius:12px;z-index:40;max-width:90vw;width:max-content;font-weight:600;font-size:.92rem;box-shadow:0 8px 24px rgba(0,0,0,.25);display:flex;align-items:center;gap:14px}
.toast-btn{flex:none;background:none;border:0;padding:4px 2px;color:inherit;font-weight:800;text-decoration:underline;text-underline-offset:3px}
.sync{position:fixed;z-index:6;left:50%;transform:translateX(-50%);bottom:calc(86px + env(safe-area-inset-bottom));max-width:calc(100vw - 32px);
  background:var(--surface);border:1px solid var(--line2);color:var(--muted);border-radius:999px;padding:7px 14px;font-size:.82rem;font-weight:650;
  box-shadow:0 4px 16px rgba(0,0,0,.14);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sync.off{color:var(--text);border-color:var(--nova3)}
@media(min-width:900px){.sync{bottom:18px;left:calc(50% + 120px)}}

/* Training */
.planlist{display:grid;gap:8px}
.planrow{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--surface2);border:1px solid transparent;border-radius:14px;padding:12px 12px 12px 14px;color:inherit}
.planrow:hover{border-color:var(--line2)}
.planrow .pn{flex:1;min-width:0;display:grid}
.planrow .pn b{font-weight:650;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.planrow .pn small{color:var(--muted);font-size:.8rem}
.go{flex:none;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:var(--primary);color:var(--on-primary)}
.go svg{width:14px;height:14px}
.mrow{display:grid;grid-template-columns:minmax(0,1fr) auto;column-gap:10px;padding:6px 0}
.mrow .bar{grid-column:1/-1;margin-top:5px}
.mrow .bar i{background:var(--protein)}
.mrow .bar i.low{opacity:.45}
.mrow .bar .tick{left:50%}
.exsearch{position:relative;margin-bottom:10px}
.exsearch svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:18px;height:18px;color:var(--faint);pointer-events:none}
.exsearch input{width:100%;padding-left:40px}
.fchips{display:flex;gap:6px;overflow-x:auto;padding:2px 2px 6px;margin:0 -2px 4px;scrollbar-width:none}
.fchips::-webkit-scrollbar{display:none}
.fchip{flex:none;border:1px solid var(--line2);background:var(--surface);color:var(--muted);border-radius:999px;padding:6px 12px;font-weight:600;font-size:.84rem}
.fchip[aria-pressed="true"]{background:var(--primary);color:var(--on-primary);border-color:transparent}
.exlist{list-style:none;margin:0;padding:0}
.exrow{display:flex;align-items:center;gap:12px;width:100%;background:none;border:0;border-top:1px solid var(--line);padding:10px 6px;text-align:left;color:inherit}
.exlist li:first-child .exrow{border-top:0}
.exrow:hover{background:color-mix(in srgb,var(--text) 4%,transparent)}
.exico{flex:none;width:38px;height:38px;border-radius:11px;display:grid;place-items:center;color:var(--c);background:color-mix(in srgb,var(--c) 13%,var(--surface2))}
.exico svg{width:19px;height:19px}
.exrow .check{flex:none;width:26px;height:26px;border-radius:50%;border:1.5px solid var(--line2);display:grid;place-items:center;color:var(--on-primary)}
.exrow.on .check{background:var(--primary);border-color:transparent}
.exrow .check svg{width:14px;height:14px}
.wohead{display:flex;align-items:center;gap:12px;margin:2px 0 16px}
.wohead .t{flex:1;min-width:0;display:grid}
.live{display:inline-flex;align-items:center;gap:6px;font-size:.72rem;font-weight:700;color:var(--protein);text-transform:uppercase;letter-spacing:.07em}
.live::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor;animation:pulse 1.6s infinite}
@keyframes pulse{50%{opacity:.25}}
.wohead b{font-size:1.6rem;font-weight:750;letter-spacing:-.025em;line-height:1.2;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.clock{font-variant-numeric:tabular-nums;color:var(--muted);font-weight:600}
.wolist{display:grid;gap:12px}
.excard{padding:14px 14px 12px}
.exhead{display:flex;align-items:flex-start;gap:8px}
.exname{flex:1;min-width:0;background:none;border:0;padding:0;text-align:left;display:grid;color:inherit}
.exname b{font-size:1rem;font-weight:700}
.exname small{color:var(--muted);font-size:.8rem}
.exmeta{font-size:.8rem;color:var(--muted);margin-top:6px}
.exlast{font-size:.8rem;color:var(--faint);margin-top:2px}
.sethead,.setrow{display:grid;grid-template-columns:30px minmax(0,1fr) 68px 62px 42px;gap:8px;align-items:center}
.sethead{margin-top:12px;padding:0 4px 6px;font-size:.68rem;font-weight:700;color:var(--faint);text-transform:uppercase;letter-spacing:.06em}
.sethead span:nth-child(n+3){text-align:center}
.setrow{padding:4px;border-radius:12px;transition:background .2s}
.setrow.is-done{background:color-mix(in srgb,var(--protein) 11%,transparent)}
.sn{display:grid;place-items:center;font-weight:700;color:var(--muted)}
.sprev{color:var(--faint);font-size:.82rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sin{width:100%;min-width:0;text-align:center;font-size:16px;font-weight:650;padding:8px 4px;border:1px solid var(--line);border-radius:10px;background:var(--surface2);min-height:40px;font-variant-numeric:tabular-nums}

<script type="module">
/* =====================================================================
   KONFIGURATION
   1) Firebase: Projekt anlegen, "Authentication" (E-Mail/Passwort) und
      "Realtime Database" aktivieren, dann die Web-App-Daten hier eintragen.
      Die databaseURL steht oben auf der Seite "Realtime Database", zum Beispiel
      https://DEIN_PROJEKT-default-rtdb.europe-west1.firebasedatabase.app
      Solange hier "DEIN" steht, läuft die App im Testmodus (nur Browser).
   2) Regeln der Realtime Database (damit jeder nur seine eigenen Daten sieht):
      {
        "rules": {
          "users": {
            "$uid": {
              ".read": "$uid === auth.uid",
              ".write": "$uid === auth.uid"
            }
          }
        }
      }
   ===================================================================== */
const FIREBASE_CONFIG = {
  apiKey: "AIzaSyDtzirq0BuDqa8-TmuStqmLDnNpG3l5YNQ",
  authDomain: "health-45f80.firebaseapp.com",
  databaseURL: "https://health-45f80-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "health-45f80",
  appId: "1:676711657322:web:181b9006c52566d4ad3f13"
};
const FIREBASE_VERSION = "10.14.1";
const FIREBASE_MISSING = ['apiKey', 'databaseURL', 'projectId', 'appId'].filter(k => !FIREBASE_CONFIG[k] || String(FIREBASE_CONFIG[k]).startsWith('DEIN'));
const FIREBASE_READY = FIREBASE_MISSING.length === 0;

/* PURE:START  (Logik ohne Browser-Abhängigkeit, wird separat getestet) */
const pad = n => String(n).padStart(2, '0');
const fmtDate = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const parseDate = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
const addDays = (d, n) => { const x = new Date(d.getFullYear(), d.getMonth(), d.getDate()); x.setDate(x.getDate() + n); return x; };
const mondayOf = d => { const x = new Date(d.getFullYear(), d.getMonth(), d.getDate()); x.setDate(x.getDate() - ((x.getDay() + 6) % 7)); return x; };
const weekDates = monday => Array.from({ length: 7 }, (_, i) => fmtDate(addDays(monday, i)));
const num = x => { if (x === null || x === undefined || x === '') return null; const n = Number(x); return Number.isFinite(n) ? n : null; };
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);

/* Die Realtime Database speichert Listen als Objekte mit Zahlen-Schlüsseln und lässt leere Listen weg. */
const toArr = x => Array.isArray(x) ? x
  : (x && typeof x === 'object' ? Object.keys(x).sort((a, b) => Number(a) - Number(b)).map(k => x[k]) : []);
/* Schlüssel in der Realtime Database dürfen kein . $ # [ ] / enthalten und höchstens 768 Byte lang sein */
const shopKey = (week, key) => week + '|' + encodeURIComponent(String(key)).replace(/\./g, '%2E').slice(0, 200);

/* Zahl aus Eingabefeld: leer -> null, ungültig -> NaN, Komma oder Punkt erlaubt */
function parseDecimal(s) {
  if (s === null || s === undefined) return null;
  const t = String(s).trim().replace(',', '.');
  if (t === '') return null;
  if (!/^(\d+\.?\d*|\.\d+)$/.test(t)) return NaN;
  return Number(t);
}

const MEALS = [
  { id: 'fruehstueck', label: 'Frühstück', def: '08:00' },
  { id: 'mittag', label: 'Mittagessen', def: '12:30' },
  { id: 'abend', label: 'Abendessen', def: '18:30' },
  { id: 'snack', label: 'Snacks', def: '15:30' },
  { id: 'erg', label: 'Nahrungsergänzung', def: '08:00' }
];
const mealForTime = t => {
  const m = /^(\d\d):(\d\d)$/.exec(t || ''); if (!m) return 'snack';
  const x = Number(m[1]) * 60 + Number(m[2]);
  if (x < 10 * 60 + 30) return 'fruehstueck';
  if (x < 14 * 60 + 30) return 'mittag';
  if (x < 17 * 60) return 'snack';
  if (x < 21 * 60) return 'abend';
  return 'snack';
};

const WATER_TARGET = 1500;
const SATFAT_SHARE = 0.05;   // Obergrenze für gesättigte Fette: Anteil an der Tagesenergie (eigene Vorgabe, strenger als die übliche 10 %)
const NUTRIENTS = [
  { key: 'protein', label: 'Eiweiß', unit: 'g', group: 'Makronährstoffe', dec: 0 },
  { key: 'fat', label: 'Fett', unit: 'g', group: 'Makronährstoffe', dec: 0 },
  { key: 'carbs', label: 'Kohlenhydrate', unit: 'g', group: 'Makronährstoffe', dec: 0 },
  { key: 'sugar', label: 'davon Zucker', unit: 'g', group: 'Makronährstoffe', dec: 0 },
  { key: 'fiber', label: 'Ballaststoffe', unit: 'g', group: 'Makronährstoffe', dec: 0, ref: { m: 30, w: 30 } },
  { key: 'salt', label: 'Salz', unit: 'g', group: 'Makronährstoffe', dec: 1, ref: { m: 6, w: 6 }, type: 'max' },
  { key: 'satfat', label: 'Gesättigte Fette', unit: 'g', group: 'Fette und mehr', dec: 1 },
  { key: 'chol', label: 'Cholesterin', unit: 'mg', group: 'Fette und mehr', dec: 0 },
  { key: 'omega3', label: 'Omega-3 gesamt', unit: 'g', group: 'Fette und mehr', dec: 2 },
  { key: 'ala', label: 'Omega-3 ALA (pflanzlich)', unit: 'g', group: 'Fette und mehr', dec: 1, ref: { m: 1.4, w: 1.1 } },
  { key: 'epadha', label: 'Omega-3 EPA + DHA (Fisch)', unit: 'mg', group: 'Fette und mehr', dec: 0, ref: { m: 250, w: 250 } },
  { key: 'caffeine', label: 'Koffein', unit: 'mg', group: 'Fette und mehr', dec: 0, ref: { m: 400, w: 400 }, type: 'max' },
  { key: 'vitA', label: 'Vitamin A', unit: 'µg RAE', group: 'Vitamine', dec: 0, ref: { m: 850, w: 700 } },
  { key: 'vitC', label: 'Vitamin C', unit: 'mg', group: 'Vitamine', dec: 0, ref: { m: 110, w: 95 } },
  { key: 'vitD', label: 'Vitamin D', unit: 'µg', group: 'Vitamine', dec: 1, ref: { m: 20, w: 20 } },
  { key: 'vitE', label: 'Vitamin E', unit: 'mg α-Toc', group: 'Vitamine', dec: 1, ref: { m: 15, w: 12 } },
  { key: 'vitK', label: 'Vitamin K', unit: 'µg', group: 'Vitamine', dec: 0, ref: { m: 70, w: 60 } },
  { key: 'b1', label: 'Vitamin B1', unit: 'mg', group: 'Vitamine', dec: 2, ref: { m: 1.2, w: 1.0 } },
  { key: 'b2', label: 'Vitamin B2', unit: 'mg', group: 'Vitamine', dec: 2, ref: { m: 1.4, w: 1.1 } },
  { key: 'b3', label: 'Niacin (B3)', unit: 'mg NE', group: 'Vitamine', dec: 1, ref: { m: 16, w: 13 } },
  { key: 'b5', label: 'Pantothensäure (B5)', unit: 'mg', group: 'Vitamine', dec: 1, ref: { m: 6, w: 6 } },
  { key: 'b6', label: 'Vitamin B6', unit: 'mg', group: 'Vitamine', dec: 2, ref: { m: 1.6, w: 1.4 } },
  { key: 'b7', label: 'Biotin (B7)', unit: 'µg', group: 'Vitamine', dec: 0, ref: { m: 40, w: 40 } },
  { key: 'b9', label: 'Folat (B9)', unit: 'µg DFE', group: 'Vitamine', dec: 0, ref: { m: 300, w: 300 } },
  { key: 'b12', label: 'Vitamin B12', unit: 'µg', group: 'Vitamine', dec: 1, ref: { m: 4, w: 4 } },
  { key: 'ca', label: 'Calcium', unit: 'mg', group: 'Mineralstoffe', dec: 0, ref: { m: 1000, w: 1000 } },
  { key: 'fe', label: 'Eisen', unit: 'mg', group: 'Mineralstoffe', dec: 1, ref: { m: 10, w: 15 } },
  { key: 'mg', label: 'Magnesium', unit: 'mg', group: 'Mineralstoffe', dec: 0, ref: { m: 350, w: 300 } },
  { key: 'zn', label: 'Zink', unit: 'mg', group: 'Mineralstoffe', dec: 1, ref: { m: 11, w: 7 } },
  { key: 'k', label: 'Kalium', unit: 'mg', group: 'Mineralstoffe', dec: 0, ref: { m: 4000, w: 4000 } },
  { key: 'se', label: 'Selen', unit: 'µg', group: 'Mineralstoffe', dec: 0, ref: { m: 70, w: 60 } },
  { key: 'i', label: 'Jod', unit: 'µg', group: 'Mineralstoffe', dec: 0, ref: { m: 200, w: 200 } },
  { key: 'p', label: 'Phosphor', unit: 'mg', group: 'Mineralstoffe', dec: 0, ref: { m: 700, w: 700 } },
  { key: 'cu', label: 'Kupfer', unit: 'mg', group: 'Mineralstoffe', dec: 2, ref: { m: 1.25, w: 1.25 } },
  { key: 'mn', label: 'Mangan', unit: 'mg', group: 'Mineralstoffe', dec: 1, ref: { m: 2, w: 2 } }
];
const GROUPS = ['Makronährstoffe', 'Fette und mehr', 'Vitamine', 'Mineralstoffe'];
const ALL_KEYS = ['kcal', ...NUTRIENTS.map(n => n.key)];
const MICRO_KEYS = NUTRIENTS.filter(n => n.group === 'Vitamine' || n.group === 'Mineralstoffe').map(n => n.key);
const labelOf = k => k === 'kcal' ? 'Kalorien' : (NUTRIENTS.find(n => n.key === k) || { label: k }).label;

function computeTargets(p) {
  const sex = p && p.sex === 'w' ? 'w' : 'm';
  const w = p && Number(p.weight) > 0 ? Number(p.weight) : (sex === 'm' ? 75 : 60);
  const out = {};
  for (const n of NUTRIENTS) {
    if (n.key === 'protein') out.protein = { value: Math.round((Number(p && p.proteinPerKg) > 0 ? Number(p.proteinPerKg) : 0.8) * w), type: 'min' };
    else if (n.ref) out[n.key] = { value: n.ref[sex], type: n.type || 'min' };
  }
  return addSatfatTarget(addOmegaTarget(out, p), p);
}

/* Menge eines Eintrags: Lebensmittel in Gramm (Werte pro 100 g), Ergänzungen in Stück (Werte pro Stück) */
const itemFactor = it => it.kind === 'supp' ? (Number(it.qty) || 0) : (Number(it.grams) || 0) / 100;
const valuesOf = it => it.kind === 'supp' ? (it.perUnit || {}) : (it.per100 || {});

function sumItems(items) {
  const tot = {};
  for (const k of ALL_KEYS) tot[k] = { sum: 0, missing: 0, n: 0 };
  for (const it of items) {
    const f = itemFactor(it), supp = it.kind === 'supp', vals = valuesOf(it), inc = it.incomplete || [];
    for (const k of ALL_KEYS) {
      const v = num(vals[k]);
      tot[k].n++;
      if (v === null) { if (!supp) tot[k].missing++; }          // Ergänzung: leer heißt "nicht enthalten"
      else { tot[k].sum += v * f; if (!supp && inc.includes(k)) tot[k].missing++; }
    }
  }
  return tot;
}

/* Durchschnitt pro Tag, gerechnet nur über Tage mit Einträgen */
function averageDays(daysItems) {
  const withData = daysItems.filter(a => a.length);
  const res = {};
  for (const k of ALL_KEYS) res[k] = { sum: 0, missing: 0, n: 0 };
  for (const day of withData) {
    const t = sumItems(day);
    for (const k of ALL_KEYS) { res[k].sum += t[k].sum; res[k].missing += t[k].missing; res[k].n += t[k].n; }
  }
  if (withData.length) for (const k of ALL_KEYS) res[k].sum /= withData.length;
  return { tot: res, days: withData.length };
}

function countNova(items) {
  const c = { 1: 0, 2: 0, 3: 0, 4: 0, 0: 0 };
  for (const it of items) { if (it.kind === 'supp') continue; c[it.nova >= 1 && it.nova <= 4 ? it.nova : 0]++; }
  return c;
}

function mealTotals(items) {
  const out = {};
  for (const m of MEALS) out[m.id] = 0;
  for (const it of items) {
    if (it.kind === 'supp') continue;
    const kc = num(valuesOf(it).kcal);
    if (kc !== null && out[it.meal] !== undefined) out[it.meal] += kc * itemFactor(it);
  }
  return out;
}

function coverage(value, target) {
  if (!target) return null;
  const pct = value / target.value;
  let cls;
  if (target.type === 'max') cls = pct <= 1 ? 'ok' : 'low';
  else cls = pct >= 1 ? 'ok' : pct >= 0.5 ? 'mid' : 'low';
  return { pct, cls, fill: Math.min(pct, 1.5) / 1.5 * 100 };
}

/* ---- Einträge, Tage, Bibliothek ---- */
function normItem(it) {
  if (!it || typeof it !== 'object' || !it.name) return null;
  const supp = it.kind === 'supp';
  const out = {
    ...it, id: it.id || uid(), kind: supp ? 'supp' : 'food',
    meal: MEALS.some(m => m.id === it.meal) ? it.meal : (supp ? 'erg' : 'snack'),
    time: /^\d\d:\d\d$/.test(it.time || '') ? it.time : ''
  };
  if (supp) { out.qty = Number(it.qty) || 0; out.perUnit = it.perUnit || {}; out.unit = it.unit || 'Stk'; }
  else {
    out.grams = Number(it.grams) || 0; out.per100 = it.per100 || {}; out.incomplete = toArr(it.incomplete);
    if (it.ingredients) out.ingredients = toArr(it.ingredients);
  }
  return out;
}
const emptyDay = () => ({ items: [], water: 0, weight: null, sport: [], workouts: [] });
function normalizeDay(raw) {
  if (Array.isArray(raw)) return { ...emptyDay(), items: raw.map(normItem).filter(Boolean) };
  if (!raw || typeof raw !== 'object') return emptyDay();
  return {
    items: toArr(raw.items).map(normItem).filter(Boolean),
    water: Math.max(0, Number(raw.water) || 0),
    weight: num(raw.weight),
    sport: toArr(raw.sport).filter(s => s && s.name).map(s => ({
      id: s.id || uid(), name: String(s.name), minutes: num(s.minutes), kcal: num(s.kcal)
    })),
    workouts: toArr(raw.workouts).map(normWorkout).filter(Boolean)
  };
}
function sortItems(items) {
  const mi = id => { const i = MEALS.findIndex(m => m.id === id); return i < 0 ? 99 : i; };
  return items.map((it, i) => ({ it, i })).sort((a, b) =>
    mi(a.it.meal) - mi(b.it.meal) ||
    (a.it.time || '99:99').localeCompare(b.it.time || '99:99') || a.i - b.i).map(x => x.it);
}
const sumSport = sport => (sport || []).reduce((a, s) => a + (num(s.kcal) || 0), 0);

const emptyLib = () => ({ custom: [], favorites: [], recent: [], supplements: [], templates: [], shopChecked: {} });
function normFoodRef(x) {
  const out = { ...x };
  if (x.per100 || 'incomplete' in x) out.incomplete = toArr(x.incomplete);
  if ('ingredients' in x) out.ingredients = toArr(x.ingredients).filter(i => i && i.name).map(i => ({ ...i, incomplete: toArr(i.incomplete) }));
  return out;
}
function normLib(raw) {
  const l = emptyLib();
  if (!raw || typeof raw !== 'object') return l;
  for (const k of ['custom', 'favorites', 'recent', 'supplements']) l[k] = toArr(raw[k]).filter(x => x && x.name).map(normFoodRef);
  /* Die Suche (Open Food Facts, USDA) gibt es nicht mehr: gespeicherte Treffer daraus fliegen aus Favoriten und Zuletzt gegessen */
  for (const k of ['favorites', 'recent']) l[k] = l[k].filter(x => x.source !== 'off' && x.source !== 'usda');
  l.templates = toArr(raw.templates).filter(x => x && x.name).map(normTemplate);
  l.shopChecked = raw.shopChecked && typeof raw.shopChecked === 'object' ? raw.shopChecked : {};
  return l;
}

const foodKey = f => (f.source === 'custom' || f.source === 'recipe' || f.source === 'supp')
  ? f.source + ':' + (f.id || f.name) : (f.source || 'x') + ':' + (f.code || f.name);

function toFoodRef(it) {
  if (it.kind === 'supp') return { source: 'supp', id: it.refId || '', name: it.name, unit: it.unit || 'Stk', perUnit: it.perUnit || {} };
  const r = {
    source: it.source, code: it.code || '', id: it.refId || '', name: it.name, brand: it.brand || '',
    per100: it.per100 || {}, nova: it.nova ?? null, nutri: it.nutri ?? null, incomplete: it.incomplete || [],
    portion: it.portion || null, img: safeImg(it.img)
  };
  if (it.ingredients) { r.ingredients = it.ingredients; r.recipeTotal = it.recipeTotal; }
  return r;
}
function pushRecent(list, food, max = 20) {
  const k = foodKey(food);
  return [food, ...list.filter(x => foodKey(x) !== k)].slice(0, max);
}

function makeItem(food, qty, meal, time) {
  const supp = food.source === 'supp';
  const base = {
    id: uid(), kind: supp ? 'supp' : 'food', name: food.name, brand: food.brand || '',
    source: food.source, code: food.code || '', refId: food.id || '', meal, time: time || '',
    nova: food.nova ?? null, nutri: food.nutri ?? null, img: safeImg(food.img)
  };
  if (supp) return { ...base, qty, unit: food.unit || 'Stk', perUnit: food.perUnit || {} };
  const it = { ...base, grams: qty, per100: food.per100 || {}, incomplete: food.incomplete || [], portion: food.portion || null };
  if (Array.isArray(food.ingredients) && food.ingredients.length) {
    it.ingredients = food.ingredients.map(i => ({ name: i.name, source: i.source, code: i.code || '', grams: i.grams }));
    it.recipeTotal = food.recipeTotal;
  }
  return it;
}

/* ---- Eigene Lebensmittel, Rezepte ---- */
function parseValueFields(fields) {
  const per = {}, bad = [];
  for (const k of ALL_KEYS) {
    const v = parseDecimal(fields[k]);
    if (Number.isNaN(v)) bad.push(k); else per[k] = v;
  }
  return { per, bad };
}
function validateFood(per, mode) {
  if (mode === 'per100') {
    if (per.kcal == null && per.protein == null) return 'Gib mindestens Kalorien oder Eiweiß an.';
    if ((per.protein || 0) + (per.fat || 0) + (per.carbs || 0) > 100.5) return 'Eiweiß, Fett und Kohlenhydrate zusammen können nicht über 100 g pro 100 g liegen.';
    if (per.kcal != null && per.kcal > 900) return 'Mehr als 900 kcal pro 100 g gibt es bei Lebensmitteln nicht. Prüfe die Eingabe.';
  } else if (ALL_KEYS.every(k => !per[k])) return 'Gib mindestens einen Nährstoff an.';
  return '';
}
function computeRecipe(ings, totalGrams) {
  const sumG = ings.reduce((a, i) => a + (Number(i.grams) || 0), 0);
  const total = Number(totalGrams) > 0 ? Number(totalGrams) : sumG;
  const per100 = {}, incomplete = [];
  for (const k of ALL_KEYS) {
    let sum = 0, known = 0, unknown = 0;
    for (const i of ings) {
      const f = (Number(i.grams) || 0) / 100;
      const v = num(i.per100 && i.per100[k]);
      if (v === null) unknown++;
      else { sum += v * f; known++; if ((i.incomplete || []).includes(k)) unknown++; }
    }
    per100[k] = known && total > 0 ? sum / total * 100 : null;
    if (known && unknown) incomplete.push(k);
  }
  return { per100, incomplete, total, sumG };
}

/* ---- Einkaufsliste ---- */
function shoppingList(daysMap, dates, fromDate) {
  const m = new Map();
  const add = (key, name, grams) => {
    if (!(grams > 0)) return;
    const e = m.get(key) || { key, name, grams: 0 };
    e.grams += grams; m.set(key, e);
  };
  for (const d of dates) {
    if (fromDate && d < fromDate) continue;
    const items = (daysMap[d] && daysMap[d].items) || [];
    for (const it of items) {
      if (it.kind === 'supp') continue;
      const g = Number(it.grams) || 0;
      if (g <= 0) continue;
      if (Array.isArray(it.ingredients) && it.ingredients.length && it.recipeTotal > 0) {
        const s = g / it.recipeTotal;
        for (const ing of it.ingredients) add(foodKey(ing), ing.name, (Number(ing.grams) || 0) * s);
      } else add(foodKey(it), it.name, g);
    }
  }
  return [...m.values()].sort((a, b) => a.name.localeCompare(b.name, 'de'));
}

function seriesFor(metric, dates, days) {
  return dates.map(date => {
    const d = days[date]; let v = null;
    if (d) {

      else if (metric === 'weight') v = d.weight;
      else if (d.items.length) { const t = sumItems(d.items); v = t[metric] ? t[metric].sum : null; }
    }
    return { date, value: v };
  });
}
function niceMax(v) {
  if (!(v > 0)) return 1;
  const p = Math.pow(10, Math.floor(Math.log10(v)));
  const f = v / p;
  const n = f <= 1 ? 1 : f <= 2 ? 2 : f <= 2.5 ? 2.5 : f <= 5 ? 5 : 10;
  return n * p;
}

/* Kalorienbedarf nach Mifflin-St Jeor mal Alltagsaktivität, plus Ziel, plus eingetragener Sport des Tages */
function kcalTarget(p, sportKcal = 0) {
  const w = Number(p && p.weight), h = Number(p && p.height), a = Number(p && p.age);
  if (!(w > 0 && h > 0 && a > 0)) return null;
  const bmr = 10 * w + 6.25 * h - 5 * a + (p.sex === 'w' ? -161 : 5);
  const act = ACTIVITY.some(x => x.v === Number(p.activity)) ? Number(p.activity) : 1.3;
  const g = GOALS.find(x => x.id === p.goal) || GOALS[1];
  return Math.round((bmr * act + g.delta) / 10) * 10 + Math.round(Math.max(0, Number(sportKcal) || 0));
}

/* ALA-Richtwert: 0,5 % der Tagesenergie (D-A-CH/EFSA). Ohne Kalorienziel: 2.500 kcal (Mann) bzw. 2.000 kcal (Frau) */
function addOmegaTarget(out, p) {
  const kcal = kcalTarget(p) || (p && p.sex === 'w' ? 2000 : 2500);
  if (out.ala) out.ala = { value: Math.round(kcal * 0.005 / 9 * 10) / 10, type: 'min' };
  return out;
}

/* Obergrenze gesättigte Fette: 5 % der Tagesenergie (1 g Fett = 9 kcal). Ohne Kalorienziel: 2.500 kcal (Mann) bzw. 2.000 kcal (Frau) */
function addSatfatTarget(out, p) {
  const kcal = kcalTarget(p) || (p && p.sex === 'w' ? 2000 : 2500);
  out.satfat = { value: Math.round(kcal * SATFAT_SHARE / 9 * 10) / 10, type: 'max' };
  return out;
}
/* Ungesättigtes Fett = Gesamtfett minus gesättigtes Fett (Transfette stecken darin, meist sehr wenig) */
function unsatFat(tot) { return Math.max(0, tot.fat.sum - tot.satfat.sum); }

/* Nährstoff-Score 0 bis 100: Durchschnitt der Abdeckung aller Vitamine und Mineralstoffe, jede höchstens 100 % */
function nutrientScore(tot, targets) {
  const keys = MICRO_KEYS.filter(k => targets[k] && targets[k].type !== 'max');
  if (!keys.length) return { score: 0, covered: 0, total: 0 };
  let s = 0, covered = 0;
  for (const k of keys) {
    const pct = (tot[k] ? tot[k].sum : 0) / targets[k].value;
    s += Math.min(pct, 1); if (pct >= 1) covered++;
  }
  return { score: Math.round(s / keys.length * 100), covered, total: keys.length };
}

const GAP_KEYS = ['protein', 'fiber', 'ala', 'epadha', ...MICRO_KEYS];
/* Hat überhaupt ein Eintrag eine Angabe zu diesem Nährstoff? Sonst ist er unbekannt, nicht "zu niedrig". */
const hasData = (items, k) => items.some(it => num(valuesOf(it)[k]) !== null);
function findGaps(tot, targets, n = 3, items = null) {
  const cand = GAP_KEYS.filter(k => targets[k] && targets[k].type !== 'max');
  const noData = items ? cand.filter(k => !hasData(items, k)) : [];
  const low = cand.filter(k => !noData.includes(k))
    .map(k => ({ key: k, pct: tot[k].sum / targets[k].value, approx: tot[k].missing > 0 }))
    .filter(x => x.pct < 1).sort((a, b) => a.pct - b.pct || a.key.localeCompare(b.key)).slice(0, n);
  const over = Object.keys(targets).filter(k => targets[k].type === 'max' && tot[k] && tot[k].sum > targets[k].value)
    .map(k => ({ key: k, pct: tot[k].sum / targets[k].value }));
  return { low, over, noData };
}

/* Alle Lebensmittel, die du schon gegessen oder gespeichert hast, mit den Mengen, die du davon üblicherweise isst */
function foodPool(daysMap, lib) {
  const pool = new Map();
  const add = (food, qty) => {
    if (!food || !food.name) return;
    const k = foodKey(food);
    const e = pool.get(k) || { food, qtys: [] };
    if (qty > 0) e.qtys.push(qty);
    pool.set(k, e);
  };
  for (const d of Object.values(daysMap || {})) for (const it of (d && d.items) || []) add(toFoodRef(it), it.kind === 'supp' ? it.qty : it.grams);
  for (const f of [...((lib && lib.custom) || []), ...((lib && lib.favorites) || []), ...((lib && lib.recent) || []), ...((lib && lib.supplements) || [])]) add(f, 0);
  return [...pool.values()];
}
const median = a => {
  if (!a.length) return null;
  const s = [...a].sort((x, y) => x - y), m = Math.floor(s.length / 2);
  return s.length % 2 ? s[m] : (s[m - 1] + s[m]) / 2;
};
function suggestFor(key, pool, target, n = 2) {
  const out = [];
  for (const { food, qtys } of pool) {
    const supp = food.source === 'supp';
    const v = num((supp ? food.perUnit : food.per100 || {})[key]);
    if (!(v > 0)) continue;
    const qty = supp ? (median(qtys) || 1) : Math.max(1, Math.round(median(qtys) || food.portion || 100));
    const amount = supp ? v * qty : v * qty / 100;
    out.push({ food, qty, amount, pct: target ? amount / target.value : null, supp });
  }
  return out.sort((a, b) => b.amount - a.amount || a.food.name.localeCompare(b.food.name)).slice(0, n);
}

/* Wochen-Check: Tage mit Einträgen dieser Woche, verglichen mit der Vorwoche */
function weekStats(days, targets) {
  const logged = days.filter(d => d && d.items && d.items.length);
  const tots = logged.map(d => sumItems(d.items));
  const n = tots.length;
  const avg = k => n ? tots.reduce((a, t) => a + t[k].sum, 0) / n : null;
  const scores = tots.map(t => nutrientScore(t, targets).score);
  const foods = logged.flatMap(d => d.items.filter(i => i.kind !== 'supp'));
  return {
    n, tots, items: logged.flatMap(d => d.items), kcal: avg('kcal'), protein: avg('protein'),
    score: n ? Math.round(scores.reduce((a, b) => a + b, 0) / n) : null,
    nova4: foods.length ? foods.filter(i => i.nova === 4).length / foods.length : null
  };
}
function weekCheck(daysThis, daysPrev, targets) {
  const a = weekStats(daysThis, targets), b = weekStats(daysPrev, targets);
  const rows = GAP_KEYS.filter(k => targets[k] && targets[k].type !== 'max').map(k => {
    const pcts = a.tots.map(t => t[k].sum / targets[k].value);
    return {
      key: k, below: pcts.filter(p => p < 1).length, veryLow: pcts.filter(p => p < 0.5).length,
      avgPct: pcts.length ? pcts.reduce((x, y) => x + y, 0) / pcts.length : 0,
      approx: a.tots.some(t => t[k].missing > 0), known: hasData(a.items, k)
    };
  });
  const often = rows.filter(r => a.n && r.known && r.below >= Math.ceil(a.n / 2)).sort((x, y) => x.avgPct - y.avgPct);
  const good = rows.filter(r => a.n && r.known && r.below === 0);
  const noData = rows.filter(r => a.n && !r.known).map(r => r.key);
  const over = Object.keys(targets).filter(k => targets[k].type === 'max')
    .map(k => ({ key: k, days: a.tots.filter(t => t[k].sum > targets[k].value).length })).filter(x => x.days > 0);
  return { days: a.n, prevDays: b.n, score: a.score, prevScore: b.score, kcal: a.kcal, prevKcal: b.kcal,
    protein: a.protein, prevProtein: b.protein, nova4: a.nova4, prevNova4: b.nova4, often, good, over, rows, noData };
}

const emptyGym = () => ({ plans: [], custom: [], hist: {}, goal: 'hyp' });
const goalId = g => GYM_GOALS.some(x => x.id === g) ? g : 'hyp';
function normGym(raw) {
  const g = emptyGym();
  if (!raw || typeof raw !== 'object') return g;
  g.goal = goalId(raw.goal);
  g.plans = toArr(raw.plans).filter(p => p && p.id).map(p => ({
    id: String(p.id), name: String(p.name || 'Plan'), goal: goalId(p.goal || g.goal),
    items: toArr(p.items).filter(i => i && i.exId).map(i => ({
      exId: String(i.exId), sets: Math.max(1, Math.min(10, Math.round(Number(i.sets) || 3))), rMin: num(i.rMin), rMax: num(i.rMax), rest: num(i.rest)
    }))
  }));
  g.custom = toArr(raw.custom).filter(x => x && x.id && x.name).map(x => ({
    id: String(x.id), name: String(x.name), eq: EQUIP[x.eq] ? x.eq : 'sonst',
    type: ['kraft', 'zeit', 'cardio'].includes(x.type) ? x.type : 'kraft',
    primary: toArr(x.primary).map(String), secondary: toArr(x.secondary).map(String), cue: String(x.cue || ''), met: num(x.met), custom: true
  }));
  if (raw.hist && typeof raw.hist === 'object') for (const [k, v] of Object.entries(raw.hist)) {
    const list = toArr(v).filter(e => e && e.d).map(e => ({
      d: String(e.d), wid: String(e.wid || ''),
      s: toArr(e.s).map(p => toArr(p).map(Number)).filter(p => p.length === 2 && p.every(Number.isFinite))
    })).filter(e => e.s.length);
    if (list.length) g.hist[k] = list;
  }
  return g;
}
function normWorkout(w) {
  if (!w || typeof w !== 'object' || !w.id) return null;
  return {
    id: String(w.id), name: String(w.name || 'Training'), planId: w.planId ? String(w.planId) : '',
    startTs: Number(w.startTs) || 0, endTs: Number(w.endTs) || 0, active: !!w.active,
    kcal: num(w.kcal), reopenEnd: num(w.reopenEnd), backup: typeof w.backup === 'string' && w.backup ? w.backup : null,
    exercises: toArr(w.exercises).filter(e => e && e.exId).map(e => ({
      uid: e.uid || uid(), exId: String(e.exId), rest: num(e.rest), rMin: num(e.rMin), rMax: num(e.rMax),
      sets: toArr(e.sets).filter(Boolean).map(s => ({ a: num(s.a), b: num(s.b), done: !!s.done }))
    }))
  };
}
function exerciseMap(gym) {
  const m = {};
  for (const e of EXERCISES) m[e.id] = e;
  for (const e of (gym && gym.custom) || []) m[e.id] = e;
  return m;
}
/* Geschätztes Maximalgewicht für eine Wiederholung (Epley-Formel) */
const e1rm = (w, r) => !(w > 0) || !(r > 0) ? 0 : r === 1 ? w : w * (1 + r / 30);
const doneSets = e => e.sets.filter(s => s.done);
const workoutMinutes = w => !w.startTs ? 0 : Math.max(0, Math.round(((w.endTs || Date.now()) - w.startTs) / 60000));
function workoutStats(w, exMap) {
  let sets = 0, volume = 0, exercises = 0;
  for (const e of w.exercises) {
    const d = exMap[e.exId] || { type: 'kraft' }, ds = doneSets(e);
    if (ds.length) exercises++;
    sets += ds.length;
    if (d.type === 'kraft') for (const s of ds) volume += (Number(s.a) || 0) * (Number(s.b) || 0);
  }
  return { sets, volume, exercises, minutes: workoutMinutes(w) };
}
/* Kalorien: MET × Gewicht × Stunden, netto (ohne Grundumsatz, der steckt schon im Tagesziel) */
function workoutKcal(w, kg, exMap) {
  const dur = workoutMinutes(w);
  let cardioMin = 0, kc = 0;
  for (const e of w.exercises) {
    const d = exMap[e.exId];
    if (!d || d.type !== 'cardio') continue;
    for (const s of doneSets(e)) { const m = Number(s.a) || 0; cardioMin += m; kc += Math.max(0, (d.met || 6) - 1) * kg * m / 60; }
  }
  kc += (STRENGTH_MET - 1) * kg * Math.max(0, dur - cardioMin) / 60;
  return Math.round(kc);
}
/* Sätze pro Muskel: Hauptmuskel ein Satz, mitarbeitende Muskeln ein halber */
function muscleSets(workouts, exMap) {
  const out = {};
  for (const [k] of MUSCLES) out[k] = 0;
  for (const w of workouts) for (const e of w.exercises) {
    const d = exMap[e.exId];
    if (!d || d.type === 'cardio') continue;
    const n = doneSets(e).length;
    if (!n) continue;
    for (const m of d.primary || []) if (m in out) out[m] += n;
    for (const m of d.secondary || []) if (m in out) out[m] += n / 2;
  }
  return out;
}
function histWithout(hist, wid) {
  const h = {};
  for (const [k, list] of Object.entries(hist || {})) { const l = list.filter(x => x.wid !== wid); if (l.length) h[k] = l; }
  return h;
}
/* Verlauf pro Übung: erledigte Sätze eines abgeschlossenen Trainings, höchstens 100 Einträge pro Übung */
function histWith(hist, w, date, exMap) {
  const h = histWithout(hist, w.id);
  for (const e of w.exercises) {
    const d = exMap[e.exId];
    if (!d || d.type === 'cardio') continue;
    const s = doneSets(e).filter(x => Number(x.b) > 0).map(x => [Number(x.a) || 0, Number(x.b)]);
    if (!s.length) continue;
    const l = (h[e.exId] || []).concat({ d: date, wid: w.id, s });
    l.sort((a, b) => a.d.localeCompare(b.d));
    h[e.exId] = l.slice(-100);
  }
  return h;
}
function histBest(list) {
  let b = { e1rm: 0, w: 0, r: 0, d: '' };
  for (const x of list || []) for (const [w, r] of x.s) { const v = e1rm(w, r); if (v > b.e1rm) b = { e1rm: v, w, r, d: x.d }; }
  return b;
}
function planItem(exId, goal, exMap) {

const REMOTE_TIMEOUT = 6000;

const cache = {
  key: p => `np:c:${S.uid}:${p}`,
  get(p) { try { const v = localStorage.getItem(this.key(p)); return v === null ? undefined : JSON.parse(v); } catch { return undefined; } },
  set(p, v) {
    const txt = JSON.stringify(v ?? null);
    try { localStorage.setItem(this.key(p), txt); return true; }
    catch (e) { console.error(e); pruneCache(14); try { localStorage.setItem(this.key(p), txt); return true; } catch { return false; } }
  },
  pending() { return (S.uid && this.get('pending')) || {}; },
  mark(p) { const m = this.pending(); m[p] = (m[p] || 0) + 1; this.set('pending', m); updateSync(); return m[p]; },
  unmark(p, seq) { const m = this.pending(); if (m[p] === seq) { delete m[p]; this.set('pending', m); } updateSync(); }
};
function pruneCache(days = CACHE_DAYS) {
  if (!S.uid) return;
  const pre = `np:c:${S.uid}:day:`, limit = shiftDate(todayStr(), -days), pend = cache.pending(), del = [];
  for (let i = 0; i < localStorage.length; i++) {
    const k = localStorage.key(i);
    if (k && k.startsWith(pre) && k.slice(pre.length) < limit && !pend['day:' + k.slice(pre.length)]) del.push(k);

}

/* Speichern in Reihenfolge pro Dokument, damit ein später gestarteter Speichervorgang nie von einem früheren überholt wird */
const saveChains = {};
function queueSave(id, fn) {
  saveChains[id] = (saveChains[id] || Promise.resolve()).catch(() => { }).then(fn);

}
/* Erst sofort auf dem Gerät sichern, dann an Firebase schicken. Es wird nicht auf den Server gewartet,
   damit die App auch offline flüssig bleibt. Offline schickt Firebase die Änderung, sobald wieder Netz da ist. */
function persistDoc(path, data, remote, errMsg) {
  let seq = null;
  if (S.mode === 'firebase') { cache.set(path, data); seq = cache.mark(path); }
  queueSave(path, remote)
    .then(() => { if (seq !== null) cache.unmark(path, seq); })
    .catch(e => { console.error(e); toast(errMsg); });
  return Promise.resolve();
}

/* Nach dem Start und wenn die Verbindung zurück ist: alles, was noch wartet, an Firebase schicken */
function flushPending() {
  if (S.mode !== 'firebase' || !S.uid) return;
  for (const [path, seq] of Object.entries(cache.pending())) {
    const data = cache.get(path);
    const remote = data === undefined ? null
      : path === 'library' ? () => store.saveLibrary(data)
      : path === 'profile' ? () => store.saveProfile(data)
      : path === 'gym' ? () => store.saveGym(data)
      : path.startsWith('day:') ? () => store.saveDay(path.slice(4), data) : null;
    if (!remote) { cache.unmark(path, seq); continue; }
    queueSave(path, remote).then(() => cache.unmark(path, seq)).catch(e => console.error(e));
  }
}

const SYNC = { connected: true, seen: false, timer: null };
function watchConnection() {
  SYNC.connected = navigator.onLine !== false;
  fb.dbM.onValue(fb.dbM.ref(fb.db, '.info/connected'), snap => {
    if (snap.val() === true) {
      const back = SYNC.seen;
      SYNC.connected = true; SYNC.seen = true;
      if (S.uid) { flushPending(); if (back || S.staleLoad) refreshFromServer(); }
    } else if (SYNC.seen || navigator.onLine === false) SYNC.connected = false;
    updateSync();
  });
  setTimeout(() => { if (!SYNC.seen) { SYNC.connected = false; updateSync(); } }, 5000);
  window.addEventListener('offline', () => { SYNC.connected = false; updateSync(); });
}
function updateSync() {
  clearTimeout(SYNC.timer);

  if (SYNC.connected && !n) renderSync(); else SYNC.timer = setTimeout(renderSync, 1500);
