<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Nährstoff-Planer</title>
<meta name="description" content="Essen eintragen und sehen, welche Vitamine und Nährstoffe dir fehlen.">
<meta name="theme-color" content="#0C131B" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#F2F4EF" media="(prefers-color-scheme: light)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Nährstoffe">
<link rel="apple-touch-icon" href="icon.png">
<link rel="icon" type="image/png" href="icon.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F2F4EF; --surface:#FFFFFF; --surface2:#EBEFE7; --line:#DCE2D7; --text:#13202B; --muted:#56646F; --faint:#7F8B95;
  --energy:#E8590C; --protein:#0E8F82; --micro:#5A970B;
  --primary:#13202B; --on-primary:#FFFFFF; --danger:#C93A32; --warnbg:#FDECEA; --okbg:#EDF5E1; --focus:#2563EB;
  --heat0:#E3E8DE; --heat1:#D3E6B4; --heat2:#ADD474; --heat3:#80BA35; --heat4:#5A970B;
  --nova1:#2F8F4E; --nova2:#7DAA3B; --nova3:#D59A16; --nova4:#C93A32;
  --sheet-shadow:0 -8px 40px rgba(19,32,43,.18);
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0C131B; --surface:#141E29; --surface2:#1C2835; --line:#263546; --text:#EAF1F7; --muted:#97A7B8; --faint:#6A7C8F;
    --energy:#FF7A45; --protein:#2BD4C0; --micro:#A6E33D;
    --primary:#A6E33D; --on-primary:#0C131B; --danger:#FF6B61; --warnbg:#3A1F22; --okbg:#1F2E17;
    --heat0:#1D2936; --heat1:#2D4220; --heat2:#4A6E24; --heat3:#77A82E; --heat4:#A6E33D;
    --nova1:#4CC27A; --nova2:#9BCB57; --nova3:#F0B53A; --nova4:#FF6B61;
    --sheet-shadow:0 -8px 40px rgba(0,0,0,.55);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0C131B; --surface:#141E29; --surface2:#1C2835; --line:#263546; --text:#EAF1F7; --muted:#97A7B8; --faint:#6A7C8F;
  --energy:#FF7A45; --protein:#2BD4C0; --micro:#A6E33D;
  --primary:#A6E33D; --on-primary:#0C131B; --danger:#FF6B61; --warnbg:#3A1F22; --okbg:#1F2E17;
  --heat0:#1D2936; --heat1:#2D4220; --heat2:#4A6E24; --heat3:#77A82E; --heat4:#A6E33D;
  --nova1:#4CC27A; --nova2:#9BCB57; --nova3:#F0B53A; --nova4:#FF6B61;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--text);font-family:'Archivo',system-ui,-apple-system,'Segoe UI',sans-serif;font-size:16px;line-height:1.45;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
button:disabled{cursor:not-allowed;opacity:.45}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
h1,h2,h3,p{margin:0}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.muted{color:var(--muted)}
abbr{text-decoration:none;cursor:help}
.num,.big{font-stretch:118%;font-weight:800;letter-spacing:-.01em}
svg{display:block}

/* Rahmen: Seitenleiste am PC, Tab-Leiste am Handy */
.side{display:none}
.main{max-width:1180px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 14px) 16px calc(104px + env(safe-area-inset-bottom))}
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:5;display:grid;grid-template-columns:repeat(5,1fr);align-items:end;
  background:color-mix(in srgb,var(--surface) 86%,transparent);-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);
  border-top:1px solid var(--line);padding:6px 4px calc(6px + env(safe-area-inset-bottom))}
.tab{display:grid;justify-items:center;gap:2px;background:none;border:0;color:var(--faint);font-size:.7rem;font-weight:600;padding:4px 0;min-height:48px}
.tab svg{width:24px;height:24px}
.tab[aria-current="page"]{color:var(--text)}
.fab{justify-self:center;width:58px;height:58px;border-radius:50%;border:0;background:var(--primary);color:var(--on-primary);display:grid;place-items:center;
  margin-top:-24px;box-shadow:0 8px 22px rgba(0,0,0,.28)}
.fab svg{width:26px;height:26px}
@media(min-width:900px){
  .tabbar{display:none}
  .shell{display:grid;grid-template-columns:236px minmax(0,1fr)}
  .side{display:flex;flex-direction:column;gap:4px;position:sticky;top:0;height:100vh;padding:26px 16px;border-right:1px solid var(--line)}
  .main{padding:26px 32px 56px;margin:0;max-width:1240px}
}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;font-stretch:115%;font-size:1.1rem;margin:0 8px 22px}
.brand svg{width:30px;height:30px}
.navbtn{display:flex;align-items:center;gap:12px;background:none;border:0;border-radius:12px;padding:10px 12px;color:var(--muted);font-weight:600;text-align:left}
.navbtn svg{width:22px;height:22px}
.navbtn:hover{background:var(--surface2);color:var(--text)}
.navbtn[aria-current="page"]{background:var(--surface);color:var(--text)}
.side .btn.primary{margin-top:16px;justify-content:center}
.side-foot{margin-top:auto;font-size:.8rem;color:var(--faint);padding:0 8px}

/* Grundbausteine */
.btn{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:12px;background:var(--surface2);color:var(--text);padding:10px 16px;font-weight:650;min-height:44px}
.btn:hover{border-color:var(--faint)}
.btn.primary{background:var(--primary);color:var(--on-primary);border-color:transparent}
.btn.primary:hover{filter:brightness(1.08)}
.btn.danger{background:transparent;color:var(--danger)}
.btn.small{min-height:36px;padding:6px 12px;font-size:.92rem}
.btn svg{width:18px;height:18px}
.icon-btn{width:42px;height:42px;flex:none;border-radius:13px;border:1px solid var(--line);background:var(--surface);color:var(--text);display:grid;place-items:center;padding:0}
.icon-btn svg{width:20px;height:20px}
.icon-btn.sm{width:36px;height:36px;border-radius:11px;background:transparent}
.icon-btn.accent{background:var(--primary);color:var(--on-primary);border-color:transparent}
.link{background:none;border:0;padding:0;color:inherit;text-decoration:underline;text-underline-offset:3px;font-weight:600}
.x{background:none;border:0;color:var(--muted);padding:8px;border-radius:10px;display:grid;place-items:center}
.x svg{width:18px;height:18px}
.x:hover{color:var(--danger);background:var(--surface2)}
.card{background:var(--surface);border-radius:22px;padding:18px}
.card h2{font-size:1.08rem;font-weight:750;font-stretch:108%}
.chead{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px}
.foot{color:var(--faint);font-size:.8rem;margin-top:14px;line-height:1.4}
.seg{display:inline-flex;background:var(--surface2);border-radius:12px;padding:3px;gap:2px}
.seg button{background:none;border:0;border-radius:9px;padding:6px 12px;font-weight:650;color:var(--muted);font-size:.9rem}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--text);box-shadow:0 1px 3px rgba(0,0,0,.15)}
.note{background:var(--warnbg);border-radius:14px;padding:10px 14px;margin-bottom:14px;font-size:.9rem}
.bar{position:relative;height:8px;border-radius:4px;background:var(--surface2);margin-top:6px}
.bar i{position:absolute;left:0;top:0;bottom:0;border-radius:4px;background:var(--micro)}
.bar i.over{background:var(--danger)}
.bar .tick{position:absolute;left:66.667%;top:-3px;bottom:-3px;width:2px;border-radius:1px;background:var(--text);opacity:.55}
.empty{color:var(--muted)}
.done{display:flex;gap:10px;align-items:center;background:var(--okbg);border-radius:14px;padding:12px 14px;margin-top:6px}
.done svg{width:20px;height:20px;flex:none;color:var(--micro)}
.warn{display:flex;gap:10px;align-items:flex-start;background:var(--warnbg);border-radius:14px;padding:10px 14px;margin-top:10px;font-size:.94rem}
.warn svg{width:20px;height:20px;flex:none;color:var(--danger);margin-top:1px}
.nova{display:inline-block;border-radius:6px;padding:1px 6px;font-size:.72rem;font-weight:700;color:#fff;white-space:nowrap}
.nova.n1{background:var(--nova1)} .nova.n2{background:var(--nova2)} .nova.n3{background:var(--nova3);color:#1B1B1B} .nova.n4{background:var(--nova4)}
.chip{display:inline-block;border-radius:8px;padding:2px 8px;font-size:.78rem;font-weight:650;background:var(--surface2);color:var(--text)}
.chips{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px}
.badge{display:inline-flex;align-items:center;gap:5px;border-radius:7px;padding:2px 8px 2px 6px;font-size:.74rem;font-weight:700;margin-bottom:4px;line-height:1.35}
.badge svg{width:14px;height:14px;flex:none}
.badge.lab{background:color-mix(in srgb,var(--micro) 26%,transparent);color:var(--text)}
.badge.lab svg{color:var(--micro)}
.badge.user{background:color-mix(in srgb,var(--nova3) 24%,transparent);color:var(--text)}
.badge.user svg{color:var(--nova3)}
.badge.own{background:color-mix(in srgb,var(--protein) 22%,transparent);color:var(--text)}
.badge.own svg{color:var(--protein)}
.res .iname .badge,.pending .pname .badge{display:flex;width:fit-content}
.chip.src{background:transparent;border:1px solid var(--line);color:var(--muted)}
.chip.src.fresh{border-color:color-mix(in srgb,var(--micro) 55%,var(--line));color:var(--text)}
.chip.src.mine{background:var(--primary);color:var(--on-primary);border-color:transparent}
.ns{display:inline-block;border-radius:6px;padding:1px 6px;font-size:.72rem;font-weight:700}
.ns-a{background:#1F8A4C;color:#fff}.ns-b{background:#6AA83A;color:#fff}.ns-c{background:#E8B91C;color:#1b1b1b}.ns-d{background:#E8872C;color:#1b1b1b}.ns-e{background:#D23F31;color:#fff}

/* Heute */
.dayhead{display:flex;align-items:center;gap:10px;margin:2px 0 12px}
.dayttl{flex:1;min-width:0;background:none;border:0;text-align:left;padding:0;color:inherit}
.dayttl .t{display:block;font-size:2.1rem;line-height:1;font-weight:850;font-stretch:122%;letter-spacing:-.02em}
.dayttl .s{display:block;color:var(--muted);margin-top:4px}
.strip{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-bottom:14px}
.tile{background:none;border:0;border-radius:16px;padding:6px 0 7px;display:grid;justify-items:center;gap:2px;color:var(--muted)}
.tile .wd{font-size:.72rem;font-weight:650}
.tile svg{width:38px;height:38px}
.tile .mt{fill:none;stroke:var(--surface2);stroke-width:3.4}
.tile .mf{fill:none;stroke:var(--micro);stroke-width:3.4;stroke-linecap:round}
.tile text{fill:var(--text);font-size:12.5px;font-weight:750;font-family:inherit}
.tile.sel{background:var(--surface)}
.tile.today .wd{color:var(--text);text-decoration:underline;text-underline-offset:3px}
.cols{display:grid;gap:14px;grid-template-columns:minmax(0,1fr)}
.col{display:grid;gap:14px;align-content:start;min-width:0;grid-template-columns:minmax(0,1fr)}
.card,.kpi{min-width:0}
.stack{grid-template-columns:minmax(0,1fr)}
@media(min-width:1100px){.cols{grid-template-columns:minmax(0,1.05fr) minmax(0,.95fr)}}

.hero{display:grid;grid-template-columns:auto minmax(0,1fr);gap:18px;align-items:center;padding:18px 18px 16px}
.rings{width:132px;height:132px}
@media(min-width:420px){.rings{width:156px;height:156px}}
.rt{fill:none;opacity:.17}
.rf{fill:none;stroke-linecap:round;transition:stroke-dashoffset .5s cubic-bezier(.2,.7,.2,1)}
.rt.e,.rf.e{stroke:var(--energy)} .rt.p,.rf.p{stroke:var(--protein)} .rt.m,.rf.m{stroke:var(--micro)}
.rings.intro .rf{animation:ringIn 1.1s cubic-bezier(.2,.7,.2,1) both}
.rings.intro .rf.p{animation-delay:.08s} .rings.intro .rf.m{animation-delay:.16s}
@keyframes ringIn{from{stroke-dashoffset:var(--len)}}
.hstats{display:grid;gap:10px;min-width:0}
.hstat{display:grid;grid-template-columns:12px minmax(0,1fr);column-gap:10px}
.hstat .key{width:12px;height:12px;border-radius:50%;margin-top:.3em}
.key.e{background:var(--energy)} .key.p{background:var(--protein)} .key.m{background:var(--micro)}
.hstat .lbl{font-size:.8rem;color:var(--muted);font-weight:600;display:block}
.hstat .val{line-height:1.15}
.hstat .val b{font-size:1.5rem;font-weight:850;font-stretch:118%}
.hstat .val span{color:var(--muted);font-weight:550}
.hstat small{display:block;color:var(--muted);font-size:.82rem;line-height:1.3}
@media(max-width:380px){.hstat .val b{font-size:1.3rem}.rings{width:118px;height:118px}}

.gaps h2{margin-bottom:6px}
.gaplist{list-style:none;margin:0;padding:0}
.gaplist li{padding:12px 0;border-top:1px solid var(--line)}
.gaplist li:first-child{border-top:0;padding-top:4px}
.gtop{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.gname{font-weight:700;font-size:1.02rem}
.gval{font-weight:800;font-stretch:115%}
.grest{color:var(--muted);font-size:.85rem;margin-top:6px}
.sugg{display:flex;gap:8px;align-items:flex-start;margin-top:8px;font-size:.92rem;background:var(--surface2);border-radius:12px;padding:8px 10px}
.sugg svg{width:16px;height:16px;flex:none;margin-top:3px;color:var(--micro)}
.empty-card{display:grid;gap:10px;justify-items:start;padding:22px}
.empty-card h2{font-size:1.3rem;font-stretch:112%}
.empty-card p{color:var(--muted);max-width:52ch}

.meals{padding:6px 18px 10px}
.meal{padding:10px 0;border-top:1px solid var(--line)}
.meal:first-of-type{border-top:0}
.mhead{display:flex;align-items:center;gap:6px}
.mhead h3{font-size:1rem;font-weight:750;flex:1}
.mk{color:var(--muted);font-weight:650;font-size:.92rem;margin-right:4px;white-space:nowrap}
.rows{list-style:none;margin:4px 0 0;padding:0}
.row{width:100%;display:flex;align-items:center;gap:10px;background:none;border:0;border-radius:12px;padding:8px 6px;margin:0 -6px;text-align:left;color:inherit;width:calc(100% + 12px)}
.row:hover{background:var(--surface2)}
.thumb{position:relative;flex:none;width:40px;height:40px;border-radius:11px;background:var(--surface2);overflow:hidden;display:grid;place-items:center}
.thumb::before{content:attr(data-l);font-weight:800;font-stretch:115%;color:var(--muted);font-size:1rem}
.thumb.fresh{background:color-mix(in srgb,var(--micro) 22%,var(--surface2))}
.thumb.fresh::before{color:var(--text)}
.thumb.supp{background:color-mix(in srgb,var(--protein) 22%,var(--surface2))}
.thumb img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:#fff}
.thumb.lg{width:56px;height:56px;border-radius:14px}
.thumb.md{width:48px;height:48px;border-radius:13px}
.res{cursor:pointer}
.res:hover{background:var(--surface2);margin:0 -10px;padding:10px;border-radius:12px;border-top-color:transparent}
.thumb.lg::before{font-size:1.3rem}
.photo{display:grid;place-items:center;background:#fff;border-radius:16px;margin:0 0 12px;padding:8px;max-height:160px;overflow:hidden}
.photo img{max-width:100%;max-height:144px;object-fit:contain}
.rname{flex:1;min-width:0}
.rn{display:block;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rname small{display:block;color:var(--muted);font-size:.82rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rk{font-weight:750;white-space:nowrap;text-align:right;min-width:4.5em}
.rk small{color:var(--muted);font-weight:500}

.water .whead{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.wval b{font-size:1.5rem;font-weight:850;font-stretch:118%}
.wval{color:var(--muted)}
.water .bar i{background:var(--protein)}
.wbtns{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.chipbtn{border:1px solid var(--line);background:var(--surface2);border-radius:999px;padding:8px 14px;font-weight:650;min-height:40px}
.chipbtn:hover{border-color:var(--faint)}

.nrow{display:grid;grid-template-columns:minmax(0,1fr) auto;column-gap:10px;padding:9px 0;border-top:1px solid var(--line)}
.nrow:first-of-type{border-top:0}
.nn{font-weight:550}
.nv{color:var(--muted);font-size:.9rem;white-space:nowrap;text-align:right}
.nv b{color:var(--text);font-size:1rem;font-weight:750}
.nv abbr{color:var(--faint);margin-right:2px}
.nrow .bar{grid-column:1/-1}
.ng{font-size:.82rem;font-weight:750;color:var(--muted);margin:18px 0 2px}
.ng:first-of-type{margin-top:4px}
.nova-bar{display:flex;height:12px;border-radius:6px;overflow:hidden;background:var(--surface2);margin:8px 0;gap:2px}
.nova-bar span{display:block;height:100%}
.legend{list-style:none;margin:6px 0 0;padding:0;display:grid;gap:4px;font-size:.88rem}
.legend li{display:flex;align-items:center;gap:8px}
.dot{width:11px;height:11px;border-radius:3px;flex:none}

.inline{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end;margin-top:10px}
.fld{display:grid;gap:4px;font-size:.85rem;font-weight:600;color:var(--muted);min-width:0}
.fld.grow{flex:1 1 150px}
.input,.fld input,.fld select,.field input,.field select,.field textarea{width:100%;font-size:16px;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:var(--surface2);color:var(--text);min-height:44px}
.withunit{position:relative;display:block}
.withunit input{padding-right:40px;width:9em}
.withunit em{position:absolute;right:12px;top:50%;transform:translateY(-50%);font-style:normal;color:var(--muted);pointer-events:none}
.sportl{list-style:none;margin:12px 0 0;padding:0}
.sportl li{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:6px 0;border-top:1px solid var(--line)}
.sportl small{display:block;color:var(--muted);font-size:.82rem}
.body h2{margin-bottom:2px}
.sportform{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px;align-items:end;margin-top:12px}
.sportform .fld.grow{grid-column:1/-1}
.sportform .fld input{width:100%}
.sportform .btn{grid-column:1/-1;justify-content:center}
@media(min-width:520px){.sportform{grid-template-columns:minmax(0,2fr) minmax(0,1fr) minmax(0,1fr) auto}.sportform .fld.grow{grid-column:auto}.sportform .btn{grid-column:auto}}

/* Woche */
.weekbar{display:flex;align-items:center;gap:10px;margin:2px 0 14px}
.weekbar .t{flex:1;min-width:0}
.weekbar .t b{display:block;font-size:2.1rem;line-height:1;font-weight:850;font-stretch:122%;letter-spacing:-.02em}
.weekbar .t span{display:block;color:var(--muted);margin-top:4px}
.kpis{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media(min-width:700px){.kpis{grid-template-columns:repeat(4,minmax(0,1fr))}}
.kpi{background:var(--surface);border-radius:20px;padding:14px 16px}
.kpi .l{font-size:.8rem;color:var(--muted);font-weight:600}
.kpi .v{font-size:1.9rem;font-weight:850;font-stretch:120%;line-height:1.15}
.kpi .v span{font-size:.95rem;color:var(--muted);font-weight:600;font-stretch:100%}
.kpi .d{font-size:.8rem;color:var(--muted)}
.often{list-style:none;margin:0;padding:0}
.often li{padding:12px 0;border-top:1px solid var(--line)}
.often li:first-child{border-top:0;padding-top:4px}
.goodchips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.heat{display:grid;grid-template-columns:minmax(92px,1.4fr) repeat(7,minmax(0,1fr));gap:3px;align-items:center;font-size:.8rem;margin-top:8px}
.heat .hd{text-align:center;color:var(--muted);font-weight:650;padding-bottom:2px}
.heat .rl{color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding-right:6px}

  else { const na = num(nu['sodium_100g']); per100.salt = na === null ? null : na * 2.5; }
  const name = String(p.product_name_de || p.product_name || '').trim();

const itemFactor = it => it.kind === 'supp' ? (Number(it.qty) || 0) : (Number(it.grams) || 0) / 100;
const valuesOf = it => it.kind === 'supp' ? (it.perUnit || {}) : (it.per100 || {});

function sumItems(items) {
  const tot = {};
  for (const k of ALL_KEYS) tot[k] = { sum: 0, missing: 0, n: 0 };
  for (const it of items) {
    const f = itemFactor(it), supp = it.kind === 'supp', vals = valuesOf(it), inc = it.incomplete || [];
    for (const k of ALL_KEYS) {
      const v = num(vals[k]);
      tot[k].n++;
      if (v === null) { if (!supp) tot[k].missing++; }          // Ergänzung: leer heißt "nicht enthalten"
      else { tot[k].sum += v * f; if (!supp && inc.includes(k)) tot[k].missing++; }
    }
  }
  return tot;
}

/* Durchschnitt pro Tag, gerechnet nur über Tage mit Einträgen */

  for (const k of ALL_KEYS) res[k] = { sum: 0, missing: 0, n: 0 };
  for (const day of withData) {
    const t = sumItems(day);
    for (const k of ALL_KEYS) { res[k].sum += t[k].sum; res[k].missing += t[k].missing; res[k].n += t[k].n; }
  }
  if (withData.length) for (const k of ALL_KEYS) res[k].sum /= withData.length;
  return { tot: res, days: withData.length };
}

    if ((per.protein || 0) + (per.fat || 0) + (per.carbs || 0) > 100.5) return 'Eiweiß, Fett und Kohlenhydrate zusammen können nicht über 100 g pro 100 g liegen.';
    if (per.kcal != null && per.kcal > 900) return 'Mehr als 900 kcal pro 100 g gibt es bei Lebensmitteln nicht. Prüfe die Eingabe.';

  const sumG = ings.reduce((a, i) => a + (Number(i.grams) || 0), 0);
  const total = Number(totalGrams) > 0 ? Number(totalGrams) : sumG;
  const per100 = {}, incomplete = [];
  for (const k of ALL_KEYS) {

    }

  }

}

/* ---- Einkaufsliste ---- */
function shoppingList(daysMap, dates, fromDate) {
  const m = new Map();
  const add = (key, name, grams) => {
    if (!(grams > 0)) return;
    const e = m.get(key) || { key, name, grams: 0 };
    e.grams += grams; m.set(key, e);
  };
  for (const d of dates) {
    if (fromDate && d < fromDate) continue;
    const items = (daysMap[d] && daysMap[d].items) || [];
    for (const it of items) {
      if (it.kind === 'supp') continue;
      const g = Number(it.grams) || 0;
      if (g <= 0) continue;
      if (Array.isArray(it.ingredients) && it.ingredients.length && it.recipeTotal > 0) {
        const s = g / it.recipeTotal;
        for (const ing of it.ingredients) add(foodKey(ing), ing.name, (Number(ing.grams) || 0) * s);
      } else add(foodKey(it), it.name, g);
    }
  }
  return [...m.values()].sort((a, b) => a.name.localeCompare(b.name, 'de'));
}

function niceMax(v) {

/* Kalorienbedarf nach Mifflin-St Jeor mal Alltagsaktivität, plus Ziel, plus eingetragener Sport des Tages */
function kcalTarget(p, sportKcal = 0) {
  const w = Number(p && p.weight), h = Number(p && p.height), a = Number(p && p.age);
  if (!(w > 0 && h > 0 && a > 0)) return null;
  const bmr = 10 * w + 6.25 * h - 5 * a + (p.sex === 'w' ? -161 : 5);
  const act = ACTIVITY.some(x => x.v === Number(p.activity)) ? Number(p.activity) : 1.3;
  const g = GOALS.find(x => x.id === p.goal) || GOALS[1];

/* Nährstoff-Score 0 bis 100: Durchschnitt der Abdeckung aller Vitamine und Mineralstoffe, jede höchstens 100 % */
function nutrientScore(tot, targets) {

  if (!keys.length) return { score: 0, covered: 0, total: 0 };
  let s = 0, covered = 0;
  for (const k of keys) {
    const pct = (tot[k] ? tot[k].sum : 0) / targets[k].value;
    s += Math.min(pct, 1); if (pct >= 1) covered++;

  const cand = GAP_KEYS.filter(k => targets[k] && targets[k].type !== 'max');
  const noData = items ? cand.filter(k => !hasData(items, k)) : [];

    .map(k => ({ key: k, pct: tot[k].sum / targets[k].value, approx: tot[k].missing > 0 }))
    .filter(x => x.pct < 1).sort((a, b) => a.pct - b.pct || a.key.localeCompare(b.key)).slice(0, n);
  const over = Object.keys(targets).filter(k => targets[k].type === 'max' && tot[k] && tot[k].sum > targets[k].value)

  for (const f of [...((lib && lib.custom) || []), ...((lib && lib.favorites) || []), ...((lib && lib.recent) || []), ...((lib && lib.supplements) || [])]) add(f, 0);

  const avg = k => n ? tots.reduce((a, t) => a + t[k].sum, 0) / n : null;
  const scores = tots.map(t => nutrientScore(t, targets).score);
  const foods = logged.flatMap(d => d.items.filter(i => i.kind !== 'supp'));
  return {
    n, tots, items: logged.flatMap(d => d.items), kcal: avg('kcal'), protein: avg('protein'),
    score: n ? Math.round(scores.reduce((a, b) => a + b, 0) / n) : null,
    nova4: foods.length ? foods.filter(i => i.nova === 4).length / foods.length : null
  };
}
function weekCheck(daysThis, daysPrev, targets) {
  const a = weekStats(daysThis, targets), b = weekStats(daysPrev, targets);
  const rows = GAP_KEYS.filter(k => targets[k] && targets[k].type !== 'max').map(k => {
    const pcts = a.tots.map(t => t[k].sum / targets[k].value);
    return {
      key: k, below: pcts.filter(p => p < 1).length, veryLow: pcts.filter(p => p < 0.5).length,
      avgPct: pcts.length ? pcts.reduce((x, y) => x + y, 0) / pcts.length : 0,
      approx: a.tots.some(t => t[k].missing > 0), known: hasData(a.items, k)
    };
  });
  const often = rows.filter(r => a.n && r.known && r.below >= Math.ceil(a.n / 2)).sort((x, y) => x.avgPct - y.avgPct);
  const good = rows.filter(r => a.n && r.known && r.below === 0);
  const noData = rows.filter(r => a.n && !r.known).map(r => r.key);
  const over = Object.keys(targets).filter(k => targets[k].type === 'max')
    .map(k => ({ key: k, days: a.tots.filter(t => t[k].sum > targets[k].value).length })).filter(x => x.days > 0);
  return { days: a.n, prevDays: b.n, score: a.score, prevScore: b.score, kcal: a.kcal, prevKcal: b.kcal,
    protein: a.protein, prevProtein: b.protein, nova4: a.nova4, prevNova4: b.nova4, often, good, over, rows, noData };
}

function germanName(desc) {
  const parts = String(desc || '').split(/,\s*/).map(s => s.trim()).filter(Boolean);
  const tr = parts.map(p => {
    const low = p.toLowerCase();
    if (EN_DE_PHRASES[low]) return EN_DE_PHRASES[low];
    let s = p;
    for (const [en, de] of Object.entries(EN_DE_PHRASES)) s = s.replace(new RegExp('\\b' + en.replace(/[-]/g, '\\-') + '\\b', 'i'), de);
    return s.split(/\s+/).map(w => EN_DE[w.toLowerCase()] ?? w).join(' ');
  });
  const out = tr.filter((x, i) => x && x !== tr[i - 1]).join(', ');
  return out ? out.charAt(0).toUpperCase() + out.slice(1) : String(desc || '');
}

/* ---- Suche nach Relevanz sortieren ---- */
const normTxt = s => String(s || '').toLowerCase().replace(/ß/g, 'ss').normalize('NFD').replace(/[̀-ͯ]/g, '');
const stemW = w => w.length > 3 ? w.replace(/(en|es|e|n|s)$/, '') : w;
const tokens = s => normTxt(s).split(/[^a-z0-9]+/).filter(Boolean).map(stemW);
/* Wörter, die auf verarbeitete Varianten hindeuten (auch in zusammengesetzten Wörtern wie "Bananenchips") */
const PROC_WORDS = ['chips', 'pulver', 'saft', 'getrocknet', 'kuchen', 'smoothie', 'riegel', 'sirup', 'nektar', 'shake', 'fruchtgummi', 'muesli', 'musli',
  'marmelade', 'konfiture', 'pudding', 'dried', 'dehydrated', 'powder', 'juice', 'canned', 'frozen', 'babyfood', 'baby food', 'candied',
  'sweetened', 'syrup', 'dessert', 'bread', 'cake', 'muffin', 'flour', 'snack', 'puree', 'jam', 'nectar', 'chocolate', 'schoko'];
function procPenalty(text, q) {
  const t = normTxt(text), qn = normTxt(q);
  return PROC_WORDS.some(w => t.includes(w) && !qn.includes(w)) ? 25 : 0;
}
function translateSmart(q) {
  const keys = Object.keys(DE_EN);
  return String(q).toLowerCase().split(/\s+/).filter(Boolean).map(w => {
    if (DE_EN[w]) return DE_EN[w];
    const k = keys.find(k => stemW(normTxt(k)) === stemW(normTxt(w)));
    return k ? DE_EN[k] : w;
  }).join(' ');
}
function searchScore(item, q, en) {
  const qs = tokens(q), es = tokens(en);
  if (!qs.length) return 0;
  if (item.source === 'usda') {
    const desc = item.nameEn || item.name;
    const parts = normTxt(desc).split(/,\s*/);
    const all = tokens(desc), first = tokens(parts[0]);
    let s = 0;
    const full = es.length && es.every(t => all.includes(t));
    if (full) s += 35;
    else if (es.some(t => all.includes(t))) s += 5;
    if (es.length && first.includes(es[0])) s += 15;
    if (full && /\braw\b/.test(normTxt(desc))) s += 12;
    s -= 3 * Math.max(0, parts.length - 2);
    return s - procPenalty(desc, en + ' ' + q);
  }
  const words = tokens(item.name);
  let s = 0;
  if (qs.every(t => words.includes(t))) {
    s += 30;
    if (words.length <= qs.length + 1) s += 25;
    if (words[0] === qs[0]) s += 5;
  } else if (qs.every(t => words.some(w => w.startsWith(t)))) {
    s += 28;                                   /* zusammengesetztes Wort, z. B. "Hähnchenbrustfilet" bei "Hähnchenbrust" */
    if (words.length <= qs.length + 1) s += 15;
  } else if (qs.every(t => normTxt(item.name).includes(t))) s += 8;
  s -= 3 * Math.max(0, words.length - qs.length - 1);
  if (item.nova === 1) s += 6;
  return s - procPenalty(item.name, q);
}
/* Eigene Treffer (schon gegessen, Favoriten, eigene Lebensmittel) zuerst, dann nach Punktzahl; bei Gleichstand bleibt die Reihenfolge der Quelle */
function rankSearch(apiItems, ownItems, q, en) {
  const qs = tokens(q), es = tokens(en);
  const own = ownItems.filter(f => f.source !== 'supp' && qs.length && (qs.every(t => normTxt(f.name + ' ' + (f.nameEn || '')).includes(t))
      || (f.nameEn && es.length && es.every(t => tokens(f.nameEn).includes(t)))))
    .map(f => ({ ...f, mine: true }));
  const ownKeys = new Set(own.map(foodKey));
  const seen = new Set();
  const scored = apiItems.filter(it => !ownKeys.has(foodKey(it)))
    .filter(it => { const k = foodKey(it); if (seen.has(k)) return false; seen.add(k); return true; })
    .map((it, i) => ({ it, s: searchScore(it, q, en) - i * 0.01 }))
    .sort((a, b) => b.s - a.s).map(x => x.it);
  const ownSorted = own.map((it, i) => ({ it, s: searchScore(it, q, en) - i * 0.01 })).sort((a, b) => b.s - a.s).map(x => x.it);
  return [...ownSorted, ...scored];
}

/* Gibt es zum Suchbegriff offizielle Laborwerte (USDA, alle Suchwörter passen)? Dann nur diese zeigen,
   Einträge von Nutzern (Open Food Facts) werden ausgeblendet. Eigene Lebensmittel und Rezepte bleiben. */
function labOnly(ranked, q, en) {
  const es = tokens(en);
  const hasLab = es.length > 0 && ranked.some(x => x.source === 'usda' && es.every(t => tokens(x.nameEn || x.name).includes(t)));
  if (!hasLab) return { list: ranked, hidden: [] };
  return { list: ranked.filter(x => x.source !== 'off'), hidden: ranked.filter(x => x.source === 'off') };
}

async function fetchJson(url, ms = 15000) {

}

/* Suche bei Open Food Facts über /cgi/search.pl (erlaubt Anfragen von fremden Webseiten).
   Der neue Suchdienst search.openfoodfacts.org sendet keine CORS-Freigabe und funktioniert deshalb im Browser nicht.
   Open Food Facts erlaubt höchstens 10 Suchen pro Minute; Ergebnisse werden deshalb gemerkt,
   und bei einem Aussetzer wird einmal nach kurzer Pause wiederholt. */
const APP_VERSION = '4.7';
const OFF_FIELDS_BASIC = 'code,product_name,product_name_de,brands,nutriments,nova_group,nutriscore_grade';
const offCache = new Map();
const sleep = ms => new Promise(r => setTimeout(r, ms));
async function fetchJsonRetry(url, ms) {
  try { return await fetchJson(url, ms); }
  catch (e) {
    const transient = !e.status || e.status >= 500 || e.status === 429;
    if (!transient || e.name === 'AbortError') throw e;
    await sleep(1500);
    return await fetchJson(url, ms);
  }
}
async function searchOFF(q) {
  const key = q.trim().toLowerCase();
  if (offCache.has(key)) return offCache.get(key);
  const mk = fields => `https://world.openfoodfacts.org/cgi/search.pl?search_terms=${encodeURIComponent(q)}&search_simple=1&action=process&json=1&page_size=20&lc=de&sort_by=unique_scans_n&fields=${fields}`;
  const de = '&tagtype_0=countries&tag_contains_0=contains&tag_0=germany';
  let base = mk(OFF_FIELDS), data;
  try { data = await fetchJson(base + de, 20000); }
  catch (e) {
    if (e.name === 'AbortError' || (e.status && e.status < 500 && e.status !== 429)) throw e;
    console.warn('Suche mit Bildfeldern fehlgeschlagen, versuche es ohne', e);
    await sleep(1200);
    base = mk(OFF_FIELDS_BASIC);
    data = await fetchJsonRetry(base + de, 20000);
  }
  if (!(data.products || []).length) data = await fetchJsonRetry(base, 20000);
  const res = (data.products || []).map(fromOFF).filter(Boolean);
  offCache.set(key, res);
  return res;
}
function offErrorText(e) {
  if (e && e.name === 'AbortError') return 'Die Suche von Open Food Facts hat zu lange gebraucht. Versuch es gleich noch einmal.';
  if (e && (e.status === 429 || e.status === 503 || !e.status)) return 'Die Suche von Open Food Facts hat nicht geantwortet. Das passiert, wenn deren Server überlastet ist oder in kurzer Zeit viele Suchen kamen (erlaubt sind 10 pro Minute). Warte eine Minute und such dann noch einmal. Der Barcode-Scan läuft über einen anderen Weg und geht meistens trotzdem.';
  return `Open Food Facts hat mit einem Fehler geantwortet (Code ${e.status}). Versuch es gleich noch einmal.`;
}
async function lookupOFF(code) {
  const data = await fetchJson(`https://world.openfoodfacts.org/api/v2/product/${encodeURIComponent(code)}.json?fields=${OFF_FIELDS}`);
  return data.status === 1 ? fromOFF(data.product) : null;
}
async function searchUSDA(q) {
  const url = `https://api.nal.usda.gov/fdc/v1/foods/search?api_key=${encodeURIComponent(USDA_API_KEY)}&query=${encodeURIComponent(q)}&dataType=Foundation,SR%20Legacy&pageSize=20`;
  const data = await fetchJson(url);
  return (data.foods || []).map(fromUSDA).filter(Boolean);
}

}

function barHTML(pct, opts = {}) {
  const p = Math.max(0, pct || 0);
  return `<div class="bar" role="img" aria-label="${Math.round(p * 100)} Prozent ${opts.max ? 'der Obergrenze' : 'des Richtwerts'}"><i class="${opts.over ? 'over' : ''}" style="width:${(Math.min(p, 1.5) / 1.5 * 100).toFixed(1)}%"></i><b class="tick"></b></div>`;
}
const NOVA_TXT = { 1: 'unverarbeitet', 2: 'verarbeitete Zutat', 3: 'verarbeitet', 4: 'stark verarbeitet' };
const novaPill = n => n ? `<span class="nova n${n}" title="Nova ${n}: ${NOVA_TXT[n]}">Nova ${n}</span>` : '';
const nutriPill = g => g ? `<span class="ns ns-${g}" title="Nutri-Score">Nutri ${g.toUpperCase()}</span>` : '';
const approxMark = on => on ? '<abbr title="Bei manchen Einträgen fehlt diese Angabe. Der echte Wert ist vermutlich höher.">≈</abbr> ' : '';
/* Woher die Werte kommen: offizielle Laborwerte, von Nutzern abgetippt oder selbst angelegt */
function sourceBadge(food) {
  const s = food.source;
  if (s === 'usda') return `<span class="badge lab">${ICON.flask}Offizielle Laborwerte</span>`;
  if (s === 'off') return `<span class="badge user">${ICON.pencil}Von Nutzern abgetippt</span>`;
  if (s === 'custom' || s === 'recipe' || s === 'supp') return `<span class="badge own">${ICON.user}Deine eigenen Werte</span>`;
  return '';
}
/* Vorschaubild: Foto von Open Food Facts, sonst Feld mit Anfangsbuchstabe (bleibt auch, wenn das Foto nicht lädt) */
function thumbHTML(food, size = '') {
  const letter = esc((String(food.name || '?').trim()[0] || '?').toUpperCase());
  const kind = food.source === 'supp' || food.kind === 'supp' ? 'supp' : food.source === 'usda' ? 'fresh' : '';
  const img = safeImg(food.img);
  return `<span class="thumb ${size} ${kind}" data-l="${letter}" aria-hidden="true">${img ? `<img src="${esc(img)}" alt="" loading="lazy" decoding="async" referrerpolicy="no-referrer" onerror="this.remove()">` : ''}</span>`;
}
const qtyText = (food, qty) => food.source === 'supp' || food.kind === 'supp' ? `${fmtNum(qty, 1)} ${esc(food.unit || 'Stk')}` : `${fmtNum(qty)} g`;
function itemKcal(it) { if (it.kind === 'supp') return null; const v = num(valuesOf(it).kcal); return v == null ? null : v * itemFactor(it); }

function ringsSVG(vals, label) {
  const R = [54, 41, 28], W = 11;
  const parts = vals.map((v, i) => {
    const r = R[i], c = 2 * Math.PI * r, p = Math.max(0, Math.min(1, v.pct || 0));
    const fill = p > 0.004 ? `<circle cx="64" cy="64" r="${r}" class="rf ${v.cls}" stroke-width="${W}" stroke-dasharray="${c.toFixed(2)}" stroke-dashoffset="${(c * (1 - p)).toFixed(2)}" style="--len:${c.toFixed(2)}" transform="rotate(-90 64 64)"/>` : '';
    return `<circle cx="64" cy="64" r="${r}" class="rt ${v.cls}" stroke-width="${W}"/>${fill}`;
  }).join('');
  return `<svg class="rings ${S.animate ? 'intro' : ''}" viewBox="0 0 128 128" role="img" aria-label="${esc(label)}">${parts}</svg>`;
}
function miniRing(p, label) {
  const r = 15, c = 2 * Math.PI * r;
  const f = p > 0.004 ? `<circle cx="18" cy="18" r="${r}" class="mf" stroke-dasharray="${c.toFixed(2)}" stroke-dashoffset="${(c * (1 - Math.min(1, p))).toFixed(2)}" transform="rotate(-90 18 18)"/>` : '';
  return `<svg viewBox="0 0 36 36" aria-hidden="true"><circle cx="18" cy="18" r="${r}" class="mt"/>${f}<text x="18" y="22.4" text-anchor="middle">${label}</text></svg>`;
}

function heroHTML(date, day, tot, targets) {
  const sport = sumSport(day.sport);
  const kt = kcalTarget(effProfile(date), sport);
  const kc = tot.kcal.sum, pr = tot.protein.sum, pt = targets.protein.value;
  const sc = nutrientScore(tot, targets);
  const kLine = kt
    ? (kc <= kt ? `${fmtNum(kt - kc)} kcal übrig` : `${fmtNum(kc - kt)} kcal über deinem Ziel`) + (sport ? `, inkl. ${fmtNum(sport)} kcal Sport` : '')
    : '<button class="link" data-action="goto-profile">Kalorienziel festlegen</button>';
  const rings = ringsSVG([{ pct: kt ? kc / kt : 0, cls: 'e' }, { pct: pr / pt, cls: 'p' }, { pct: sc.score / 100, cls: 'm' }],
    `Kalorien ${fmtNum(kc)}${kt ? ' von ' + fmtNum(kt) : ''}, Eiweiß ${fmtNum(pr)} von ${fmtNum(pt)} Gramm, Nährstoff-Score ${sc.score} von 100`);
  return `<section class="card hero">${rings}<div class="hstats">
    <div class="hstat"><i class="key e"></i><div><span class="lbl">Kalorien</span><div class="val">${approxMark(tot.kcal.missing > 0)}<b>${fmtNum(kc)}</b><span>${kt ? ' / ' + fmtNum(kt) : ''} kcal</span></div><small>${kLine}</small></div></div>
    <div class="hstat"><i class="key p"></i><div><span class="lbl">Eiweiß</span><div class="val">${approxMark(tot.protein.missing > 0)}<b>${fmtNum(pr)}</b><span> / ${fmtNum(pt)} g</span></div><small>${pr >= pt ? 'Ziel erreicht' : `noch ${fmtNum(pt - pr)} g`}</small></div></div>
    <div class="hstat"><i class="key m"></i><div><span class="lbl">Nährstoff-Score</span><div class="val"><b>${sc.score}</b><span> / 100</span></div><small>${sc.covered} von ${sc.total} Vitaminen und Mineralstoffen gedeckt</small></div></div>
  </div></section>`;
}

function suggLine(key, target, P) {
  const s = suggestFor(key, P, target, 1)[0];
  const gen = GOOD_SOURCES[key] ? `Gute Quellen sind zum Beispiel ${GOOD_SOURCES[key]}.` : '';
  if (s && s.pct >= 0.15) return `<p class="sugg">${ICON.spark}<span><b>${esc(s.food.name)}</b> (${qtyText(s.food, s.qty)}${s.supp ? ', Ergänzung' : ''}) bringt ${fmtNum(s.amount, decOf(key))} ${unitOf(key)}, das sind ${pctTxt(s.pct)} deines Tagesziels.</span></p>`;
  if (s) return `<p class="sugg">${ICON.spark}<span>Von deinem bisherigen Essen bringt ${esc(s.food.name)} am meisten, aber nur ${pctTxt(s.pct)}. ${gen}</span></p>`;
  return `<p class="sugg">${ICON.spark}<span>${gen || 'In deinem bisherigen Essen steckt davon kaum etwas.'}</span></p>`;
}
function gapsHTML(date, day, tot, targets) {
  const isToday = date === todayStr();
  if (!day.items.length) {
    return `<section class="card empty-card"><h2>${isToday ? 'Was hast du heute gegessen?' : 'Für diesen Tag ist nichts eingetragen.'}</h2>
      <p>Trag dein Essen ein. Hier siehst du dann sofort, welche Vitamine und Nährstoffe dir noch fehlen und womit du sie auffüllen kannst.</p>
      <button class="btn primary" data-action="add">${ICON.plus} Essen eintragen</button></section>`;
  }
  const { low, over, noData } = findGaps(tot, targets, 3, day.items);
  const P = pool();
  const items = low.map(g => {
    const t = targets[g.key], rest = Math.max(0, t.value - tot[g.key].sum);
    return `<li><div class="gtop"><span class="gname">${labelOf(g.key)}</span><span class="gval">${approxMark(g.approx)}${pctTxt(g.pct)}</span></div>
      ${barHTML(g.pct)}<p class="grest">Noch ${fmtNum(rest, decOf(g.key))} ${unitOf(g.key)} bis zum Tagesziel von ${fmtNum(t.value, decOf(g.key))} ${unitOf(g.key)}</p>${suggLine(g.key, t, P)}</li>`;
  }).join('');
  const ov = over.map(o => `<p class="warn">${ICON.warn}<span><b>Zu viel ${labelOf(o.key)}:</b> ${fmtNum(tot[o.key].sum, decOf(o.key))} ${unitOf(o.key)}, empfohlen sind höchstens ${fmtNum(targets[o.key].value, decOf(o.key))} ${unitOf(o.key)}.</span></p>`).join('');
  const body = low.length ? `<ul class="gaplist">${items}</ul>` : `<p class="done">${ICON.check}<span>Alle Vitamine, Mineralstoffe, Eiweiß und Ballaststoffe sind gedeckt.</span></p>`;
  return `<section class="card gaps"><h2>${isToday ? 'Das fehlt dir heute noch' : 'Lücken an diesem Tag'}</h2>${body}${ov}
    ${noData.length ? `<p class="foot">Keine Daten in deinen Einträgen zu: ${noData.map(labelOf).join(', ')}. Viele Produkte geben diese Werte nicht an. Im Score zählen sie als 0.</p>` : ''}
    ${isToday && low.length ? '<p class="foot">Stand jetzt, das füllt sich mit jeder Mahlzeit. Die Tipps kommen aus Lebensmitteln, die du schon gegessen hast.</p>' : ''}</section>`;
}

function itemRow(it, date) {

}

function waterHTML(date, day) {

const NOVA_META = { 1: ['Nova 1, unverarbeitet', 'var(--nova1)'], 2: ['Nova 2, verarbeitete Zutaten', 'var(--nova2)'], 3: ['Nova 3, verarbeitet', 'var(--nova3)'], 4: ['Nova 4, stark verarbeitet', 'var(--nova4)'], 0: ['Keine Angabe', 'var(--surface2)'] };
function novaHTML(items) {
  const foods = items.filter(it => it.kind !== 'supp');
  if (!foods.length) return '';
  const c = countNova(foods), total = foods.length;
  const segs = [1, 2, 3, 4, 0].filter(k => c[k]).map(k => `<span style="width:${c[k] / total * 100}%;background:${NOVA_META[k][1]}"></span>`).join('');
  const legend = [1, 2, 3, 4, 0].filter(k => c[k]).map(k => `<li><span class="dot" style="background:${NOVA_META[k][1]}"></span>${NOVA_META[k][0]}: ${c[k]} von ${total}</li>`).join('');
  return `<h3 class="ng">Verarbeitungsgrad</h3><div class="nova-bar" role="img" aria-label="Verteilung der Nova-Gruppen">${segs}</div><ul class="legend">${legend}</ul>`;
}
function nutrientsHTML(tot, targets, items) {
  if (!items.length) return `<section class="card"><div class="chead"><h2>Nährstoffe</h2></div><p class="empty">Sobald du etwas einträgst, siehst du hier über 30 Nährstoffe im Vergleich zu deinem Bedarf.</p></section>`;
  const row = key => {
    const n = NUTRIENTS.find(x => x.key === key), t = targets[key], e = tot[key];
    const p = t ? e.sum / t.value : null;
    if (!hasData(items, key)) return `<div class="nrow"><span class="nn">${n.label}</span><span class="nv">keine Daten</span></div>`;
    return `<div class="nrow"><span class="nn">${n.label}</span><span class="nv">${approxMark(e.missing > 0)}<b>${fmtNum(e.sum, n.dec)}</b>${t ? ` / ${t.type === 'max' ? 'max. ' : ''}${fmtNum(t.value, n.dec)}` : ''} ${n.unit}</span>${t ? barHTML(p, { over: t.type === 'max' && p > 1, max: t.type === 'max' }) : ''}</div>`;
  };
  let body;
  if (S.nutView === 'gaps') {
    const keys = NUTRIENTS.map(x => x.key).filter(k => targets[k] && hasData(items, k)).filter(k => {
      const t = targets[k], p = tot[k].sum / t.value; return t.type === 'max' ? p > 1 : p < 1;
    }).sort((a, b) => tot[a].sum / targets[a].value - tot[b].sum / targets[b].value);
    body = keys.length ? `<p class="hint">${keys.length} Werte liegen noch unter dem Richtwert oder über der Obergrenze.</p>${keys.map(row).join('')}`
      : `<p class="done">${ICON.check}<span>Keine Lücken. Unter „Alle“ siehst du jeden Wert.</span></p>`;
    const nd = NUTRIENTS.filter(x => targets[x.key] && !hasData(items, x.key)).map(x => x.label);
    if (nd.length) body += `<p class="hint" style="margin-top:10px">Ohne Daten: ${nd.join(', ')}.</p>`;
  } else {
    body = GROUPS.map(g => `<h3 class="ng">${g}</h3>${NUTRIENTS.filter(x => x.group === g).map(x => row(x.key)).join('')}`).join('') + novaHTML(items);
  }

/* ---------------------------------------------------------------------

function weekLabel(monday = S.monday) {
  const a = monday, b = addDays(a, 6);
  return `${a.getDate()}. ${MON[a.getMonth()]} bis ${b.getDate()}. ${MON[b.getMonth()]} ${b.getFullYear()}`;
}
function weekBarHTML(title) {
  const isNow = fmtDate(S.monday) === fmtDate(mondayOf(new Date()));
  return `<div class="weekbar"><div class="t"><b>${title}</b><span>${isNow ? 'Diese Woche, ' : ''}${weekLabel()}</span></div>
    <button class="icon-btn" data-action="prev-week" aria-label="Vorherige Woche">${ICON.left}</button>
    <button class="icon-btn" data-action="next-week" aria-label="Nächste Woche">${ICON.right}</button></div>`;
}
const deltaTxt = (a, b, dec = 0, unit = '') => (a == null || b == null) ? 'Keine Daten zur Vorwoche' : `${a - b >= 0 ? '+' : '−'}${fmtNum(Math.abs(a - b), dec)}${unit} zur Vorwoche`;
function heatHTML(dates, targets) {
  const keys = GAP_KEYS.filter(k => targets[k]);
  const dayItems = dates.map(d => getDay(d).items);
  const tots = dayItems.map(items => items.length ? sumItems(items) : null);
  const lvl = p => p >= 1 ? 4 : p >= 0.75 ? 3 : p >= 0.5 ? 2 : p >= 0.25 ? 1 : 0;
  const head = `<span></span>${dates.map(d => `<span class="hd">${WD_SHORT[wdIdx(parseDate(d))]}</span>`).join('')}`;
  const rows = keys.map(k => `<span class="rl" title="${labelOf(k)}">${labelOf(k)}</span>${tots.map((t, i) => {
    if (!t) return `<span class="c none" title="${dateLabel(dates[i])}: nichts eingetragen"></span>`;
    if (!hasData(dayItems[i], k)) return `<span class="c none" title="${labelOf(k)}, ${dateLabel(dates[i])}: keine Daten"></span>`;
    const p = t[k].sum / targets[k].value;
    return `<span class="c h${lvl(p)}" title="${labelOf(k)}, ${dateLabel(dates[i])}: ${pctTxt(p)}"></span>`;
  }).join('')}`).join('');
  const lg = [['h0', 'unter 25 %'], ['h1', '25 bis 50 %'], ['h2', '50 bis 75 %'], ['h3', '75 bis 100 %'], ['h4', '100 % und mehr']]
    .map(([c, l]) => `<span><i class="c ${c}" style="background:var(--heat${c.slice(1)})"></i>${l}</span>`).join('') + '<span><i style="border:1px dashed var(--line)"></i>keine Daten</span>';
  return `<section class="card"><h2>Woche auf einen Blick</h2><p class="hint">Jedes Kästchen zeigt, wie viel vom Tagesziel du an dem Tag erreicht hast. Genaue Werte stehen oben in der Tagesansicht.</p>
    <div class="heat" role="img" aria-label="Übersicht der Nährstoffabdeckung pro Tag">${head}${rows}</div><div class="hlegend">${lg}</div></section>`;
}
function weekHTML() {
  const dates = weekDates(S.monday), prev = weekDates(addDays(S.monday, -7));
  const ref = dates[6] <= todayStr() ? dates[6] : todayStr();
  const targets = targetsFor(ref);
  const wc = weekCheck(dates.map(getDay), prev.map(getDay), targets);
  const head = weekBarHTML('Woche');
  if (!wc.days) return `${head}<div class="stack"><section class="card empty-card"><h2>In dieser Woche ist noch nichts eingetragen.</h2><p>Sobald du an ein paar Tagen Essen einträgst, siehst du hier, welche Nährstoffe dir oft fehlen und wie sich die Woche zur letzten verändert.</p></section>${historyHTML()}</div>`;
  const P = pool();
  const kpi = (l, v, unit, d) => `<div class="kpi"><div class="l">${l}</div><div class="v">${v}${unit ? `<span> ${unit}</span>` : ''}</div><div class="d">${d}</div></div>`;
  const kpis = `<div class="kpis">
    ${kpi('Nährstoff-Score im Schnitt', wc.score, '/ 100', deltaTxt(wc.score, wc.prevScore))}
    ${kpi('Kalorien pro Tag', fmtNum(wc.kcal), 'kcal', deltaTxt(wc.kcal, wc.prevKcal))}
    ${kpi('Eiweiß pro Tag', fmtNum(wc.protein), 'g', deltaTxt(wc.protein, wc.prevProtein, 0, ' g'))}
    ${kpi('Stark verarbeitet', wc.nova4 == null ? '–' : Math.round(wc.nova4 * 100), wc.nova4 == null ? '' : '%', wc.nova4 == null || wc.prevNova4 == null ? 'Anteil deiner Einträge mit Nova 4' : deltaTxt(wc.nova4 * 100, wc.prevNova4 * 100, 0, ' Punkte'))}</div>`;
  const often = wc.often.length ? `<ul class="often">${wc.often.slice(0, 5).map(r => `<li><div class="gtop"><span class="gname">${labelOf(r.key)}</span><span class="gval">${approxMark(r.approx)}Ø ${pctTxt(r.avgPct)}</span></div>
      ${barHTML(r.avgPct)}<p class="grest">An ${r.below} von ${wc.days} Tagen unter dem Ziel${r.veryLow ? `, davon ${r.veryLow}-mal unter der Hälfte` : ''}.</p>${suggLine(r.key, targets[r.key], P)}</li>`).join('')}</ul>`
    : `<p class="done">${ICON.check}<span>Kein Nährstoff war an der Mehrheit der Tage zu niedrig.</span></p>`;
  const nd = wc.noData.length ? `<p class="foot">Keine Daten in dieser Woche zu: ${wc.noData.map(labelOf).join(', ')}.</p>` : '';
  const good = wc.good.length ? `<div class="goodchips">${wc.good.map(r => `<span class="chip">${labelOf(r.key)}</span>`).join('')}</div>` : '<p class="hint">Noch keiner an allen Tagen. Das kommt.</p>';
  const over = wc.over.map(o => `<p class="warn">${ICON.warn}<span><b>${labelOf(o.key)}</b> lag an ${o.days} von ${wc.days} Tagen über der Obergrenze von ${fmtNum(targets[o.key].value, decOf(o.key))} ${unitOf(o.key)}.</span></p>`).join('');
  return `${head}<div class="stack">${kpis}
    <div class="cols"><div class="col"><section class="card"><h2>Oft zu wenig</h2><p class="hint">Nährstoffe, die an mindestens der Hälfte der ${wc.days} eingetragenen Tage unter dem Ziel lagen.</p>${often}${over}${nd}</section>
      <section class="card"><h2>Läuft gut</h2><p class="hint">An jedem eingetragenen Tag gedeckt.</p>${good}</section></div>
      <div class="col">${heatHTML(dates, targets)}</div></div>
    ${historyHTML()}</div>`;
}

function histMetrics() {
  return [{ key: 'kcal', label: 'Kalorien', unit: 'kcal', dec: 0 },
    ...NUTRIENTS.map(n => ({ key: n.key, label: n.label, unit: n.unit, dec: n.dec })),
    { key: 'score', label: 'Nährstoff-Score', unit: 'Punkte', dec: 0 },
    { key: 'water', label: 'Wasser', unit: 'ml', dec: 0 },
    { key: 'weight', label: 'Körpergewicht', unit: 'kg', dec: 1 }];
}
function seriesForMetric(key, dates) {
  if (key !== 'score') return seriesFor(key, dates, S.days);
  return dates.map(date => { const d = S.days[date]; return { date, value: d && d.items.length ? nutrientScore(sumItems(d.items), targetsFor(date)).score : null }; });
}
function chartHTML(series, meta, target) {
  const W = Math.round(Math.max(330, Math.min(720, (window.innerWidth || 720) - 70))), H = W < 500 ? 220 : 260, L = 44, R = 10, T = 18, B = 28, iw = W - L - R, ih = H - T - B;
  const vals = series.map(s => s.value).filter(v => v !== null);
  if (!vals.length) return '<p class="empty">In diesem Zeitraum gibt es noch keine Daten.</p>';
  const isLine = meta.key === 'weight';
  let lo = 0, hi = Math.max(...vals, target && !isLine ? target.value : 0);
  if (isLine) { lo = Math.min(...vals); hi = Math.max(...vals); const p = Math.max(0.5, (hi - lo) * 0.25); lo = Math.floor(lo - p); hi = Math.ceil(hi + p); }
  else hi = niceMax(hi);
  const yOf = v => T + ih - (v - lo) / (hi - lo) * ih;
  const N = series.length, slot = iw / N, xC = i => L + slot * (i + 0.5);
  const tdec = hi - lo < 10 ? 1 : 0;
  let g = '';
  for (let i = 0; i <= 4; i++) {
    const v = lo + (hi - lo) * i / 4, y = yOf(v);
    g += `<line x1="${L}" x2="${W - R}" y1="${y.toFixed(1)}" y2="${y.toFixed(1)}" stroke="var(--line)" stroke-width="1"/><text x="${L - 8}" y="${(y + 4).toFixed(1)}" text-anchor="end" font-size="11" fill="var(--muted)">${fmtNum(v, tdec)}</text>`;
  }
  const step = Math.ceil(N / (W < 500 ? 5 : 8));
  series.forEach((s, i) => { if (i % step === 0) g += `<text x="${xC(i).toFixed(1)}" y="${H - 8}" text-anchor="middle" font-size="11" fill="var(--muted)">${shortDate(s.date)}</text>`; });
  let marks = '';
  if (!isLine) {
    const bw = Math.max(2, Math.min(24, slot * 0.66)), yb = T + ih;
    series.forEach((s, i) => {
      if (s.value === null || s.value <= 0) return;
      const h = Math.max(1, (s.value - lo) / (hi - lo) * ih), y = yb - h, x = xC(i) - bw / 2, r = Math.min(4, bw / 2, h);
      marks += `<path d="M${x.toFixed(1)} ${yb} V${(y + r).toFixed(1)} Q${x.toFixed(1)} ${y.toFixed(1)} ${(x + r).toFixed(1)} ${y.toFixed(1)} H${(x + bw - r).toFixed(1)} Q${(x + bw).toFixed(1)} ${y.toFixed(1)} ${(x + bw).toFixed(1)} ${(y + r).toFixed(1)} V${yb} Z" fill="var(--micro)"/>`;
    });
  } else {
    const pts = series.map((s, i) => s.value === null ? null : [xC(i), yOf(s.value)]).filter(Boolean);
    if (pts.length > 1) marks += `<polyline points="${pts.map(p => p[0].toFixed(1) + ',' + p[1].toFixed(1)).join(' ')}" fill="none" stroke="var(--micro)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>`;
    pts.forEach(p => { marks += `<circle cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="4" fill="var(--micro)" stroke="var(--surface)" stroke-width="2"/>`; });
  }
  let tline = '';
  if (target && !isLine && target.value <= hi) {
    const y = yOf(target.value);
    tline = `<line x1="${L}" x2="${W - R}" y1="${y.toFixed(1)}" y2="${y.toFixed(1)}" stroke="var(--text)" stroke-width="1.5" stroke-dasharray="5 4" opacity=".7"/>`;
  }
  const focusable = N <= 31 ? 'tabindex="0"' : '';
  const hits = series.map((s, i) => {
    const txt = `${dateLabel(s.date)}: ${s.value === null ? 'keine Daten' : fmtNum(s.value, meta.dec) + ' ' + meta.unit}`;
    return `<rect class="hit" x="${(L + slot * i).toFixed(1)}" y="${T}" width="${slot.toFixed(1)}" height="${ih}" data-tip="${esc(txt)}" aria-label="${esc(txt)}" ${focusable}></rect>`;
  }).join('');
  const avg = vals.reduce((a, b) => a + b, 0) / vals.length;
  return `<svg class="chart ${S.hist.loading ? 'loading' : ''}" viewBox="0 0 ${W} ${H}" role="group" aria-label="${esc(meta.label)}, ${N} Tage, Durchschnitt ${fmtNum(avg, meta.dec)} ${meta.unit}">${g}${tline}${marks}${hits}</svg>`;
}
function historyHTML() {
  const metrics = histMetrics();
  const meta = metrics.find(m => m.key === S.hist.metric) || metrics[1];
  const dates = histDates(S.hist.range);
  const series = seriesForMetric(meta.key, dates);
  const vals = series.map(s => s.value).filter(v => v !== null);
  const targets = targetsFor(todayStr());
  const target = meta.key === 'water' ? { value: WATER_TARGET, type: 'min' } : meta.key === 'kcal' ? (kcalTarget(effProfile(todayStr())) ? { value: kcalTarget(effProfile(todayStr())), type: 'min' } : null) : targets[meta.key];
  const stat = (v, l) => `<div class="stat"><b>${v}</b><span>${l}</span></div>`;
  const stats = vals.length ? `<div class="stats">${stat(fmtNum(vals.reduce((a, b) => a + b, 0) / vals.length, meta.dec) + ' ' + meta.unit, `Durchschnitt, ${vals.length} Tage mit Daten`)}${stat(fmtNum(Math.max(...vals), meta.dec) + ' ' + meta.unit, 'Höchster Wert')}${stat(fmtNum(Math.min(...vals), meta.dec) + ' ' + meta.unit, 'Niedrigster Wert')}</div>` : '';
  const rows = series.filter(s => s.value !== null).map(s => `<tr><td>${dateLabel(s.date)}</td><td class="r">${fmtNum(s.value, meta.dec)} ${meta.unit}</td></tr>`).join('');
  return `<section class="card"><div class="chead"><h2>Verlauf</h2><div class="seg" role="group" aria-label="Zeitraum">${[7, 30, 90].map(n => `<button data-action="hist-range" data-range="${n}" aria-pressed="${S.hist.range === n}">${n} Tage</button>`).join('')}</div></div>
    <div class="controls" style="margin-bottom:8px"><label class="sr-only" for="hmetric">Wert</label>
      <select id="hmetric" class="input" data-hist="metric" style="max-width:340px">${metrics.map(m => `<option value="${m.key}" ${m.key === meta.key ? 'selected' : ''}>${m.label} (${m.unit})</option>`).join('')}</select></div>
    ${target && meta.key !== 'weight' ? `<p class="hint" style="display:flex;align-items:center;gap:8px"><svg width="22" height="4" aria-hidden="true"><line x1="0" x2="22" y1="2" y2="2" stroke="var(--text)" stroke-width="1.5" stroke-dasharray="5 4" opacity=".7"/></svg>${target.type === 'max' ? 'Obergrenze' : 'Dein Ziel'}: ${fmtNum(target.value, meta.dec)} ${meta.unit}</p>` : ''}
    ${chartHTML(series, meta, target)}${stats}
    ${rows ? `<details class="tbl"><summary>Zahlen anzeigen</summary><table><thead><tr><th>Tag</th><th class="r">${esc(meta.label)}</th></tr></thead><tbody>${rows}</tbody></table></details>` : ''}</section>`;
}
async function ensureHistory() {

async function doSearch(q) {
  const m = S.modal; if (!m || m.type !== 'add') return;
  q = q.trim(); if (q.length < 2) return;
  m.query = q; m.results = []; m.picked = null; m.loading = true; m.notes = []; m.showAll = false;
  renderPending(); renderResults();
  const en = translateSmart(q);
  const [off, usda] = await Promise.allSettled([searchOFF(q), searchUSDA(en)]);
  if (S.modal !== m) return;
  m.loading = false;
  if (off.status === 'fulfilled') m.results.push(...off.value);
  else { console.error(off.reason); m.notes.push(offErrorText(off.reason) + (usda.status === 'fulfilled' && usda.value.length ? ' Frische Lebensmittel aus der USDA-Datenbank findest du trotzdem unten.' : '')); }
  if (usda.status === 'fulfilled') m.results.push(...usda.value.map(x => ({ ...x, nameEn: x.name, name: germanName(x.name) })));
  else if (usda.reason && usda.reason.status === 429) m.notes.push('Das Tageslimit der USDA-Datenbank ist erreicht. Mit einem eigenen kostenlosen USDA-Schlüssel in der Datei passiert das nicht.');
  else m.notes.push('Die USDA-Datenbank antwortet gerade nicht.');
  const lab = labOnly(rankSearch(m.results, [...S.lib.recent, ...S.lib.favorites, ...S.lib.custom], q, en), q, en);
  m.results = lab.list; m.hiddenUser = lab.hidden; m.showUser = false;
  if (!m.results.length && !m.notes.length) m.notes.push('Nichts gefunden. Probier einen anderen Begriff oder leg das Essen unter „Meine“ selbst an.');
  renderResults();
}
async function doLookup(code) {
  const m = S.modal; if (!m || m.type !== 'add') return;
  m.query = code; m.results = []; m.picked = null; m.loading = true; m.notes = [];
  renderPending(); renderResults();
  try {
    const it = await lookupOFF(code.trim());
    if (S.modal !== m) return;
    if (it) { m.results = [it]; m.loading = false; renderResults(); m.picked = 0; renderResults(); renderPending(); return; }
    m.notes.push('Dieses Produkt ist bei Open Food Facts nicht eingetragen oder hat keine Nährwerte. Such es per Name oder leg es unter „Meine“ an.');
  } catch (e) { console.error(e); m.notes.push(offErrorText(e)); }
  m.loading = false; renderResults();
}
let scanner = null;
function loadScript(src) {
  return new Promise((res, rej) => {
    if (window.Html5Qrcode) return res();
    const s = document.createElement('script'); s.src = src; s.onload = res;
    s.onerror = () => rej(new Error('Scanner konnte nicht geladen werden'));
    document.head.appendChild(s);
  });
}
async function stopScan() {
  if (!scanner) return;
  const sc = scanner; scanner = null;
  try { await sc.stop(); sc.clear(); } catch { /* schon gestoppt */ }
}
async function startScan() {
  const m = S.modal; if (!m) return;
  try {
    await loadScript(SCAN_LIB); await stopScan();
    const F = window.Html5QrcodeSupportedFormats;
    scanner = new window.Html5Qrcode('reader', { formatsToSupport: [F.EAN_13, F.EAN_8, F.UPC_A, F.UPC_E], useBarCodeDetectorIfSupported: true, verbose: false });
    await scanner.start({ facingMode: 'environment' }, { fps: 10, qrbox: { width: 260, height: 140 } },
      async text => { await stopScan(); const i = $('#pane-scan input'); if (i) i.value = text; doLookup(text); }, () => { });
  } catch (e) {
    console.error(e); scanner = null;
    m.notes = ['Die Kamera ist nicht verfügbar. Sie braucht HTTPS und deine Erlaubnis. Du kannst die Nummer auch eintippen.'];
    renderResults();
  }
}

/* Dialoge: eigene Lebensmittel, Ergänzungen, Rezepte (unverändert übernommen) */
function valueFieldsHTML(vals, mode) {
  const basis = ['kcal', 'protein', 'fat', 'carbs', 'sugar', 'fiber', 'salt'];
  const groups = [
    ['Nährwerte', basis],
    ['Fette und mehr', NUTRIENTS.filter(n => n.group === 'Fette und mehr').map(n => n.key)],
    ['Vitamine', NUTRIENTS.filter(n => n.group === 'Vitamine').map(n => n.key)],
    ['Mineralstoffe', NUTRIENTS.filter(n => n.group === 'Mineralstoffe').map(n => n.key)]
  ];
  const unitOf = k => k === 'kcal' ? 'kcal' : NUTRIENTS.find(n => n.key === k).unit;
  const input = k => {
    const v = vals && vals[k] != null ? String(Math.round(vals[k] * 1000) / 1000).replace('.', ',') : '';
    return `<div class="field"><label for="v_${k}">${labelOf(k)} (${unitOf(k)})</label><input id="v_${k}" name="v_${k}" type="text" inputmode="decimal" value="${esc(v)}" placeholder="${mode === 'unit' ? '0' : 'unbekannt'}"></div>`;
  };
  return groups.map(([title, keys], gi) => {
    const open = gi === 0 || keys.some(k => vals && vals[k] != null);
    return `<details class="fd" ${open ? 'open' : ''}><summary>${title}</summary><div class="fgrid">${keys.map(input).join('')}</div></details>`;
  }).join('');
}
function readValueFields(data) {
  const f = {}; for (const k of ALL_KEYS) f[k] = data['v_' + k];
  return parseValueFields(f);
}

function draftPreview(d) {
  const ings = d.ingredients;
  if (!ings.length) return '<p class="hint">Füge mindestens eine Zutat hinzu.</p>';
  const total = parseDecimal(d.total);
  const calc = computeRecipe(ings, Number.isNaN(total) ? null : total);
  const pc = parseDecimal(d.portions);
  const portion = pc && !Number.isNaN(pc) && pc >= 1 ? ` Eine Portion hat etwa ${fmtNum(Math.round(calc.total / pc))} g und ${fmtNum(calc.per100.kcal != null ? calc.per100.kcal * calc.total / pc / 100 : null)} kcal.` : '';
  const inc = calc.incomplete.length ? `<br>Bei einigen Zutaten fehlen Angaben zu ${calc.incomplete.slice(0, 4).map(labelOf).join(', ')}${calc.incomplete.length > 4 ? ' und mehr' : ''}. Diese Werte sind dann Mindestwerte.` : '';
  return `<div class="preview"><strong>Pro 100 g:</strong> ${fmtNum(calc.per100.kcal)} kcal, ${fmtNum(calc.per100.protein, 1)} g Eiweiß, ${fmtNum(calc.per100.fat, 1)} g Fett, ${fmtNum(calc.per100.carbs, 1)} g Kohlenhydrate.<br>Gesamtgewicht ${fmtNum(Math.round(calc.total))} g.${portion}${inc}</div>`;
}

  $('#modal-root').innerHTML = modalShell(d.id ? 'Rezept bearbeiten' : 'Neues Rezept', 'Aus Zutaten zusammengesetzt', `

        <div class="field"><label for="rp">Portionen (optional)</label><input id="rp" name="portions" type="text" inputmode="decimal" value="${esc(d.portions)}"></div></div>
      <p class="hint">Das fertige Gewicht ist wichtig, wenn beim Kochen Wasser verdampft. Wiege dazu das fertige Gericht.</p>

async function copyText(text) {
  try { if (navigator.clipboard && navigator.clipboard.writeText) { await navigator.clipboard.writeText(text); return true; } } catch { /* weiter */ }
  try {
    const ta = document.createElement('textarea'); ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.select(); const ok = document.execCommand('copy'); ta.remove(); return ok;
  } catch { return false; }
}
function toggleFav(ref) {

const validQty = (q, max) => q !== null && !Number.isNaN(q) && q > 0 && q <= max;
function curWhen() {
