<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nährstoff-Planer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EDF1F0; --card:#FFFFFF; --ink:#1B2A3A; --muted:#5B6B79; --line:#D6DEE2; --track:#E4EAED;
  --leaf:#2F7D5B; --amber:#D49A12; --beet:#B3445F; --focus:#2563EB;
  font-family:'Bricolage Grotesque',system-ui,-apple-system,'Segoe UI',sans-serif;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font-size:16px;line-height:1.45}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
h1,h2,h3,p{margin:0}
.wrap{max-width:1180px;margin:0 auto;padding:16px}
.center{text-align:center;padding:48px 16px;color:var(--muted)}
.muted{color:var(--muted)}

/* Kopfzeile */
.top{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px 16px;margin-bottom:14px}
.brand{font-weight:800;font-size:1.4rem;letter-spacing:-.02em}
.nav{display:flex;flex-wrap:wrap;gap:4px}
.nav button{background:transparent;border:0;padding:8px 14px;border-radius:8px;font-weight:600;color:var(--muted)}
.nav button:hover{background:#fff;color:var(--ink)}
.nav button[aria-current="page"]{background:var(--ink);color:#fff}
.btn{border:0;border-radius:8px;background:var(--ink);color:#fff;padding:9px 16px;font-weight:600}
.btn:hover{background:#2A3E54}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
.btn.ghost:hover{background:#fff;border-color:var(--ink)}
.btn.small{padding:6px 12px;font-size:.9rem}
.btn.icon{padding:6px 10px;min-width:38px}
.btn.danger{background:transparent;color:var(--beet);border:1.5px solid var(--line)}
.btn.danger:hover{border-color:var(--beet);background:#fff}
.note{background:#FFF7DB;border:1px solid #EBD58A;border-radius:10px;padding:10px 14px;margin-bottom:14px;font-size:.92rem}
.weekbar{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-bottom:12px}
.weeklabel{font-weight:600;min-width:14ch;text-align:center}

/* Plan */
.layout{display:grid;gap:16px}
@media(min-width:980px){
  .layout{grid-template-columns:minmax(0,1fr) 440px;align-items:start}
  .eval{position:sticky;top:16px;max-height:calc(100vh - 32px);overflow:auto}
}
.strip{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px;margin-bottom:12px}
.tile{background:var(--card);border:1.5px solid transparent;border-radius:12px;padding:8px 2px;text-align:center;display:grid;gap:1px;line-height:1.2}
.tile:hover{border-color:var(--line)}
.tile.sel{border-color:var(--ink)}
.tile .wd{color:var(--muted);font-size:.8rem}
.tile .dn{font-weight:800;font-size:1.15rem}
.tile.today .dn{text-decoration:underline;text-underline-offset:3px}
.tile .tk{font-size:.74rem;color:var(--muted);min-height:1.1em}
.detail{background:var(--card);border-radius:14px;padding:14px 16px}
.detail-head{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px}
.detail-head h2{font-size:1.25rem;font-weight:700}
.empty{color:var(--muted);font-size:.95rem;margin-top:10px}
.meal h3{display:flex;justify-content:space-between;gap:8px;font-size:.95rem;font-weight:700;margin:16px 0 2px;padding-bottom:4px;border-bottom:1.5px solid var(--ink)}
.meal h3 .mk{font-weight:500;color:var(--muted)}
.items{list-style:none;margin:0;padding:0}
.item{display:grid;grid-template-columns:auto minmax(0,1fr) auto auto;grid-template-areas:"time name qty act";gap:4px 10px;align-items:center;padding:7px 0;border-top:1px solid var(--line)}
.item:first-child{border-top:0}
.it-time{grid-area:time}.it-name{grid-area:name;min-width:0}.it-qty{grid-area:qty}.it-act{grid-area:act;display:flex}
@media(max-width:600px){
  .item{grid-template-columns:auto minmax(0,1fr) auto;grid-template-areas:"name name act" "time qty qty"}
}
.time{width:100px;padding:4px 6px;border:1.5px solid var(--line);border-radius:6px;background:#fff}
.linkish{background:none;border:0;padding:0;text-align:left;display:block;max-width:100%}
.linkish:hover strong{text-decoration:underline}
.it-name strong{font-weight:600;overflow-wrap:anywhere}
.ibrand{color:var(--muted);font-size:.85rem;display:block}
.chips{display:flex;flex-wrap:wrap;gap:4px;margin-top:3px}
.chip{border-radius:4px;padding:1px 7px;font-size:.78rem;font-weight:600;background:var(--track);color:var(--ink)}
.chip.nova1{background:var(--leaf);color:#fff}
.chip.nova2{background:#6FA85A;color:#fff}
.chip.nova3{background:var(--amber);color:#1B2A3A}
.chip.nova4{background:var(--beet);color:#fff}
.chip.ns-a{background:#1F8A4C;color:#fff}
.chip.ns-b{background:#6AA83A;color:#fff}
.chip.ns-c{background:#E8B91C}
.chip.ns-d{background:#E8872C}
.chip.ns-e{background:#D23F31;color:#fff}
.gram{display:flex;align-items:center;gap:4px;color:var(--muted)}
.gram input{width:78px;padding:5px 6px;border:1.5px solid var(--line);border-radius:6px;text-align:right;background:#fff}
.x{background:none;border:0;font-size:1.3rem;line-height:1;color:var(--muted);padding:4px 8px;border-radius:6px}
.x:hover{color:var(--beet);background:var(--track)}
.x.star{font-size:1.15rem}
.x.star[aria-pressed="true"]{color:var(--amber)}
.x.star:hover{color:var(--amber)}
.block{margin-top:18px;border-top:1.5px solid var(--line);padding-top:12px}
.block h3,.block summary{font-size:.95rem;font-weight:700}
.block summary{cursor:pointer}
.waterrow{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px;margin:6px 0}
.wval b{font-size:1.5rem;font-weight:800;letter-spacing:-.02em}
.wbtns{display:flex;flex-wrap:wrap;gap:6px}
.hint{color:var(--muted);font-size:.88rem;margin:4px 0 8px}
.inline-form{display:flex;flex-wrap:wrap;gap:8px;align-items:end;margin:8px 0}
.inline-form .field{margin:0}
.sport-list{list-style:none;margin:8px 0;padding:0}
.sport-list li{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:5px 0;border-top:1px solid var(--line)}

/* Auswertung */
.eval{background:var(--card);border-radius:14px;padding:16px}
.eval-head{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:8px;margin-bottom:4px}
.eval h2{font-size:1.2rem;font-weight:700}
.seg{display:inline-flex;border:1.5px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{background:#fff;border:0;padding:5px 14px;font-weight:600}
.seg button[aria-pressed="true"]{background:var(--ink);color:#fff}
.sub{color:var(--muted);font-size:.9rem;margin-bottom:12px}
.kcal{font-size:2.3rem;font-weight:800;letter-spacing:-.03em;line-height:1.1}
.kcal small{font-size:1rem;font-weight:500;color:var(--muted);letter-spacing:0}
.group h3{font-size:.95rem;font-weight:700;margin:18px 0 6px;padding-bottom:4px;border-bottom:1.5px solid var(--ink)}
.nrow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 10px;padding:6px 0;border-bottom:1px solid var(--line)}
.nname{font-weight:500}
.nval{text-align:right;color:var(--muted);font-size:.92rem;white-space:nowrap}
.nval b{color:var(--ink);font-size:1.05rem;font-weight:700}
.bar{grid-column:1/-1;position:relative;height:9px;border-radius:5px;background:var(--track);margin-top:3px}
.fill{position:absolute;left:0;top:0;bottom:0;border-radius:5px}
.fill.ok{background:var(--leaf)}
.fill.mid{background:var(--amber)}
.fill.low{background:var(--beet)}
.fill.neutral{background:var(--ink)}
.tick{position:absolute;left:66.667%;top:-3px;bottom:-3px;width:2px;background:var(--ink);border-radius:1px}
.gap{grid-column:1/-1;font-size:.8rem;color:var(--muted)}
.nova-bar{display:flex;height:14px;border-radius:7px;overflow:hidden;background:var(--track);margin:6px 0}
.nova-bar span{display:block;height:100%}
.legend{list-style:none;margin:6px 0 0;padding:0;display:grid;gap:3px;font-size:.88rem}
.legend li{display:flex;align-items:center;gap:8px}
.dot{width:11px;height:11px;border-radius:3px;flex:none}
.foot{color:var(--muted);font-size:.82rem;margin-top:16px}

/* Seiten */
.page{background:var(--card);border-radius:14px;padding:16px}
.page-head{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
.page-head h2{font-size:1.25rem;font-weight:700}
.controls{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
select,.input{padding:8px 10px;border:1.5px solid var(--line);border-radius:8px;background:#fff}
.chart{width:100%;height:auto;display:block;transition:opacity .15s}
.chart.loading{opacity:.5}
.chart text{font-family:inherit}
.hit{fill:transparent;cursor:default}
.hit:hover,.hit:focus{fill:rgba(27,42,58,.06);outline:none}
.stats{display:flex;flex-wrap:wrap;gap:18px;margin:10px 0}
.stat b{display:block;font-size:1.4rem;font-weight:800;letter-spacing:-.02em;line-height:1.2}
.stat span{color:var(--muted);font-size:.85rem}
details.tbl summary{cursor:pointer;font-weight:600;margin-top:10px}
table{border-collapse:collapse;width:100%;font-size:.9rem;margin-top:8px}
th,td{text-align:left;padding:5px 8px;border-bottom:1px solid var(--line)}
td.r,th.r{text-align:right;font-variant-numeric:tabular-nums}
.tip{position:fixed;z-index:30;background:var(--ink);color:#fff;padding:6px 10px;border-radius:8px;font-size:.88rem;pointer-events:none;max-width:70vw}
.shoplist{list-style:none;margin:0;padding:0}
.shoplist li{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--line)}
.shoplist li:first-child{border-top:0}
.shoplist label{display:flex;align-items:center;gap:10px;flex:1;min-width:0;cursor:pointer}
.shoplist input[type=checkbox]{width:20px;height:20px;flex:none}
.shoplist .done span.nm{text-decoration:line-through;color:var(--muted)}
.shoplist .amt{color:var(--muted);white-space:nowrap}
.libsec{margin-bottom:22px}
.libsec h3{font-size:1.05rem;font-weight:700;margin-bottom:2px}
.librow{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px;padding:8px 0;border-top:1px solid var(--line)}
.librow .iname{flex:1 1 220px;min-width:0}
.librow .acts{display:flex;gap:6px}
.libsec .head{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:8px;margin-bottom:6px}

/* Modal */
.overlay{position:fixed;inset:0;background:rgba(27,42,58,.5);z-index:10}
.sheet{position:fixed;z-index:11;background:#fff;display:flex;flex-direction:column;inset:0;border-radius:0}
@media(min-width:700px){.sheet{inset:5vh auto auto 50%;transform:translateX(-50%);width:680px;max-height:90vh;border-radius:16px}}
.sheet-head{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:14px 16px;border-bottom:1px solid var(--line)}
.sheet-head h2{font-size:1.15rem;font-weight:700}
.sheet-body{padding:14px 16px;overflow:auto;flex:1}
.tabs{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.tabs button{background:#fff;border:1.5px solid var(--line);border-radius:8px;padding:7px 14px;font-weight:600}
.tabs button[aria-selected="true"]{background:var(--ink);border-color:var(--ink);color:#fff}
.row{display:flex;gap:8px;margin-bottom:10px}
.row input{flex:1;min-width:0;padding:9px 12px;border:1.5px solid var(--line);border-radius:8px}
.results{list-style:none;margin:0;padding:0}
#results h3{font-size:.95rem;margin:14px 0 4px}
.res{display:flex;gap:10px;align-items:flex-start;justify-content:space-between;padding:8px 0;border-top:1px solid var(--line)}
.res .iname{min-width:0}
.res.picked{background:#EAF3EE;margin:0 -8px;padding:8px}
.resact{display:flex;align-items:center;gap:2px;flex:none}
#reader{width:100%;max-width:360px;margin:0 auto 10px}
.pending{border-top:1px solid var(--line);padding:12px 16px;background:#F7F9F9;display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.pending .pname{flex:1 1 100%;font-weight:600;overflow-wrap:anywhere}
.pending select,.pending input[type=time]{padding:8px;border:1.5px solid var(--line);border-radius:8px;background:#fff}
.field{display:grid;gap:4px;margin-bottom:12px}
.field label,.field legend{font-weight:600;font-size:.92rem}
.field input,.field select{padding:9px 12px;border:1.5px solid var(--line);border-radius:8px;width:100%;background:#fff}
fieldset.field{border:0;padding:0;margin:0 0 14px}
.radios{display:flex;gap:16px}
.radios input{width:auto}
.fgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:4px 10px;margin-top:8px}
.fgrid .field{margin-bottom:6px}
.fgrid label{font-weight:500;font-size:.85rem}
details.fd{border-top:1px solid var(--line);padding:8px 0}
details.fd summary{cursor:pointer;font-weight:700}
.error{color:var(--beet);font-weight:500;margin-bottom:10px}
.ing{display:flex;gap:8px;align-items:center;padding:6px 0;border-top:1px solid var(--line)}
.ing .nm{flex:1;min-width:0;overflow-wrap:anywhere}
.preview{background:#F3F6F5;border-radius:10px;padding:10px 12px;margin:10px 0;font-size:.92rem}
.auth{max-width:380px;margin:12vh auto;background:#fff;border-radius:16px;padding:24px}
.auth h1{font-size:1.5rem;font-weight:800;margin-bottom:4px}
.auth p{color:var(--muted);margin-bottom:16px}
.link{background:none;border:0;color:var(--ink);text-decoration:underline;padding:0;margin-top:12px}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:8px;z-index:40;max-width:90vw}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div id="app"></div>
<div id="modal-root"></div>
<div id="tip" class="tip" role="tooltip" hidden></div>
<div id="toast" class="toast" role="status" hidden></div>

<script type="module">
/* =====================================================================
   KONFIGURATION
   1) Firebase: Projekt anlegen, "Authentication" (E-Mail/Passwort) und
      "Realtime Database" aktivieren, dann die Web-App-Daten hier eintragen.
      Die databaseURL steht oben auf der Seite "Realtime Database", zum Beispiel
      https://DEIN_PROJEKT-default-rtdb.europe-west1.firebasedatabase.app
      Solange hier "DEIN" steht, läuft die App im Testmodus (nur Browser).
   2) USDA: kostenlosen Schlüssel holen unter https://fdc.nal.usda.gov/api-key-signup
      (DEMO_KEY funktioniert, hat aber ein sehr kleines Tageslimit).
   3) Regeln der Realtime Database (damit jeder nur seine eigenen Daten sieht):
      {
        "rules": {
          "users": {
            "$uid": {
              ".read": "$uid === auth.uid",
              ".write": "$uid === auth.uid"
            }
          }
        }
      }
   ===================================================================== */
const FIREBASE_CONFIG = {
  apiKey: "AIzaSyDtzirq0BuDqa8-TmuStqmLDnNpG3l5YNQ",
  authDomain: "health-45f80.firebaseapp.com",
  databaseURL: "https://health-45f80-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "health-45f80",
  appId: "1:676711657322:web:181b9006c52566d4ad3f13"
};
const USDA_API_KEY = "DEMO_KEY";
const FIREBASE_VERSION = "10.14.1";
const SCAN_LIB = "https://cdnjs.cloudflare.com/ajax/libs/html5-qrcode/2.3.8/html5-qrcode.min.js";
const FIREBASE_MISSING = ['apiKey', 'databaseURL', 'projectId', 'appId'].filter(k => !FIREBASE_CONFIG[k] || String(FIREBASE_CONFIG[k]).startsWith('DEIN'));
const FIREBASE_READY = FIREBASE_MISSING.length === 0;

/* PURE:START  (Logik ohne Browser-Abhängigkeit, wird separat getestet) */
const pad = n => String(n).padStart(2, '0');
const fmtDate = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const parseDate = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
const addDays = (d, n) => { const x = new Date(d.getFullYear(), d.getMonth(), d.getDate()); x.setDate(x.getDate() + n); return x; };
const mondayOf = d => { const x = new Date(d.getFullYear(), d.getMonth(), d.getDate()); x.setDate(x.getDate() - ((x.getDay() + 6) % 7)); return x; };
const weekDates = monday => Array.from({ length: 7 }, (_, i) => fmtDate(addDays(monday, i)));
const num = x => { if (x === null || x === undefined || x === '') return null; const n = Number(x); return Number.isFinite(n) ? n : null; };
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);

/* Die Realtime Database speichert Listen als Objekte mit Zahlen-Schlüsseln und lässt leere Listen weg. */
const toArr = x => Array.isArray(x) ? x
  : (x && typeof x === 'object' ? Object.keys(x).sort((a, b) => Number(a) - Number(b)).map(k => x[k]) : []);
/* Schlüssel in der Realtime Database dürfen kein . $ # [ ] / enthalten und höchstens 768 Byte lang sein */
const shopKey = (week, key) => week + '|' + encodeURIComponent(String(key)).replace(/\./g, '%2E').slice(0, 200);

/* Zahl aus Eingabefeld: leer -> null, ungültig -> NaN, Komma oder Punkt erlaubt */
function parseDecimal(s) {
  if (s === null || s === undefined) return null;
  const t = String(s).trim().replace(',', '.');
  if (t === '') return null;
  if (!/^(\d+\.?\d*|\.\d+)$/.test(t)) return NaN;
  return Number(t);
}

const MEALS = [
  { id: 'fruehstueck', label: 'Frühstück', def: '08:00' },
  { id: 'mittag', label: 'Mittagessen', def: '12:30' },
  { id: 'abend', label: 'Abendessen', def: '18:30' },
  { id: 'snack', label: 'Snacks', def: '15:30' },
  { id: 'erg', label: 'Nahrungsergänzung', def: '08:00' }
];
const mealForTime = t => {
  const m = /^(\d\d):(\d\d)$/.exec(t || ''); if (!m) return 'snack';
  const x = Number(m[1]) * 60 + Number(m[2]);
  if (x < 10 * 60 + 30) return 'fruehstueck';
  if (x < 14 * 60 + 30) return 'mittag';
  if (x < 17 * 60) return 'snack';
  if (x < 21 * 60) return 'abend';
  return 'snack';
};

const WATER_TARGET = 1500;
const NUTRIENTS = [
  { key: 'protein', label: 'Eiweiß', unit: 'g', group: 'Makronährstoffe', dec: 0 },
  { key: 'fat', label: 'Fett', unit: 'g', group: 'Makronährstoffe', dec: 0 },
  { key: 'carbs', label: 'Kohlenhydrate', unit: 'g', group: 'Makronährstoffe', dec: 0 },
  { key: 'sugar', label: 'davon Zucker', unit: 'g', group: 'Makronährstoffe', dec: 0 },
  { key: 'fiber', label: 'Ballaststoffe', unit: 'g', group: 'Makronährstoffe', dec: 0, ref: { m: 30, w: 30 } },
  { key: 'salt', label: 'Salz', unit: 'g', group: 'Makronährstoffe', dec: 1, ref: { m: 6, w: 6 }, type: 'max' },
  { key: 'satfat', label: 'Gesättigte Fette', unit: 'g', group: 'Fette und mehr', dec: 1 },
  { key: 'chol', label: 'Cholesterin', unit: 'mg', group: 'Fette und mehr', dec: 0 },
  { key: 'omega3', label: 'Omega-3-Fettsäuren', unit: 'g', group: 'Fette und mehr', dec: 2 },
  { key: 'caffeine', label: 'Koffein', unit: 'mg', group: 'Fette und mehr', dec: 0, ref: { m: 400, w: 400 }, type: 'max' },
  { key: 'vitA', label: 'Vitamin A', unit: 'µg', group: 'Vitamine', dec: 0, ref: { m: 1000, w: 800 } },
  { key: 'vitC', label: 'Vitamin C', unit: 'mg', group: 'Vitamine', dec: 0, ref: { m: 110, w: 95 } },
  { key: 'vitD', label: 'Vitamin D', unit: 'µg', group: 'Vitamine', dec: 1, ref: { m: 20, w: 20 } },
  { key: 'vitE', label: 'Vitamin E', unit: 'mg', group: 'Vitamine', dec: 1, ref: { m: 15, w: 12 } },
  { key: 'vitK', label: 'Vitamin K', unit: 'µg', group: 'Vitamine', dec: 0, ref: { m: 70, w: 60 } },
  { key: 'b1', label: 'Vitamin B1', unit: 'mg', group: 'Vitamine', dec: 2, ref: { m: 1.2, w: 1.0 } },
  { key: 'b2', label: 'Vitamin B2', unit: 'mg', group: 'Vitamine', dec: 2, ref: { m: 1.4, w: 1.1 } },
  { key: 'b3', label: 'Niacin (B3)', unit: 'mg', group: 'Vitamine', dec: 1, ref: { m: 16, w: 13 } },

const itemFactor = it => it.kind === 'supp' ? (Number(it.qty) || 0) : (Number(it.grams) || 0) / 100;
const valuesOf = it => it.kind === 'supp' ? (it.perUnit || {}) : (it.per100 || {});

function sumItems(items) {
  const tot = {};
  for (const k of ALL_KEYS) tot[k] = { sum: 0, missing: 0, n: 0 };
  for (const it of items) {
    const f = itemFactor(it), supp = it.kind === 'supp', vals = valuesOf(it), inc = it.incomplete || [];
    for (const k of ALL_KEYS) {
      const v = num(vals[k]);
      tot[k].n++;
      if (v === null) { if (!supp) tot[k].missing++; }          // Ergänzung: leer heißt "nicht enthalten"
      else { tot[k].sum += v * f; if (!supp && inc.includes(k)) tot[k].missing++; }
    }
  }
  return tot;
}

/* Durchschnitt pro Tag, gerechnet nur über Tage mit Einträgen */
function averageDays(daysItems) {
  const withData = daysItems.filter(a => a.length);
  const res = {};
  for (const k of ALL_KEYS) res[k] = { sum: 0, missing: 0, n: 0 };
  for (const day of withData) {
    const t = sumItems(day);
    for (const k of ALL_KEYS) { res[k].sum += t[k].sum; res[k].missing += t[k].missing; res[k].n += t[k].n; }
  }
  if (withData.length) for (const k of ALL_KEYS) res[k].sum /= withData.length;
  return { tot: res, days: withData.length };
}

function countNova(items) {

function coverage(value, target) {
  if (!target) return null;
  const pct = value / target.value;
  let cls;
  if (target.type === 'max') cls = pct <= 1 ? 'ok' : 'low';
  else cls = pct >= 1 ? 'ok' : pct >= 0.5 ? 'mid' : 'low';
  return { pct, cls, fill: Math.min(pct, 1.5) / 1.5 * 100 };
}

function validateFood(per, mode) {

    if (per.kcal == null && per.protein == null) return 'Gib mindestens Kalorien oder Eiweiß an.';
    if ((per.protein || 0) + (per.fat || 0) + (per.carbs || 0) > 100.5) return 'Eiweiß, Fett und Kohlenhydrate zusammen können nicht über 100 g pro 100 g liegen.';
    if (per.kcal != null && per.kcal > 900) return 'Mehr als 900 kcal pro 100 g gibt es bei Lebensmitteln nicht. Prüfe die Eingabe.';
  } else if (ALL_KEYS.every(k => !per[k])) return 'Gib mindestens einen Nährstoff an.';

function computeRecipe(ings, totalGrams) {
  const sumG = ings.reduce((a, i) => a + (Number(i.grams) || 0), 0);
  const total = Number(totalGrams) > 0 ? Number(totalGrams) : sumG;
  const per100 = {}, incomplete = [];
  for (const k of ALL_KEYS) {
    let sum = 0, known = 0, unknown = 0;
    for (const i of ings) {
      const f = (Number(i.grams) || 0) / 100;
      const v = num(i.per100 && i.per100[k]);
      if (v === null) unknown++;
      else { sum += v * f; known++; if ((i.incomplete || []).includes(k)) unknown++; }
    }
    per100[k] = known && total > 0 ? sum / total * 100 : null;
    if (known && unknown) incomplete.push(k);
  }
  return { per100, incomplete, total, sumG };
}

/* ---- Einkaufsliste ---- */
function shoppingList(daysMap, dates, fromDate) {
  const m = new Map();
  const add = (key, name, grams) => {
    if (!(grams > 0)) return;
    const e = m.get(key) || { key, name, grams: 0 };
    e.grams += grams; m.set(key, e);
  };
  for (const d of dates) {
    if (fromDate && d < fromDate) continue;
    const items = (daysMap[d] && daysMap[d].items) || [];
    for (const it of items) {
      if (it.kind === 'supp') continue;
      const g = Number(it.grams) || 0;
      if (g <= 0) continue;
      if (Array.isArray(it.ingredients) && it.ingredients.length && it.recipeTotal > 0) {
        const s = g / it.recipeTotal;
        for (const ing of it.ingredients) add(foodKey(ing), ing.name, (Number(ing.grams) || 0) * s);
      } else add(foodKey(it), it.name, g);
    }
  }
  return [...m.values()].sort((a, b) => a.name.localeCompare(b.name, 'de'));
}

function seriesFor(metric, dates, days) {

    if (d) {

      else if (metric === 'weight') v = d.weight;
      else if (d.items.length) { const t = sumItems(d.items); v = t[metric] ? t[metric].sum : null; }
    }
    return { date, value: v };
  });
}
function niceMax(v) {
  if (!(v > 0)) return 1;
  const p = Math.pow(10, Math.floor(Math.log10(v)));
  const f = v / p;
  const n = f <= 1 ? 1 : f <= 2 ? 2 : f <= 2.5 ? 2.5 : f <= 5 ? 5 : 10;
  return n * p;
}

  const base = `https://www.gstatic.com/firebasejs/${FIREBASE_VERSION}/`;
  const [appM, authM, dbM] = await Promise.all([
    import(base + 'firebase-app.js'), import(base + 'firebase-auth.js'), import(base + 'firebase-database.js')
  ]);
  const app = appM.initializeApp(FIREBASE_CONFIG);
  fb = { auth: authM.getAuth(app), db: dbM.getDatabase(app), authM, dbM };
}
const dbRef = path => fb.dbM.ref(fb.db, `users/${S.uid}/${path}`);
const fbStore = {
  /* Ein einziger Abruf für den ganzen Zeitraum, nach Datum (Schlüssel) sortiert */
  async loadDays(dates) {
    if (!dates.length) return [];
    const sorted = [...dates].sort();
    const q = fb.dbM.query(dbRef('days'), fb.dbM.orderByKey(), fb.dbM.startAt(sorted[0]), fb.dbM.endAt(sorted[sorted.length - 1]));
    const val = (await fb.dbM.get(q)).val() || {};
    return dates.map(d => normalizeDay(val[d]));
  },
  async saveDay(date, day) { await fb.dbM.set(dbRef('days/' + date), clean(day)); },
  async loadProfile() { const s = await fb.dbM.get(dbRef('profile')); return s.exists() ? s.val() : null; },
  async saveProfile(p) { await fb.dbM.set(dbRef('profile'), clean(p)); },
  async loadLibrary() { const s = await fb.dbM.get(dbRef('library')); return s.exists() ? normLib(s.val()) : emptyLib(); },
  async saveLibrary(l) { await fb.dbM.set(dbRef('library'), clean(l)); }
};
let store = localStore;

/* Speichern in Reihenfolge pro Dokument, damit ein später gestarteter Speichervorgang nie von einem früheren überholt wird */
const saveChains = {};
function queueSave(id, fn) {
  saveChains[id] = (saveChains[id] || Promise.resolve()).catch(() => { }).then(fn);
  return saveChains[id];
}
async function persistDay(date) {
  try { await queueSave('day:' + date, () => store.saveDay(date, getDay(date))); }
  catch (e) { console.error(e); toast('Speichern fehlgeschlagen. Die Änderung ist nur hier sichtbar.'); }
}
async function persistLib() {
  try { await queueSave('lib', () => store.saveLibrary(S.lib)); }
  catch (e) { console.error(e); toast('Die Bibliothek konnte nicht gespeichert werden.'); }
}
function updateDay(date, fn) {
  const d = clean(getDay(date)); fn(d);
  S.days[date] = normalizeDay(d);
  renderAll();
  return persistDay(date);
}
function updateLib(fn) {
  const l = clean(S.lib); fn(l);
  S.lib = normLib(l);
  renderAll(); refreshAddModal();
  return persistLib();
}

async function loadDates(dates) {
  const todo = dates.filter(d => !S.days[d]);
  if (!todo.length) return;
  const arr = await store.loadDays(todo);
  todo.forEach((d, i) => { if (!S.days[d]) S.days[d] = arr[i]; });   // überschreibt keine Änderung, die du währenddessen gemacht hast
}
async function loadWeek(force = false) {
  const dates = weekDates(S.monday);
  if (force) dates.forEach(d => { delete S.days[d]; });
  try { await loadDates(dates); }
  catch (e) {
    console.error(e); toast('Die Woche konnte nicht geladen werden. Prüfe deine Verbindung und die Regeln der Realtime Database.');
    dates.forEach(d => { if (!S.days[d]) S.days[d] = emptyDay(); });
  }
}
async function loadAll() {
  try { const p = await store.loadProfile(); if (p) S.profile = { ...S.profile, ...p }; } catch (e) { console.error(e); }
  try { S.lib = await store.loadLibrary(); } catch (e) { console.error(e); toast('Die Bibliothek konnte nicht geladen werden.'); }
  await loadWeek();
}

async function fetchJson(url, ms = 15000) {
  const c = new AbortController(); const t = setTimeout(() => c.abort(), ms);
  try {
    const r = await fetch(url, { signal: c.signal });
    if (!r.ok) { const err = new Error('HTTP ' + r.status); err.status = r.status; throw err; }
    return await r.json();
  } finally { clearTimeout(t); }
}
const OFF_FIELDS = 'code,product_name,product_name_de,brands,nutriments,nova_group,nutriscore_grade';

async function searchOFF(q) {
  const base = `https://world.openfoodfacts.org/cgi/search.pl?search_terms=${encodeURIComponent(q)}&search_simple=1&action=process&json=1&page_size=20&lc=de&sort_by=unique_scans_n&fields=${OFF_FIELDS}`;
  const de = '&tagtype_0=countries&tag_contains_0=contains&tag_0=germany';
  let data = await fetchJson(base + de);
  if (!(data.products || []).length) data = await fetchJson(base);
  return (data.products || []).map(fromOFF).filter(Boolean);
}
async function lookupOFF(code) {
  const data = await fetchJson(`https://world.openfoodfacts.org/api/v2/product/${encodeURIComponent(code)}.json?fields=${OFF_FIELDS}`);
  return data.status === 1 ? fromOFF(data.product) : null;
}
async function searchUSDA(q) {
  const url = `https://api.nal.usda.gov/fdc/v1/foods/search?api_key=${encodeURIComponent(USDA_API_KEY)}&query=${encodeURIComponent(q)}&dataType=Foundation,SR%20Legacy&pageSize=20`;
  const data = await fetchJson(url);
  return (data.foods || []).map(fromUSDA).filter(Boolean);
}

function nutrientRowHTML(n, t, target) {
  const e = t[n.key];
  const cov = coverage(e.sum, target);
  const val = `<b>${fmtNum(e.sum, n.dec)}</b>${target ? ` / ${target.type === 'max' ? 'max. ' : ''}${fmtNum(target.value, n.dec)}` : ''} ${n.unit}`;
  const gap = e.missing > 0 ? `<div class="gap">Bei ${e.missing} von ${e.n} Einträgen fehlt diese Angabe. Der echte Wert liegt vermutlich höher.</div>` : '';
  const bar = cov ? `<div class="bar" role="img" aria-label="${Math.round(cov.pct * 100)} Prozent des Richtwerts"><div class="fill ${cov.cls}" style="width:${cov.fill.toFixed(1)}%"></div><div class="tick"></div></div>` : '';
  return `<div class="nrow"><div class="nname">${n.label}</div><div class="nval">${val}</div>${bar}${gap}</div>`;
}

function novaHTML(items) {
  const foods = items.filter(it => it.kind !== 'supp');
  if (!foods.length) return '';
  const c = countNova(foods);
  const total = foods.length;
  const segs = [1, 2, 3, 4, 0].filter(k => c[k]).map(k => `<span style="width:${c[k] / total * 100}%;background:${NOVA_META[k][1]}"></span>`).join('');
  const legend = [1, 2, 3, 4, 0].filter(k => c[k]).map(k =>
    `<li><span class="dot" style="background:${NOVA_META[k][1]}"></span>${NOVA_META[k][0]}: ${c[k]} von ${total}</li>`).join('');
  return `<div class="group"><h3>Verarbeitungsgrad der Einträge</h3><div class="nova-bar" role="img" aria-label="Verteilung der Nova-Gruppen">${segs}</div><ul class="legend">${legend}</ul></div>`;
}

function mealsHTML(items, nDays) {
  const mt = mealTotals(items);
  const total = Object.values(mt).reduce((a, b) => a + b, 0);
  if (!(total > 0)) return '';
  const rows = MEALS.filter(m => mt[m.id] > 0).map(m => {
    const v = mt[m.id] / nDays;
    return `<div class="nrow"><div class="nname">${m.label}</div><div class="nval"><b>${fmtNum(v)}</b> kcal, ${Math.round(mt[m.id] / total * 100)} %</div>
      <div class="bar" role="img" aria-label="${Math.round(mt[m.id] / total * 100)} Prozent der Kalorien"><div class="fill neutral" style="width:${(mt[m.id] / total * 100).toFixed(1)}%"></div></div></div>`;
  }).join('');
  return `<div class="group"><h3>Kalorien nach Mahlzeit</h3>${rows}</div>`;
}

function evalHTML() {
  const targets = computeTargets(S.profile);
  let tot, items, sub, water, sportLine = '', nDays = 1;
  if (S.view === 'day') {
    const day = getDay(S.selected);
    items = day.items; tot = sumItems(items); sub = dateLabel(S.selected); water = day.water;
    const sk = sumSport(day.sport);
    if (sk > 0) sportLine = `<p class="sub" style="margin:2px 0 0">Sport verbraucht etwa ${fmtNum(sk)} kcal (deine Angabe).</p>`;
  } else {
    const days = weekDates(S.monday).map(getDay);
    const a = averageDays(days.map(d => d.items));
    tot = a.tot; items = days.flatMap(d => d.items); nDays = Math.max(1, a.days);
    sub = `Durchschnitt pro Tag, ${a.days} von 7 Tagen mit Einträgen`;
    const wd = days.filter(d => d.water > 0);
    water = wd.length ? wd.reduce((s, d) => s + d.water, 0) / wd.length : 0;
    const sk = days.reduce((s, d) => s + sumSport(d.sport), 0);
    if (sk > 0) sportLine = `<p class="sub" style="margin:2px 0 0">Sport in dieser Woche: etwa ${fmtNum(sk)} kcal (deine Angaben).</p>`;
  }
  const head = `
    <div class="eval-head"><h2>Auswertung</h2>
      <div class="seg" role="group" aria-label="Zeitraum">
        <button data-action="view" data-view="day" aria-pressed="${S.view === 'day'}">Tag</button>
        <button data-action="view" data-view="week" aria-pressed="${S.view === 'week'}">Woche</button>
      </div></div>
    <p class="sub">${esc(sub)}</p>`;
  if (!items.length && !(water > 0)) {
    return `<aside class="eval">${head}<p class="empty">Hier ist noch nichts zu sehen. Trage Essen ein, dann siehst du, welche Nährstoffe gedeckt sind und welche fehlen.</p></aside>`;
  }
  const wcov = coverage(water, { value: WATER_TARGET, type: 'min' });
  const waterRow = `<div class="group"><h3>Wasser</h3><div class="nrow"><div class="nname">${S.view === 'week' ? 'Durchschnitt an Tagen mit Eintrag' : 'Getrunken'}</div>
    <div class="nval"><b>${fmtNum(water)}</b> / ${fmtNum(WATER_TARGET)} ml</div>
    <div class="bar" role="img" aria-label="${Math.round(wcov.pct * 100)} Prozent des Richtwerts"><div class="fill ${wcov.cls}" style="width:${wcov.fill.toFixed(1)}%"></div><div class="tick"></div></div></div></div>`;
  const groups = items.length ? GROUPS.map(g => `<div class="group"><h3>${g}</h3>${NUTRIENTS.filter(n => n.group === g).map(n => nutrientRowHTML(n, tot, targets[n.key])).join('')}</div>`).join('') : '';
  const kcalGap = tot.kcal.missing ? `<div class="gap">Bei ${tot.kcal.missing} von ${tot.kcal.n} Einträgen fehlen die Kalorien.</div>` : '';
  return `<aside class="eval">${head}
    <div class="kcal">${fmtNum(tot.kcal.sum)} <small>kcal</small></div>${kcalGap}${sportLine}
    ${mealsHTML(items, nDays)}${waterRow}${groups}${novaHTML(items)}
    <p class="foot">Der senkrechte Strich markiert 100 Prozent des Richtwerts. Die Richtwerte sind vereinfacht nach den D-A-CH-Referenzwerten für Erwachsene (Wasser: Getränkemenge nach DGE, Koffein: Obergrenze der EFSA) und kein medizinischer Rat. Eiweiß rechnet mit 0,8 g pro kg Körpergewicht. Für Cholesterin, gesättigte Fette und Omega-3 gibt es hier keinen Richtwert. Bei Nahrungsergänzung wird nicht geprüft, ob Obergrenzen überschritten sind.</p>
  </aside>`;
}

const histDates = n => { const t = parseDate(todayStr()); return Array.from({ length: n }, (_, i) => fmtDate(addDays(t, i - n + 1))); };

function chartHTML(series, meta, target) {
  const W = 720, H = 280, L = 54, R = 14, T = 16, B = 30, iw = W - L - R, ih = H - T - B;
  const vals = series.map(s => s.value).filter(v => v !== null);
  if (!vals.length) return '<p class="empty">In diesem Zeitraum gibt es noch keine Daten.</p>';
  const isLine = meta.key === 'weight';
  let lo = 0, hi = Math.max(...vals, target && !isLine ? target.value : 0);
  if (isLine) { lo = Math.min(...vals); hi = Math.max(...vals); const p = Math.max(0.5, (hi - lo) * 0.25); lo = Math.floor(lo - p); hi = Math.ceil(hi + p); }
  else hi = niceMax(hi);
  const yOf = v => T + ih - (v - lo) / (hi - lo) * ih;
  const N = series.length, slot = iw / N;
  const xC = i => L + slot * (i + 0.5);
  const tdec = hi - lo < 10 ? 1 : 0;
  let g = '';
  for (let i = 0; i <= 3; i++) {
    const v = lo + (hi - lo) * i / 3, y = yOf(v);
    g += `<line x1="${L}" x2="${W - R}" y1="${y.toFixed(1)}" y2="${y.toFixed(1)}" stroke="var(--line)" stroke-width="1"/>
      <text x="${L - 8}" y="${(y + 4).toFixed(1)}" text-anchor="end" font-size="11" fill="var(--muted)">${fmtNum(v, tdec)}</text>`;
  }
  const step = Math.ceil(N / 8);
  series.forEach((s, i) => { if (i % step === 0 || i === N - 1 && N <= 8) g += `<text x="${xC(i).toFixed(1)}" y="${H - 8}" text-anchor="middle" font-size="11" fill="var(--muted)">${shortDate(s.date)}</text>`; });
  let marks = '';
  if (!isLine) {
    const bw = Math.max(2, Math.min(24, slot * 0.7)), yb = T + ih;
    series.forEach((s, i) => {
      if (s.value === null || s.value <= 0) return;
      const h = Math.max(1, (s.value - lo) / (hi - lo) * ih), y = yb - h, x = xC(i) - bw / 2, r = Math.min(4, bw / 2, h);
      marks += `<path d="M${x.toFixed(1)} ${yb} V${(y + r).toFixed(1)} Q${x.toFixed(1)} ${y.toFixed(1)} ${(x + r).toFixed(1)} ${y.toFixed(1)} H${(x + bw - r).toFixed(1)} Q${(x + bw).toFixed(1)} ${y.toFixed(1)} ${(x + bw).toFixed(1)} ${(y + r).toFixed(1)} V${yb} Z" fill="var(--leaf)"/>`;
    });
  } else {
    const pts = series.map((s, i) => s.value === null ? null : [xC(i), yOf(s.value)]).filter(Boolean);
    if (pts.length > 1) marks += `<polyline points="${pts.map(p => p[0].toFixed(1) + ',' + p[1].toFixed(1)).join(' ')}" fill="none" stroke="var(--leaf)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>`;
    pts.forEach(p => { marks += `<circle cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="4" fill="var(--leaf)" stroke="#fff" stroke-width="2"/>`; });
  }
  let tline = '';
  if (target && !isLine && target.value <= hi) {
    const y = yOf(target.value);
    tline = `<line x1="${L}" x2="${W - R}" y1="${y.toFixed(1)}" y2="${y.toFixed(1)}" stroke="var(--ink)" stroke-width="1.5"/>
      <text x="${W - R}" y="${(y - 5).toFixed(1)}" text-anchor="end" font-size="11" font-weight="600" fill="var(--ink)">${target.type === 'max' ? 'Obergrenze' : 'Richtwert'} ${fmtNum(target.value, meta.dec)} ${meta.unit}</text>`;
  }
  const focusable = N <= 31 ? 'tabindex="0"' : '';
  const hits = series.map((s, i) => {
    const txt = `${dateLabel(s.date)}: ${s.value === null ? 'keine Daten' : fmtNum(s.value, meta.dec) + ' ' + meta.unit}`;
    return `<rect class="hit" x="${(L + slot * i).toFixed(1)}" y="${T}" width="${slot.toFixed(1)}" height="${ih}" data-tip="${esc(txt)}" aria-label="${esc(txt)}" ${focusable}></rect>`;
  }).join('');
  const avg = vals.reduce((a, b) => a + b, 0) / vals.length;
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="group" aria-label="${esc(meta.label)}, ${N} Tage, Durchschnitt ${fmtNum(avg, meta.dec)} ${meta.unit}">${g}${tline}${marks}${hits}</svg>`;
}

function histHTML() {
  const metrics = histMetrics();
  const meta = metrics.find(m => m.key === S.hist.metric) || metrics[1];
  const dates = histDates(S.hist.range);
  const series = seriesFor(meta.key, dates, S.days);
  const vals = series.map(s => s.value).filter(v => v !== null);
  const targets = computeTargets(S.profile);
  const target = meta.key === 'water' ? { value: WATER_TARGET, type: 'min' } : targets[meta.key];
  const stat = (v, l) => `<div class="stat"><b>${v}</b><span>${l}</span></div>`;
  const stats = vals.length ? `<div class="stats">${stat(fmtNum(vals.reduce((a, b) => a + b, 0) / vals.length, meta.dec) + ' ' + meta.unit, `Durchschnitt an ${vals.length} Tagen mit Daten`)}${stat(fmtNum(Math.max(...vals), meta.dec) + ' ' + meta.unit, 'Höchster Wert')}${stat(fmtNum(Math.min(...vals), meta.dec) + ' ' + meta.unit, 'Niedrigster Wert')}</div>` : '';
  const rows = series.filter(s => s.value !== null).map(s => `<tr><td>${dateLabel(s.date)}</td><td class="r">${fmtNum(s.value, meta.dec)} ${meta.unit}</td></tr>`).join('');
  return `<section class="page"><div class="page-head"><h2>Verlauf</h2>
    <div class="controls">
      <label class="muted" for="hmetric">Anzeigen</label>
      <select id="hmetric" data-hist="metric">${metrics.map(m => `<option value="${m.key}" ${m.key === meta.key ? 'selected' : ''}>${m.label} (${m.unit})</option>`).join('')}</select>
      <div class="seg" role="group" aria-label="Zeitraum">${[7, 30, 90].map(n => `<button data-action="hist-range" data-range="${n}" aria-pressed="${S.hist.range === n}">${n} Tage</button>`).join('')}</div>
    </div></div>
    ${chartHTML(series, meta, target).replace('class="chart"', `class="chart ${S.hist.loading ? 'loading' : ''}"`)}
    ${S.hist.loading ? '<p class="hint">Lädt …</p>' : ''}
    ${stats}
    <p class="hint">Tage ohne Einträge zählen nicht mit. ${meta.key === 'weight' || meta.key === 'water' ? '' : 'Fehlen bei Produkten Nährwertangaben, liegt der echte Wert höher als angezeigt.'}</p>
    ${rows ? `<details class="tbl"><summary>Zahlen anzeigen</summary><table><thead><tr><th>Tag</th><th class="r">${esc(meta.label)}</th></tr></thead><tbody>${rows}</tbody></table></details>` : ''}
  </section>`;
}

function rowHTML(it, i) {

    chips = `<span class="chip">${fmtNum(p.kcal)} kcal</span><span class="chip">${fmtNum(p.protein, 1)} g Eiweiß</span>${it.source === 'recipe' ? '<span class="chip">Rezept</span>' : ''}${it.source === 'custom' ? '<span class="chip">Eigenes</span>' : ''}${chipsFor(it)}<span class="chip" title="Wie viele der ${MICRO_KEYS.length} Vitamine und Mineralstoffe in den Daten stehen">Vitamine und Mineralstoffe: ${micro} von ${MICRO_KEYS.length}</span>`;
  }
  const fav = isFavRef(it);
  return `<li class="res ${picked ? 'picked' : ''}">
    <div class="iname"><strong>${esc(it.name)}</strong>${it.brand ? `<span class="ibrand">${esc(it.brand)}</span>` : ''}<div class="chips">${chips}</div></div>
    <div class="resact"><button class="x star" data-action="fav-toggle" data-idx="${i}" aria-pressed="${fav}" aria-label="${esc(it.name)} ${fav ? 'aus Favoriten entfernen' : 'zu Favoriten hinzufügen'}">${fav ? '★' : '☆'}</button>
      <button class="btn small" data-action="pick" data-idx="${i}">Auswählen</button></div></li>`;

function renderResults() {
  const m = S.modal; if (!m || m.type !== 'add') return;
  const box = $('#results'); if (!box) return;
  const notAnySupp = x => m.mode === 'log' || x.source !== 'supp';
  const notes = (m.notes || []).map(n => `<p class="hint">${esc(n)}</p>`).join('');
  let html = '';
  if (m.tab === 'search' || m.tab === 'scan') {
    m.shown = m.results;
    const off = m.results.map((it, i) => [it, i]).filter(([it]) => it.source === 'off');
    const usda = m.results.map((it, i) => [it, i]).filter(([it]) => it.source === 'usda');
    if (off.length) html += `<h3>Produkte (Open Food Facts), Werte pro 100 g</h3><ul class="results">${off.map(([it, i]) => rowHTML(it, i)).join('')}</ul>`;
    if (usda.length) html += `<h3>Frische Lebensmittel (USDA), Werte pro 100 g</h3><ul class="results">${usda.map(([it, i]) => rowHTML(it, i)).join('')}</ul>`;
    if (m.loading) html += '<p class="hint">Sucht …</p>';
  } else if (m.tab === 'quick') {
    const fav = S.lib.favorites.filter(notAnySupp);
    const rec = S.lib.recent.filter(notAnySupp).filter(r => !fav.some(f => foodKey(f) === foodKey(r)));
    m.shown = [...fav, ...rec];
    if (fav.length) html += `<h3>Favoriten</h3><ul class="results">${fav.map((it, i) => rowHTML(it, i)).join('')}</ul>`;
    if (rec.length) html += `<h3>Zuletzt gegessen</h3><ul class="results">${rec.map((it, i) => rowHTML(it, fav.length + i)).join('')}</ul>`;
    if (!m.shown.length) html = '<p class="empty">Hier erscheinen deine Favoriten (Stern) und das, was du zuletzt eingetragen hast.</p>';
  } else if (m.tab === 'own') {
    m.shown = S.lib.custom;
    html = m.shown.length ? `<ul class="results">${m.shown.map((it, i) => rowHTML(it, i)).join('')}</ul>` : '<p class="empty">Du hast noch keine eigenen Lebensmittel oder Rezepte.</p>';
    html += `<p class="hint"><button class="link" style="margin:0" data-action="goto-lib">Eigenes Essen und Rezepte anlegen</button></p>`;
  } else if (m.tab === 'supp') {
    m.shown = S.lib.supplements;
    html = m.shown.length ? `<ul class="results">${m.shown.map((it, i) => rowHTML(it, i)).join('')}</ul>` : '<p class="empty">Du hast noch keine Nahrungsergänzung angelegt.</p>';
    html += `<p class="hint"><button class="link" style="margin:0" data-action="goto-lib">Nahrungsergänzung anlegen</button></p>`;
  }
  box.innerHTML = notes + html;
}
function refreshAddModal() {
  const m = S.modal; if (!m || m.type !== 'add') return;
  const prev = m.picked != null ? m.shown[m.picked] : null;
  renderResults();
  if (prev) {
    const idx = m.shown.findIndex(x => foodKey(x) === foodKey(prev));
    m.picked = idx >= 0 ? idx : null;
    if (m.picked === null) renderPending(); else renderResults();
  }
}

function renderPending() {
  const m = S.modal; const box = $('#pending'); if (!m || m.type !== 'add' || !box) return;
  const it = m.picked != null ? m.shown[m.picked] : null;
  if (!it) { box.hidden = true; box.innerHTML = ''; return; }
  const supp = it.source === 'supp';
  const defQty = supp ? 1 : Math.round(it.portion || 100);
  const qty = supp
    ? `<label class="gram"><input id="pqty" type="number" min="0.5" max="50" step="0.5" value="${defQty}" aria-label="Menge"> ${esc(it.unit || 'Stk')}</label>`
    : `<label class="gram"><input id="pqty" type="number" min="1" max="5000" step="1" value="${defQty}" aria-label="Menge in Gramm"> g</label>`;
  const when = m.mode === 'log'
    ? `${supp ? '' : `<select id="pmeal" aria-label="Mahlzeit">${MEALS.filter(x => x.id !== 'erg').map(x => `<option value="${x.id}" ${x.id === m.meal ? 'selected' : ''}>${x.label}</option>`).join('')}</select>`}<input id="ptime" type="time" value="${esc(m.time)}" aria-label="Uhrzeit">`
    : '';
  box.hidden = false;
  box.innerHTML = `<div class="pname">${esc(it.name)}</div>${qty}${when}
    <button class="btn" data-action="add-pending">${m.mode === 'log' ? 'Zum Plan hinzufügen' : 'Als Zutat hinzufügen'}</button>`;
  const g = $('#pqty'); if (g) { g.focus(); g.select(); }
}

async function doSearch(q) {
  const m = S.modal; if (!m || m.type !== 'add') return;
  q = q.trim(); if (q.length < 2) return;
  m.results = []; m.picked = null; m.loading = true; m.notes = [];
  renderPending(); renderResults();
  const en = translateQuery(q);
  const [off, usda] = await Promise.allSettled([searchOFF(q), searchUSDA(en)]);
  if (S.modal !== m) return;
  m.loading = false;
  if (off.status === 'fulfilled') m.results.push(...off.value);
  else m.notes.push('Open Food Facts antwortet gerade nicht. Versuche es gleich noch einmal.');
  if (usda.status === 'fulfilled') m.results.push(...usda.value);
  else if (usda.reason && usda.reason.status === 429) m.notes.push('Das USDA-Limit ist erreicht. Trage in der Datei einen eigenen kostenlosen USDA-Schlüssel ein.');
  else m.notes.push('Die USDA-Datenbank antwortet gerade nicht.');
  if (en !== q.toLowerCase() && usda.status === 'fulfilled') m.notes.push(`Frische Lebensmittel wurden als „${en}“ gesucht.`);
  if (!m.results.length && !m.notes.length) m.notes.push('Nichts gefunden. Probiere einen anderen Begriff oder lege das Essen unter „Eigene“ an.');
  renderResults();
}
async function doLookup(code) {
  const m = S.modal; if (!m || m.type !== 'add') return;
  m.results = []; m.picked = null; m.loading = true; m.notes = [];
  renderPending(); renderResults();
  try {
    const it = await lookupOFF(code.trim());
    if (S.modal !== m) return;
    if (it) m.results = [it];
    else m.notes.push('Dieses Produkt ist in Open Food Facts nicht eingetragen oder hat keine Nährwerte. Suche es per Name oder lege es unter „Eigene“ an.');
  } catch (e) { m.notes.push('Open Food Facts antwortet gerade nicht. Versuche es gleich noch einmal.'); }
  m.loading = false; renderResults();
}

/* Barcode-Scanner (lädt die Bibliothek erst beim Start) */
let scanner = null;
function loadScript(src) {
  return new Promise((res, rej) => {
    if (window.Html5Qrcode) return res();
    const s = document.createElement('script'); s.src = src; s.onload = res;
    s.onerror = () => rej(new Error('Scanner konnte nicht geladen werden'));
    document.head.appendChild(s);
  });
}
async function stopScan() {
  if (!scanner) return;
  const sc = scanner; scanner = null;
  try { await sc.stop(); sc.clear(); } catch { /* bereits gestoppt */ }
}
async function startScan() {
  const m = S.modal; if (!m) return;
  try {
    await loadScript(SCAN_LIB);
    await stopScan();
    const F = window.Html5QrcodeSupportedFormats;
    scanner = new window.Html5Qrcode('reader', { formatsToSupport: [F.EAN_13, F.EAN_8, F.UPC_A, F.UPC_E], useBarCodeDetectorIfSupported: true, verbose: false });
    await scanner.start({ facingMode: 'environment' }, { fps: 10, qrbox: { width: 260, height: 140 } },
      async text => { await stopScan(); const i = $('#pane-scan input'); if (i) i.value = text; doLookup(text); },
      () => { });
  } catch (e) {
    console.error(e); scanner = null;
    m.notes = ['Die Kamera ist nicht verfügbar. Sie braucht HTTPS und deine Erlaubnis. Du kannst die Nummer auch unten eingeben.'];
    renderResults();
  }
}

function valueFieldsHTML(vals, mode) {
  const basis = ['kcal', 'protein', 'fat', 'carbs', 'sugar', 'fiber', 'salt'];
  const groups = [
    ['Nährwerte', basis],
    ['Fette und mehr', NUTRIENTS.filter(n => n.group === 'Fette und mehr').map(n => n.key)],
    ['Vitamine', NUTRIENTS.filter(n => n.group === 'Vitamine').map(n => n.key)],
    ['Mineralstoffe', NUTRIENTS.filter(n => n.group === 'Mineralstoffe').map(n => n.key)]
  ];
  const unitOf = k => k === 'kcal' ? 'kcal' : NUTRIENTS.find(n => n.key === k).unit;
  const input = k => {
    const v = vals && vals[k] != null ? String(Math.round(vals[k] * 1000) / 1000).replace('.', ',') : '';
    return `<div class="field"><label for="v_${k}">${labelOf(k)} (${unitOf(k)})</label><input id="v_${k}" name="v_${k}" type="text" inputmode="decimal" value="${esc(v)}" placeholder="${mode === 'unit' ? '0' : 'unbekannt'}"></div>`;
  };
  return groups.map(([title, keys], gi) => {
    const open = gi === 0 || keys.some(k => vals && vals[k] != null);
    return `<details class="fd" ${open ? 'open' : ''}><summary>${title}</summary><div class="fgrid">${keys.map(input).join('')}</div></details>`;
  }).join('');
}
function readValueFields(data) {
  const f = {}; for (const k of ALL_KEYS) f[k] = data['v_' + k];
  return parseValueFields(f);
}

function draftPreview(d) {
  const ings = d.ingredients;
  if (!ings.length) return '<p class="hint">Füge mindestens eine Zutat hinzu.</p>';
  const total = parseDecimal(d.total);
  const calc = computeRecipe(ings, Number.isNaN(total) ? null : total);
  const pc = parseDecimal(d.portions);
  const portion = pc && !Number.isNaN(pc) && pc >= 1 ? ` Eine Portion hat etwa ${fmtNum(Math.round(calc.total / pc))} g und ${fmtNum(calc.per100.kcal != null ? calc.per100.kcal * calc.total / pc / 100 : null)} kcal.` : '';
  const inc = calc.incomplete.length ? `<br>Bei einigen Zutaten fehlen Angaben zu ${calc.incomplete.slice(0, 4).map(labelOf).join(', ')}${calc.incomplete.length > 4 ? ' und mehr' : ''}. Diese Werte sind dann Mindestwerte.` : '';
  return `<div class="preview"><strong>Pro 100 g:</strong> ${fmtNum(calc.per100.kcal)} kcal, ${fmtNum(calc.per100.protein, 1)} g Eiweiß, ${fmtNum(calc.per100.fat, 1)} g Fett, ${fmtNum(calc.per100.carbs, 1)} g Kohlenhydrate.<br>Gesamtgewicht ${fmtNum(Math.round(calc.total))} g.${portion}${inc}</div>`;
}

        <div class="field"><label for="rp">Portionen (optional)</label><input id="rp" name="portions" type="text" inputmode="decimal" value="${esc(d.portions)}"></div></div>
      <p class="hint">Das fertige Gewicht ist wichtig, wenn beim Kochen Wasser verdampft. Wiege dazu das fertige Gericht.</p>

async function copyText(text) {
  try { if (navigator.clipboard && navigator.clipboard.writeText) { await navigator.clipboard.writeText(text); return true; } } catch { /* weiter */ }
  try {
    const ta = document.createElement('textarea'); ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.select(); const ok = document.execCommand('copy'); ta.remove(); return ok;
  } catch { return false; }
}
function toggleFav(ref) {
  return updateLib(l => {
    const k = foodKey(ref), i = l.favorites.findIndex(f => foodKey(f) === k);
    if (i >= 0) l.favorites.splice(i, 1); else l.favorites.unshift(ref);
  });
}
const validQty = (q, max) => q !== null && !Number.isNaN(q) && q > 0 && q <= max;

document.addEventListener('click', async e => {
  const el = e.target.closest('[data-action]'); if (!el) return;
  const a = el.dataset.action;
  switch (a) {
    case 'page': {
      S.page = el.dataset.page; renderAll();
      if (S.page === 'history') ensureHistory();
      break;
    }
    case 'select': S.selected = el.dataset.date; renderAll(); break;
    case 'add': openAdd(el.dataset.date); break;
    case 'close-modal': dismissModal(); break;
    case 'goto-lib': closeModal(); S.page = 'lib'; renderAll(); break;
    case 'tab': {
      const m = S.modal; if (!m || m.type !== 'add') break;
      const t = el.dataset.tab; m.tab = t; m.picked = null;
      document.querySelectorAll('.tabs button').forEach(b => b.setAttribute('aria-selected', String(b.dataset.tab === t)));
      $('#pane-search').hidden = t !== 'search'; $('#pane-scan').hidden = t !== 'scan';
      if (t !== 'scan') stopScan();
      renderResults(); renderPending();
      break;
    }
    case 'start-scan': startScan(); break;
    case 'pick': { const m = S.modal; if (m && m.type === 'add') { m.picked = Number(el.dataset.idx); renderResults(); renderPending(); } break; }
    case 'fav-toggle': { const m = S.modal; const f = m && m.shown[Number(el.dataset.idx)]; if (f) await toggleFav(f); break; }
    case 'fav-item': {
      const it = getDay(el.dataset.date).items.find(x => x.id === el.dataset.id);
      if (it) await toggleFav(toFoodRef(it)); break;
    }
    case 'fav-remove': await updateLib(l => { l.favorites = l.favorites.filter(f => foodKey(f) !== el.dataset.key); }); break;
    case 'add-pending': {
      const m = S.modal; if (!m || m.type !== 'add' || m.picked == null) break;
      const food = m.shown[m.picked]; const supp = food.source === 'supp';
      const q = parseDecimal($('#pqty').value);
      if (!validQty(q, supp ? 50 : 5000)) { toast(supp ? 'Gib eine Menge zwischen 0,5 und 50 ein.' : 'Gib eine Menge zwischen 1 und 5000 Gramm ein.'); break; }
      const qty = supp ? q : Math.round(q);
      if (m.mode === 'pick') { const cb = m.onPick; closeModal(); if (cb) cb(food, qty); break; }
      const meal = supp ? 'erg' : ($('#pmeal') ? $('#pmeal').value : m.meal);
      const time = $('#ptime') ? $('#ptime').value : '';
      const item = makeItem(food, qty, meal, time);
      const date = m.date;
      m.picked = null; renderResults(); renderPending();
      toast(`${food.name} ist im Plan.`);
      await updateDay(date, d => { d.items.push(item); });
      await updateLib(l => { l.recent = pushRecent(l.recent, toFoodRef(item)); });
      break;
    }
    case 'remove': {
      const { date, id } = el.dataset;
      await updateDay(date, d => { d.items = d.items.filter(x => x.id !== id); }); break;
    }
    case 'edit-item': openEditItem(el.dataset.date, el.dataset.id); break;
    case 'water': {
      const ml = Number(el.dataset.ml);
      await updateDay(el.dataset.date, d => { d.water = Math.max(0, (Number(d.water) || 0) + ml); }); break;
    }
    case 'sport-remove': {
      const { date, id } = el.dataset;
      await updateDay(date, d => { d.sport = d.sport.filter(s => s.id !== id); }); break;
    }
    case 'prev-week': changeWeek(addDays(S.monday, -7)); break;
    case 'next-week': changeWeek(addDays(S.monday, 7)); break;
    case 'today': changeWeek(mondayOf(new Date())); break;
    case 'view': S.view = el.dataset.view; renderAll(); break;
    case 'hist-range': S.hist.range = Number(el.dataset.range); ensureHistory(); break;
    case 'shop-copy': {
      const list = currentShopList(); const wk = fmtDate(S.monday);
      const open = list.filter(e2 => !S.lib.shopChecked[shopKey(wk, e2.key)]);
      const text = `Einkaufsliste ${weekLabel()}\n` + open.map(e2 => `- ${e2.name}: ${fmtAmount(e2.grams)}`).join('\n');
      toast(await copyText(text) ? 'Liste kopiert.' : 'Kopieren hat nicht geklappt.'); break;
    }
    case 'settings': openSettings(); break;
    case 'lib-new': {
      const k = el.dataset.kind;
      if (k === 'food') openFoodEditor(); else if (k === 'recipe') openRecipeEditor(); else if (k === 'supp') openSuppEditor();
      break;
    }
    case 'lib-edit': {
      const { kind, id } = el.dataset;
      if (kind === 'food') openFoodEditor(id); else if (kind === 'recipe') openRecipeEditor(id); else if (kind === 'supp') openSuppEditor(id);
      break;
    }
    case 'lib-delete': {
      const { kind, id } = el.dataset;
      const pool = kind === 'supp' ? S.lib.supplements : S.lib.custom;
      const it = pool.find(x => x.id === id); if (!it) break;
      if (!window.confirm(`„${it.name}“ löschen? Bereits eingetragene Mahlzeiten bleiben unverändert.`)) break;
      const key = foodKey(it);
      await updateLib(l => {
        l.custom = l.custom.filter(x => x.id !== id); l.supplements = l.supplements.filter(x => x.id !== id);
        l.favorites = l.favorites.filter(f => foodKey(f) !== key); l.recent = l.recent.filter(f => foodKey(f) !== key);
      });
      break;
    }
    case 'ing-add': {
      syncDraft();
      openAdd(S.selected, 'pick', (food, grams) => {
        S.draft.ingredients.push({ name: food.name, source: food.source, code: food.code || '', grams, per100: food.per100 || {}, incomplete: food.incomplete || [] });
        openRecipeEditor(S.draft);
      });
      break;
    }
    case 'ing-remove': {
      syncDraft(); S.draft.ingredients.splice(Number(el.dataset.idx), 1); openRecipeEditor(S.draft); break;
    }
    case 'auth-toggle': S.authMode = S.authMode === 'login' ? 'signup' : 'login'; S.authError = ''; renderAll(); break;
    case 'logout': closeModal(); try { await fb.authM.signOut(fb.auth); } catch (err) { console.error(err); } break;
  }
});

document.addEventListener('submit', async e => {
  const f = e.target.closest('[data-form]'); if (!f) return;
  e.preventDefault();
  const kind = f.dataset.form;
  const data = Object.fromEntries(new FormData(f));
  if (kind === 'search') doSearch(data.q || '');
  else if (kind === 'code') doLookup(String(data.code || '').replace(/\D/g, ''));
  else if (kind === 'settings') {
    const w = Number(data.weight);
    if (!(w >= 30 && w <= 250)) { toast('Gib ein Gewicht zwischen 30 und 250 kg ein.'); return; }
    S.profile = { sex: data.sex === 'w' ? 'w' : 'm', weight: Math.round(w) };
    closeModal(); renderAll();
    try { await store.saveProfile(S.profile); } catch (err) { console.error(err); toast('Das Profil konnte nicht gespeichert werden.'); }
  } else if (kind === 'auth') {
    try {
      S.authError = '';
      if (S.authMode === 'login') await fb.authM.signInWithEmailAndPassword(fb.auth, data.email, data.password);
      else await fb.authM.createUserWithEmailAndPassword(fb.auth, data.email, data.password);
    } catch (err) { S.authError = authMsg(err.code); renderAll(); }
  } else if (kind === 'weight') {
    const w = parseDecimal(data.weight);
    if (Number.isNaN(w) || (w !== null && !(w >= 20 && w <= 400))) { toast('Gib ein Gewicht zwischen 20 und 400 kg ein.'); return; }
    await updateDay(data.date, d => { d.weight = w; });
  } else if (kind === 'sport') {
    const name = String(data.name || '').trim();
    const mins = parseDecimal(data.minutes), kc = parseDecimal(data.kcal);
    if (!name) return;
    if (Number.isNaN(mins) || Number.isNaN(kc) || (mins !== null && mins <= 0) || (kc !== null && kc < 0)) { toast('Minuten und Kalorien müssen Zahlen sein.'); return; }
    await updateDay(data.date, d => { d.sport.push({ id: uid(), name, minutes: mins, kcal: kc }); });
  } else if (kind === 'edit-item') {
    const m = S.modal; if (!m || m.type !== 'edit') return;
    const it = getDay(m.date).items.find(x => x.id === m.id); if (!it) { closeModal(); return; }
    const supp = it.kind === 'supp';
    const q = parseDecimal(data.qty);
    if (!validQty(q, supp ? 50 : 5000)) { showFormError(f, supp ? 'Gib eine Menge zwischen 0,5 und 50 ein.' : 'Gib eine Menge zwischen 1 und 5000 Gramm ein.'); return; }
    const time = /^\d\d:\d\d$/.test(data.time || '') ? data.time : '';
    const meal = supp ? 'erg' : (MEALS.some(x => x.id === data.meal) ? data.meal : it.meal);
    const date = m.date, id = m.id;
    closeModal();
    await updateDay(date, d => { const x = d.items.find(y => y.id === id); if (x) { if (supp) x.qty = q; else x.grams = Math.round(q); x.meal = meal; x.time = time; } });
  } else if (kind === 'food-editor') {
    const name = String(data.name || '').trim();
    if (!name) { showFormError(f, 'Gib einen Namen ein.'); return; }
    const { per, bad } = readValueFields(data);
    if (bad.length) { showFormError(f, `Das ist keine gültige Zahl: ${bad.map(labelOf).join(', ')}.`); return; }
    const msg = validateFood(per, 'per100'); if (msg) { showFormError(f, msg); return; }
    const portion = parseDecimal(data.portion);
    if (Number.isNaN(portion) || (portion !== null && portion <= 0)) { showFormError(f, 'Die Portion muss eine Zahl über 0 sein.'); return; }
    const nova = Number(data.nova) >= 1 && Number(data.nova) <= 4 ? Number(data.nova) : null;
    const food = { id: data.id || uid(), source: 'custom', name, brand: String(data.brand || '').trim(), code: '', per100: per, nova, nutri: null, incomplete: [], portion: portion ? Math.round(portion) : null };
    closeModal();
    await updateLib(l => { const i = l.custom.findIndex(x => x.id === food.id); if (i >= 0) l.custom[i] = food; else l.custom.push(food); });
  } else if (kind === 'supp-editor') {
    const name = String(data.name || '').trim(), unit = String(data.unit || '').trim();
    if (!name || !unit) { showFormError(f, 'Gib Name und Einheit ein.'); return; }
    const { per, bad } = readValueFields(data);
    if (bad.length) { showFormError(f, `Das ist keine gültige Zahl: ${bad.map(labelOf).join(', ')}.`); return; }
    const msg = validateFood(per, 'unit'); if (msg) { showFormError(f, msg); return; }
    const perUnit = {}; for (const k of ALL_KEYS) if (per[k] != null) perUnit[k] = per[k];
    const supp = { id: data.id || uid(), source: 'supp', name, unit, perUnit };
    closeModal();
    await updateLib(l => { const i = l.supplements.findIndex(x => x.id === supp.id); if (i >= 0) l.supplements[i] = supp; else l.supplements.push(supp); });
  } else if (kind === 'recipe-editor') {
    syncDraft(); const d = S.draft;
    const name = String(d.name || '').trim();
    if (!name) { showFormError(f, 'Gib einen Namen ein.'); return; }
    if (!d.ingredients.length) { showFormError(f, 'Füge mindestens eine Zutat hinzu.'); return; }
    const total = parseDecimal(d.total), portions = parseDecimal(d.portions);
    if (Number.isNaN(total) || (total !== null && total <= 0)) { showFormError(f, 'Das fertige Gewicht muss eine Zahl über 0 sein.'); return; }
    if (Number.isNaN(portions) || (portions !== null && portions < 1)) { showFormError(f, 'Die Zahl der Portionen muss mindestens 1 sein.'); return; }
    const calc = computeRecipe(d.ingredients, total);
    const food = {
      id: d.id || uid(), source: 'recipe', name, brand: '', code: '', per100: calc.per100, nova: null, nutri: null,
      incomplete: calc.incomplete, ingredients: d.ingredients, recipeTotal: calc.total,
      portions: portions ? Math.round(portions) : null, portion: portions ? Math.round(calc.total / portions) : null
    };
    S.draft = null; closeModal();
    await updateLib(l => { const i = l.custom.findIndex(x => x.id === food.id); if (i >= 0) l.custom[i] = food; else l.custom.push(food); });
  }
});

document.addEventListener('change', async e => {
  const t = e.target;
  if (t.matches('input[data-qty]')) {
    const { date, qty: id } = t.dataset;
    const it = getDay(date).items.find(x => x.id === id); if (!it) return;
    const supp = it.kind === 'supp';
    const q = parseDecimal(t.value);
    if (!validQty(q, supp ? 50 : 5000)) { toast(supp ? 'Gib eine Menge zwischen 0,5 und 50 ein.' : 'Gib eine Menge zwischen 1 und 5000 Gramm ein.'); renderAll(); return; }
    await updateDay(date, d => { const x = d.items.find(y => y.id === id); if (x) { if (supp) x.qty = q; else x.grams = Math.round(q); } });
  } else if (t.matches('input[data-time]')) {
    const { date, time: id } = t.dataset;
    await updateDay(date, d => { const x = d.items.find(y => y.id === id); if (x) x.time = /^\d\d:\d\d$/.test(t.value) ? t.value : ''; });
  } else if (t.id === 'pmeal' && S.modal && S.modal.type === 'add') {
    const m = S.modal; m.meal = t.value; m.mealTouched = true;
    if (!m.timeTouched) { m.time = (MEALS.find(x => x.id === t.value) || {}).def || m.time; const ti = $('#ptime'); if (ti) ti.value = m.time; }
  } else if (t.id === 'ptime' && S.modal && S.modal.type === 'add') {
    const m = S.modal; m.time = t.value; m.timeTouched = true;
    if (!m.mealTouched && t.value) { m.meal = mealForTime(t.value); const ms = $('#pmeal'); if (ms) ms.value = m.meal; }
  } else if (t.matches('input[data-shop]')) {
    const k = shopKey(fmtDate(S.monday), t.dataset.shop), on = t.checked;
    await updateLib(l => { if (on) l.shopChecked[k] = true; else delete l.shopChecked[k]; });
  } else if (t.matches('input[data-shopopt]')) {
    S.shopFromToday = t.checked; renderAll();
  } else if (t.matches('select[data-hist]')) {
    S.hist.metric = t.value; renderAll();
  } else if (t.matches('input[data-ing-grams], #rt, #rp') && S.modal && S.modal.type === 'recipe') {
    syncDraft(); const p = $('#rpreview'); if (p) p.innerHTML = draftPreview(S.draft);
  }
});

/* Hover und Tastaturfokus im Diagramm */
const tipEl = () => $('#tip');
function showTip(target, x, y) {
  const t = tipEl(); t.textContent = target.getAttribute('data-tip'); t.hidden = false;
  const r = t.getBoundingClientRect();
  t.style.left = Math.max(8, Math.min(window.innerWidth - r.width - 8, x + 12)) + 'px';
  t.style.top = Math.max(8, y - r.height - 12) + 'px';
}
document.addEventListener('pointermove', e => {
  const h = e.target.closest && e.target.closest('.hit');
  if (h) showTip(h, e.clientX, e.clientY); else tipEl().hidden = true;
});
document.addEventListener('focusin', e => {
  const h = e.target.closest && e.target.closest('.hit');
  if (h) { const r = h.getBoundingClientRect(); showTip(h, r.left + r.width / 2, r.top + 20); }
});
document.addEventListener('focusout', e => { if (e.target.closest && e.target.closest('.hit')) tipEl().hidden = true; });
document.addEventListener('keydown', e => { if (e.key === 'Escape' && S.modal) dismissModal(); });

/* ---------------------------------------------------------------------
   Start
   --------------------------------------------------------------------- */
async function boot() {
  renderAll();
  if (!FIREBASE_READY && FIREBASE_CONFIG.apiKey && !String(FIREBASE_CONFIG.apiKey).startsWith('DEIN')) {
    S.initError = `Die Firebase-Daten sind noch nicht vollständig. Es fehlt: ${FIREBASE_MISSING.join(', ')}. Bis dahin läufst du im Testmodus.`;
  }
  if (FIREBASE_READY) {
    try {
      await initFirebase();
      store = fbStore; S.mode = 'firebase';
      fb.authM.onAuthStateChanged(fb.auth, async u => {
        S.user = u; S.uid = u ? u.uid : null; S.days = {}; S.lib = emptyLib();
        if (u) await loadAll();
        S.booting = false; renderAll();
      });
      return;
    } catch (e) {
      console.error(e);
      S.initError = 'Firebase konnte nicht geladen werden. Du bist im Testmodus, die Daten bleiben nur in diesem Browser.';
      S.mode = 'local'; store = localStore;
    }
  }
  await loadAll(); S.booting = false; renderAll();
}
boot();
</script>
